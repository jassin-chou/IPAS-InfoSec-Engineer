律遵循性（Legal compliance）","可用性（Availability）","機密性（Confidentiality）"],"a":3,"e":"加解密主要用於防止未授權者讀取，確保「機密性」。"},{"id":"E1-38","i":"m7","s":"E","n":38,"q":"關於雜湊函式（Hash Function），下列敘述何者正確？","o":["雜湊函式主要用於資料傳輸時的機密性保護","雜湊函式演算法安全性導因於解離散對數的困難度","雜湊函式可將任何長度的資料轉換成固定長度的訊息特徵值","雜湊值可以透過解密方式還原為原始訊息，具有可逆性"],"a":2,"e":"雜湊函式將任意長度資料轉為固定長度摘要，單向不可逆，用於完整性驗證。"},{"id":"E1-39","i":"m7","s":"E","n":39,"q":"為有效防範「預運算雜湊攻擊」（如彩虹表攻擊），並確保相同密碼在系統中產生的雜湊值具有唯一性，系統通常會在執行雜湊運算前，於明文密碼中加入一段隨機產生的唯一字串，下列哪一項是此種技術於密碼學領域之專業術語？","o":["鹽值（Salt）","憑證（Certificate）","數位信封（Digital Envelope）","訊息摘要（Message Digest）"],"a":0,"e":"在雜湊前加入隨機唯一字串稱為「鹽值（Salt）」，可抵禦彩虹表攻擊。"},{"id":"E1-40","i":"m7","s":"E","n":40,"q":"某企業為確保發布於官網的軟體更新檔在傳輸過程中未遭惡意竄改，擬提供該檔案的「數位摘要（Message Digest）」供使用者比對驗證。此技術必須具備「無法反推原始檔案內容」的單向特性，下列何項技術最適切？","o":["數位簽章（Digital Signature）","對稱式加密（Symmetric Encryption）","雜湊函數（Hash Function）","非對稱式加密（Asymmetric-Key Encryption）"],"a":2,"e":"雜湊函數具單向性且產生數位摘要，最適合檔案完整性比對。"},{"id":"E1-41","i":"m5","s":"E","n":41,"q":"某企業的供應鏈廠商遭受網路攻擊，導致企業的資料外洩。下列何措施最能降低供應鏈風險？","o":["選擇報價最便宜的供應商","對供應商進行資安評估和審查","限制與供應商的資料共享","將所有供應鏈管理工作外包"],"a":1,"e":"對供應商進行資安評估與審查（含契約要求、定期稽核）是降低供應鏈風險的關鍵措施。"},{"id":"E1-42","i":"m8","s":"E","n":42,"q":"依據 NIST SP 800-61 所描述之「資安事件處理生命週期」，下列何項為第二階段偵測與分析（Detection and Analysis）的任務之一？","o":["隔離受影響主機、移除惡意程式並修補弱點","檢討並改善缺失，避免後續類似事件再度發生","封鎖並排除發生事件的根本原因後恢復正常運作","依觀測到的跡證進行影響範圍界定與嚴重度分級"],"a":3,"e":"NIST SP 800-61 第二階段「偵測與分析」：依跡證界定影響範圍並分級；(A)(C) 屬圍堵根除復原，(B) 屬事後活動。"},{"id":"E1-43","i":"m8","s":"E","n":43,"q":"在資安事件處理程序中，下列哪一項是「封鎖」階段的首要目標？","o":["立即恢復所有業務運作","限制事件擴散範圍，阻止損害進一步蔓延","徹底移除所有惡意程式","對攻擊者提起法律訴訟"],"a":1,"e":"封鎖（圍堵）階段首要目標是限制擴散、阻止損害擴大。"},{"id":"E1-44","i":"m8","s":"E","n":44,"q":"公務機關判定資通安全事件等級時，應衡酌機密性、完整性及可用性（CIA）之受損影響程度。若某事件經評估後，其影響等級分別為「機密性受損：2 級」、「完整性受損：3 級」、「可用性受損：1 級」，則該事件最終應判定為幾級資通安全事件？","o":["第 3 級","第 1 級","第 2 級","由資訊主管自行決定"],"a":0,"e":"事件等級取 CIA 各構面中的最高等級，故判定為第 3 級。"},{"id":"E1-45","i":"m8","s":"E","n":45,"q":"在資通安全事件處理的「根除階段」，若評估受感染系統存在高隱匿性惡意程式（如 Rootkit），且無法確保能完全清除潛伏之殘留威脅時，下列何者為較安全的處置方式？","o":["僅更換防毒軟體品牌後繼續使用","採回存方式，從乾淨備份還原或全新安裝系統","增加防火牆規則阻擋該主機 IP","暫時不處理，改採持續監控"],"a":1,"e":"高隱匿性惡意程式難以確認清除乾淨，應從乾淨備份還原或重新安裝系統。"},{"id":"E1-46","i":"m9","s":"E","n":46,"q":"以下何者是異地備援的主要目的？","o":["避免單一地域的災難影響","簡化系統的備份流程","降低資料傳輸的延遲","提高系統的即時效能"],"a":0,"e":"異地備援將資料／系統放在不同地理位置，避免單一地區災害同時毀損主備系統。"},{"id":"E1-47","i":"m9","s":"E","n":47,"q":"關於營運持續管理（Business Continuity Management, BCM）的責任歸屬，下列何項敘述最為正確？","o":["營運持續管理僅需由安全部門負責規劃與執行","營運持續管理主要是資訊部門的責任","營運持續管理必須由核心業務所有相關部門共同投入","營運持續管理是高階管理人員的專屬職責，其他部門只需配合"],"a":2,"e":"BCM 必須由核心業務相關各部門共同投入，高階管理層支持與督導。"},{"id":"E1-48","i":"m9","s":"E","n":48,"q":"某機關的備份策略為：週一執行「完整備份」，週二至週四執行「增量備份」。若該機關於週五上班前發生系統潰散，需進行資料還原，下列關於還原程序之敘述，何者正確？","o":["僅需還原週一的完整備份","還原週一完整備份 + 週四的備份","僅需還原週四的備份","還原週一完整備份 + 週二、週三、週四的備份"],"a":3,"e":"增量備份只備份上次備份後的變動，還原時需完整備份＋之後所有增量備份（二、三、四）。"},{"id":"E1-49","i":"m9","s":"E","n":49,"q":"在業務持續運作管理程序中，組織在進行「營運衝擊分析（BIA）」以識別核心業務及其復原時效需求前，通常應先完成下列哪一項階段性工作？","o":["發展復原策略","維護營運持續計畫","建立業務持續運作策略","測試與演練"],"a":2,"e":"BCM 程序：先建立業務持續運作策略（含範圍、政策），再進行 BIA，接著發展復原策略、測試演練。"},{"id":"E1-50","i":"m9","s":"E","n":50,"q":"在制定營運持續計畫（BCP）的時間目標時，為確保各項復原目標的合理性，下列哪一項為絕對「不」可違背的邏輯限制？","o":["RTO（Recovery Time Objective）不可大於 MTPD（Maximum Tolerable Period of Disruption）","WRT（Work Recovery Time）必須小於 RPO（Recovery Point Objective）","MTPD（Maximum Tolerable Period of Disruption）必須小於 RTO（Recovery Time Objective）","RPO（Recovery Point Objective）不可大於 WRT（Work Recovery Time）"],"a":0,"e":"RTO 必須小於等於 MTPD（最大可容忍中斷時間），否則復原時已超出組織可承受範圍。"},{"id":"E2-01","i":"t1","s":"E","n":1,"q":"下列何者正確描述了封包過濾式防火牆的特性？","o":["封包過濾式防火牆可過濾並偵測隱藏在加密內容中的惡意指令","封包過濾式防火牆需要經驗豐富的管理人員建立複雜的過濾規則","封包過濾式防火牆能夠檢測並阻擋來自已知惡意網站的所有流量，即使這些流量使用不同的 IP 地址","封包過濾式防火牆主要檢查每個來往 IP 封包中的資料（Data）內容"],"a":1,"e":"封包過濾防火牆依 IP、Port、協定等表頭規則過濾，不檢查內容；規則複雜需經驗豐富人員設定。"},{"id":"E2-02","i":"t1","s":"E","n":2,"q":"關於阻斷式服務攻擊（DoS/DDoS）的敘述，下列何者最為適切？","o":["攻擊者通常使用單一來源發起攻擊","僅會造成網路流量變慢，但不會癱瘓主機","主要目的是耗盡目標系統的資源","只能經由惡意程式散播來實現"],"a":2,"e":"DoS/DDoS 主要目的是耗盡目標的頻寬、運算或連線資源，使服務中斷。"},{"id":"E2-03","i":"t1","s":"E","n":3,"q":"針對虛擬區域網路（Virtual Local Area Network, VLAN）環境中的雙重標籤攻擊（Double Tagging Attack），下列何項防護措施最為適切？","o":["將原生虛擬區域網路（Native VLAN）設定為未使用的 VLAN，避免與存取連接埠重疊","關閉所有主幹連接埠（Trunk Port）上的加密功能","允許所有存取連接埠（Access Port）自動協商為主幹（Trunking）模式","將原生虛擬區域網路（Native VLAN）設定為 VLAN 1，以方便管理"],"a":0,"e":"雙重標籤攻擊利用 Native VLAN；將 Native VLAN 設為未使用的 VLAN 並關閉 DTP 自動協商可防範。"},{"id":"E2-04","i":"t1","s":"E","n":4,"q":"關於動態主機設定協定伺服器（DHCP Server）惡意攻擊，下列何項說明最能解釋其可能造成的後續威脅？","o":["攻擊者可透過惡意 DHCP 提供錯誤的網域名稱系統（DNS）設定，進而引導受害者至惡意網站","攻擊者可利用惡意 DHCP 直接取得目標網路所有設備的管理員權限","攻擊者可利用惡意的 DHCP 直接加密受害主機的所有檔案","攻擊者可透過惡意 DHCP 對目標主機發動分散式阻斷服務攻擊（DDoS）"],"a":0,"e":"惡意 DHCP 伺服器可發送錯誤的閘道或 DNS 設定，把受害者導向惡意網站或進行中間人攻擊。"},{"id":"E2-05","i":"t1","s":"E","n":5,"q":"下列何種防禦機制最能有效地驗證邊界閘道器協定（BGP）路由的合法性，以降低 BGP 劫持（BGP Hijacking）的風險？","o":["入侵偵測系統（Intrusion Detection System, IDS）","資源公鑰基礎建設（Resource Public Key Infrastructure, RPKI）","虛擬區域網路分段（VLAN）","動態主機設定協定監聽（DHCP Snooping）"],"a":1,"e":"RPKI 以數位憑證驗證 IP 前綴與 AS 的對應（ROA），可驗證 BGP 路由來源合法性。"},{"id":"E2-06","i":"t2","s":"E","n":6,"q":"企業為防範不同 OSI 網路階層的安全威脅，會部署相對應的安全通訊協定。關於協定與其網路安全防護功能的對應，下列敘述何者錯誤？","o":["應用層（Application Layer） ：HTTPS 透過 TLS 提供端對端加密，防止網頁傳輸內容遭中間人竊聽攻擊","傳輸層（Transport Layer） ：TLS/SSL 介於應用層與傳輸層之間，主要負責為應用程式提供資料加密與來源驗證","網路層（Network Layer） ：IPsec 協定可用於建立虛擬私人網路（VPN）通道，保護跨網域 IP 封包的機密性與完整性","資料連結層（Data Link Layer） ：SSH 主要運作於此層，負責對區域網路的 MAC 位址進行加密，以防範 ARP 欺騙攻擊"],"a":3,"e":"SSH 屬應用層協定，不在資料連結層加密 MAC 位址；防 ARP 欺騙應用 DAI 等機制。"},{"id":"E2-07","i":"t2","s":"E","n":7,"q":"關於無線網路 WPA3 加密標準，下列何者是其優於 WPA2 的主要特性？","o":["移除了所有的密碼認證機制","強化了對抗離線暴力破解攻擊的保護（SAE 交握）","取代了 AES（Advanced Encryption Standard）加密演算法","僅支援隱藏 SSID 的功能"],"a":1,"e":"WPA3 以 SAE（Dragonfly 交握）取代 PSK，強化對離線字典／暴力破解的防護。"},{"id":"E2-08","i":"t3","s":"E","n":8,"q":"在設計一個安全的帳號鎖定機制時，下列何種策略能有效防止暴力破解攻擊，同時避免合法使用者被誤鎖？","o":["在多次登入失敗後，增加帳號鎖定的時間，並設定最大鎖定時間","僅記錄登入失敗次數，不進行帳號鎖定","在三次登入失敗後，永久鎖定帳號","每次登入失敗後，即要求使用者重新變更密碼"],"a":0,"e":"漸進式延長鎖定時間並設上限，可抵擋暴力破解又避免合法使用者被永久誤鎖。"},{"id":"E2-09","i":"t10","s":"E","n":9,"q":"企業推行 BYOD（Bring Your Own Device）政策，員工抗拒安裝會「接管整台手機」的 MDM 代理程式（Mobile Device ManagementAgent）。為了在「不管理設備」的情況下僅保護「企業應用程式（如 Teams、Outlook）」及資料安全，下列何項技術較符合隱私保護趨勢？","o":["資料外洩防護（Data Loss Prevention, DLP）","統一端點管理（Unified Endpoint Management, UEM）","行動應用管理（Mobile Application Management, MAM）","遠端瀏覽器隔離（Remote Browser Isolation, RBI）"],"a":2,"e":"MAM 只管理企業 App 與其資料（容器化、App 層原則），不接管整台裝置，兼顧 BYOD 隱私。"},{"id":"E2-10","i":"t9","s":"E","n":10,"q":"隨著 SaaS（Software as a Service）應用普及，傳統 VPN 的「流量回傳（Backhaul）」架構導致頻寬瓶頸與延遲。企業決定導入安全存取服務邊緣（Secure Access Service Edge, SASE）架構。下列何項 SASE 組件能讓員工不需 VPN 即可安全、直接地存取雲端應用，並同時執行資料外洩防護（Data Loss Prevention, DLP）檢查？","o":["防火牆即服務（FWaaS）","雲端存取安全代理（Cloud Access Security Broker, CASB）","安全網頁閘道（Secure Web Gateway, SWG）","軟體定義廣域網路（SD-WAN）"],"a":1,"e":"CASB 位於使用者與 SaaS 之間，提供可視性、存取控管與 DLP 檢查。"},{"id":"E2-11","i":"t3","s":"E","n":11,"q":"若一台 Windows 設備已確定被駭客入侵，為測試該設備與特定外部 IP 或主機的網路連線狀態是否暢通，下列何項指令最為適切？","o":["ipconfig","ping","arp","nslookup"],"a":1,"e":"ping 以 ICMP 測試與指定主機的連通性；ipconfig 看本機設定、arp 看 MAC 對應、nslookup 查 DNS。"},{"id":"E2-12","i":"t2","s":"E","n":12,"q":"下列何項對稱區塊加密演算法（Symmetric Block Cipher Algorithm）的工作模式，在傳輸資料時同時具備加密保護與完整性驗證功能？","o":["密碼區塊連結模式（Cipher Block Chaining, CBC）","伽羅瓦/計數器模式（Galois/Counter Mode, GCM）","電子密碼本模式（Electronic Codebook, ECB）","資料加密標準（Data Encryption Standard, DES）"],"a":1,"e":"GCM 是 AEAD 模式，同時提供加密與完整性驗證（認證標籤）；DES 是演算法不是工作模式。"},{"id":"E2-13","i":"t2","s":"E","n":13,"q":"組織正在升級無線網路至 WPA3 標準，但考量部分舊型 IoT 設備不支援 SAE （Simultaneous Authentication of Equals）。為了過渡，網路管理員啟用了「WPA3 過渡模式（Transition Mode）」。在此混合環境下，攻擊者最可能利用下列何種手法迫使客戶端降級至較不安全的 WPA2，進而發動字典攻擊？","o":["降級攻擊（Downgrade Attack / Rollback）","密鑰重裝攻擊（Key Reinstallation Attack, KRACK）","重新連線攻擊（Reassociation Attack）","邪惡雙子攻擊（Evil Twin）"],"a":0,"e":"過渡模式同時支援 WPA2／WPA3，攻擊者可架設只支援 WPA2 的 AP 迫使客戶端降級，再擷取交握進行字典攻擊。"},{"id":"E2-14","i":"t2","s":"E","n":14,"q":"在金鑰管理（Key Management）的實務中，對稱式加密（Symmetric Encryption）與非對稱式加密（Asymmetric Encryption）各有其特性。若某系統需要在大量資料傳輸時兼顧效能，同時又需安全地與眾多服務目標交換金鑰，下列何種架構最為適切？","o":["以「非對稱式加密」交換對稱金鑰，再以「對稱式加密」加密大量資料","全程使用「非對稱式加密」以確保金鑰交換與資料加密的安全性","以「對稱式加密」交換金鑰，再以「非對稱式加密」加密大量資料","全程使用「對稱式加密」並透過安全通道預先共享金鑰"],"a":0,"e":"混合式加密：以非對稱加密交換對稱金鑰，再以對稱加密處理大量資料，兼顧安全與效能（如 TLS）。"},{"id":"E2-15","i":"t3","s":"E","n":15,"q":"某研究人員發現一個 OS kernel 的漏洞：惡意程式可經由某個 syscall 觸發 kernel 中的緩衝區溢位，但要成功利用此漏洞必須先取得或推測核心記憶體位址。下列何種安全機制最能有效降低該攻擊的成功率？","o":["最小特權原則（Principle of Least Privilege, PoLP）","禁止未簽章驅動程式載入","ASLR（Address space layout randomization） / KASLR（Kernel Address space layout randomization）","SELinux（Security-Enhanced Linux）強制存取控制"],"a":2,"e":"攻擊需先知道核心記憶體位址，KASLR 隨機化核心位址配置，使攻擊者難以預測。"},{"id":"E2-16","i":"t3","s":"E","n":16,"q":"當主機遭受駭客攻擊後，資安人員所應採取的第一項處置行動，下列何項最為適切？","o":["立即向主管機關申報資安事件，並等待指示後再採取任何進一步行動","立即將受駭主機格式化並重新安裝作業系統，以確保系統恢復正常運作","立即將受駭主機與網路隔離（Network Isolation），以防止攻擊行為進一步擴散","立即通知所有使用者更改密碼，以防止帳號遭到未授權存取"],"a":2,"e":"發現受駭應先隔離主機，阻止橫向擴散，並保留跡證以利後續鑑識。"},{"id":"E2-17","i":"t3","s":"E","n":17,"q":"關於系統強化（Hardening），下列何項描述最為適切？","o":["系統強化（Hardening）是指透過關閉不必要的服務、移除預設帳號及設定安全基準（Baseline）等措施，縮小系統的攻擊面","系統強化（Hardening）是指為系統同時安裝多樣化的安全防護軟體，以達到多層次的防禦效果","系統強化（Hardening）是指對系統進行完整的資料加密，確保所有儲存資料均無法被未授權讀取","系統強化（Hardening）是指在網路環境中安裝 IPS/IDS 等設備"],"a":0,"e":"系統強化是關閉不必要服務、移除預設帳號、套用安全基準組態（如 GCB），縮小攻擊面。"},{"id":"E2-18","i":"t9","s":"E","n":18,"q":"關於在雲端環境中，平台即服務（Platform as a Service, PaaS）與軟體即服務（Software as a Service, SaaS）在權限分責（Shared Responsibility）上主要差異的描述下列何項較為適切？","o":["PaaS 與 SaaS 的責任範圍完全相同，安全責任皆由雲端服務供應商全權負責","PaaS 使用者需負責底層實體硬體的安全，SaaS 使用者則負責虛擬機器的安全設定","PaaS 使用者需負責應用程式與資料的安全，SaaS 使用者則主要負責存取管理與資料安全","SaaS 使用者需負責作業系統修補與中介軟體（Middleware）設定，PaaS 使用者則無需管理任何安全事項"],"a":2,"e":"PaaS 使用者需負責自己的應用程式與資料；SaaS 使用者主要負責帳號存取管理與資料。"},{"id":"E2-19","i":"t8","s":"E","n":19,"q":"在 Windows 作業系統中，若要確認系統帳戶是否有異常的登入嘗試，應查看下列哪一個工具？","o":["事件檢視器中的「安全性」紀錄（Event Viewer - Security）","本機安全性原則（Local Security Policy）","效能監視器（Performance Monitor）","工作管理員（Task Manager）"],"a":0,"e":"Windows 登入成功／失敗事件（如 4624/4625）記錄在事件檢視器的「安全性」紀錄中。"},{"id":"E2-20","i":"t4","s":"E","n":20,"q":"請問下列何種 SQLi 攻擊類型可利用資料庫伺服器所發出的 DNS（Domain Name System）請求功能將資料傳遞給攻擊者？","o":["Inferential SQL Injection","Out-of-band SQL Injection","Blind SQL Injection","In-band SQL Injection"],"a":1,"e":"Out-of-band SQLi 透過資料庫發出的 DNS 或 HTTP 請求，把資料送到攻擊者控制的伺服器。"},{"id":"E2-21","i":"t4","s":"E","n":21,"q":"駭客成功入侵一台 Windows 系統後，將惡意程式加入「登錄檔的啟動機制（Run/RunOnce）」中，讓惡意程式在每次系統啟動時自動執行。上述的內容主要屬於下列何種入侵手法？","o":["密碼暴力破解","系統後門與持久化（Persistence）","中間人攻擊（Man-in-the-Middle Attack）","社交工程攻擊"],"a":1,"e":"寫入 Run/RunOnce 登錄機碼讓惡意程式開機自動執行，屬「持久化（Persistence）」手法。"},{"id":"E2-22","i":"t4","s":"E","n":22,"q":"關於動態連結程式庫側載（DLLSideloading）攻擊的概念，下列何項說明最為適切？","o":["攻擊者利用動態修改記憶體的方法來改變 DLL 的程式碼，以躲避防毒軟體的偵測","攻擊者藉由在目標系統中使用加殼（Packing）技術將惡意程式附加在正常的 DLL 上，以逃避防毒軟體的偵測","攻擊者透過在網路上散布被篡改的 DLL 檔案，誘使開發者或使用者誤用，進而執行惡意行為","攻擊者透過應用程式在載入 DLL 時的搜尋順序漏洞，將惡意版本置於優先路徑並取代合法版本以便執行"],"a":3,"e":"DLL 側載利用應用程式載入 DLL 的搜尋順序，把惡意 DLL 放在優先路徑，冒充合法版本被載入。"},{"id":"E2-23","i":"t4","s":"E","n":23,"q":"關於跨網站請求偽造（Cross-Site Request Forgery, CSRF）攻擊的概念，下列何項說明最為適切？","o":["攻擊者誘使已通過驗證的使用者，在不知情的情況下向目標網站發送非預期的惡意請求","攻擊者在目標網站的輸入欄位中插入惡意指令碼（Script），以影響其他使用者的瀏覽行為","攻擊者竊取使用者的工作階段令牌（Session Token），直接以使用者身分登入目標網站","攻擊者對目標網站的登入頁面進行暴力破解（Brute Force），以取得使用者帳號與密碼"],"a":0,"e":"CSRF 誘使已登入的使用者在不知情下對目標網站送出請求；(B) 是 XSS、(C) 是 Session 劫持。"},{"id":"E2-24","i":"t4","s":"E","n":24,"q":"關於「HTTP 請求走私攻擊（HTTP Request Smuggling）」的成因，下列何項說明最為適切？","o":["攻擊者透過重複發送相同的 HTTP 請求，使伺服器因資源競逐問題回傳錯誤的回應","攻擊者利用伺服器未正確驗證使用者身份，直接存取需授權的 API 端點（Endpoint）","攻擊者透過在 HTTP 回應中注入惡意腳本，使前端快取伺服器儲存並回傳給其他使用者","攻擊者利用前端代理伺服器（Proxy Server）與後端伺服器對 HTTP 請求邊界解析不一致，導致請求邊界混淆"],"a":3,"e":"HTTP 請求走私源於前端代理與後端伺服器對 Content-Length／Transfer-Encoding 解析不一致。"},{"id":"E2-25","i":"t5","s":"E","n":25,"q":"下列何項工具「不」是常見的靜態原始碼檢測工具？","o":["Fortify","Chef","PMD","Checkmarx"],"a":1,"e":"Fortify、PMD、Checkmarx 都是靜態原始碼檢測工具；Chef 是組態管理自動化工具。"},{"id":"E2-26","i":"t5","s":"E","n":26,"q":"在開發 Web 應用程式時，為防止 SQL 注入攻擊（SQLInjection），下列措施中何項較為有效？","o":["使用預備語句（Prepared Statements）或參數化查詢","在資料庫中啟用日誌記錄","限制使用者輸入的長度","對使用者輸入的資料進行編碼"],"a":0,"e":"預備語句／參數化查詢讓輸入不會被當成 SQL 指令執行，是防 SQL Injection 最有效的方法。"},{"id":"E2-27","i":"t5","s":"E","n":27,"q":"如下列 C/C++程式碼，請判斷該程式碼有下列哪一種類的緩衝區溢位（Buffer Overflow）弱點？","o":["堆疊型緩衝區溢位（Stack-based Buffer Overflow）","整數溢位（Integer Overflow）","堆積型緩衝區溢位（Heap-based Buffer Overflow）","格式字串攻擊（Format String Overflow）"],"a":3,"e":"printf(buffer) 直接把使用者輸入當格式字串，輸入 %x、%n 可讀寫記憶體，屬格式字串弱點；應改為 printf(\"%s\", buffer)。","f":"code"},{"id":"E2-28","i":"t5","s":"E","n":28,"q":"在軟體開發生命週期（SDLC）中，何時開始考慮安全性（Security）的處理成本最高？","o":["系統測試階段","程式碼撰寫階段","需求分析與設計階段","系統維運階段"],"a":3,"e":"越晚處理安全問題成本越高，到系統維運（上線）階段才修正成本最高。"},{"id":"E2-29","i":"t5","s":"E","n":29,"q":"SBOM（Software Bill of Material）為近年程式開發與供應鏈安全特別需要注意的項目，關於 SBOM 關注與記錄的重點，下列何項最「不」適切？","o":["軟體元件的名稱與版本資訊","軟體元件的已知漏洞資訊（CVE）","軟體元件執行時的動態行為日誌（Dynamic Behavior Logs）","軟體元件的授權類型（license type）"],"a":2,"e":"SBOM 記錄元件名稱、版本、供應者、授權、相依關係（可對應 CVE）；執行時的動態行為日誌不屬於 SBOM。"},{"id":"E2-30","i":"t6","s":"E","n":30,"q":"零日漏洞在安全更新發布前就可能被攻擊者利用，導致企業無法立即修補，因此這類攻擊難以預防。下列何項是最「不」妥當的應對措施？","o":["採用端點偵測及回應技術（Endpoint Detection and Response, EDR）來監控可疑行為","透過資安事件響應計畫（Incident Response Plan, IRP）快速封鎖受影響的系統","定期獲取漏洞情報，及時安裝安全更新檔","使用應用程式黑名單，防止未經授權的程式執行"],"a":3,"e":"零日攻擊無已知特徵，黑名單只能擋已知程式，效果最差；應採白名單、EDR 與應變計畫。"},{"id":"E2-31","i":"t6","s":"E","n":31,"q":"在弱點管理流程中，執行「弱點掃描（Vulnerability Scanning）」最主要的目的為下列何項？","o":["自動化地探測系統、網路、應用程式、作業系統，識別出已知的安全性弱點（CVEs）","清除已感染電腦的病毒、木馬或勒索軟體等惡意程式","模擬駭客攻擊手法，並主動利用弱點來嘗試取得系統控制權","即時監控並阻擋進出網路的惡意連線與可疑流量"],"a":0,"e":"弱點掃描自動化探測並識別已知弱點（CVE）；(C) 主動利用弱點屬滲透測試。"},{"id":"E2-32","i":"t6","s":"E","n":32,"q":"某惡意程式在執行初期會延遲數十分鐘，並要求使用者進行互動（滑鼠移動、鍵盤輸入）。若未符合條件即結束執行。此設計最主要削弱下列哪一類防護機制的有效性？","o":["靜態程式碼分析","行為式端點即時阻斷","郵件閘道防毒","自動化沙箱動態分析"],"a":3,"e":"延遲執行與要求使用者互動是典型「沙箱規避」技巧，使自動化沙箱觀察不到惡意行為。"},{"id":"E2-33","i":"t6","s":"E","n":33,"q":"弱點管理與惡意程式防護息息相關，企業應定期比對資產是否存在已公開之弱點，下列哪一項為此通報機制的簡稱？","o":["SOC（Security Operations Center）","VPN（Virtual Private Network）","VANS（Vulnerability Analysis and Notice System）","GCB（Government Configuration Baseline）"],"a":2,"e":"VANS（資通安全弱點通報機制）比對機關資產與已公開弱點，協助即時修補。"},{"id":"E2-34","i":"t6","s":"E","n":34,"q":"針對採取「實體隔離（Air-Gapped）」配置的系統環境，下列何種行為最可能成為惡意程式入侵的管道？","o":["遭到來自 GSN 的遠端連線滲透","人員利用可攜式媒體（USB/隨身碟）私自進行資料交換","外部防火牆規則配置錯誤","雲端服務提供者的系統中斷"],"a":1,"e":"實體隔離環境最常見的入侵途徑是可攜式媒體（USB）交換資料，如 Stuxnet 事件。"},{"id":"E2-35","i":"t7","s":"E","n":35,"q":"關於備份儲存策略，下列選項最「不」妥當？","o":["獨立磁碟冗餘陣列（RAID）主要是提升磁碟存取效能與容錯能力，不可作為唯一的備份方案","備份檔案不可存放在同一台伺服器主機內","即使備份存放於雲端，仍需保留本地檔案","用 3-2-1 備份策略，至少存放於 3 種不同媒介、2 份異地存放、1 份備份"],"a":3,"e":"3-2-1 原則是「3 份資料、2 種不同媒介、1 份異地存放」，(D) 敘述錯誤。"},{"id":"E2-36","i":"t7","s":"E","n":36,"q":"某公司希望在系統故障時，能將服務立即切換到另一台伺服器，資料幾乎零遺失。這需要使用下列何種備份/容錯技術？","o":["離線備份（Offline Backup）","熱備援（Hot Backup）","溫備援（Warm Backup）","冷備援（Cold Backup）"],"a":1,"e":"熱備援（Hot Standby）同步運作、可即時切換，資料幾乎零遺失。"},{"id":"E2-37","i":"t7","s":"E","n":37,"q":"機構採用多雲（Multi-Cloud）備份架構，以確保病歷資料的持續可用性。但在一次勒索攻擊事件中，駭客利用被竊取的 API 金鑰，跨雲刪除了多個備份版本，導致僅剩下數月前的資料。若要避免此風險，下列何種最佳實務最能補強現有架構？","o":["僅依賴多雲備份即可，不需其他措施","改用差異備份，避免版本過多","將所有備份統一壓縮，以降低攻擊面","實作不可變備份（Immutable Backup）＋零信任存取控管（Zero Trust Access）"],"a":3,"e":"不可變備份（WORM）讓備份在保存期內無法被刪改，加上零信任存取控管，即使金鑰外洩也能保住備份。"},{"id":"E2-38","i":"t7","s":"E","n":38,"q":"在評估資通系統所使用的演算法安全性時，下列哪一項演算法已被證實存在「碰撞攻擊（CollisionAttack）」缺陷，因此不再建議用於驗證資料完整性或實作數位簽章？","o":["RSA-2048","AES-256","MD5","SHA-256"],"a":2,"e":"MD5 已被證實可產生碰撞，不應再用於完整性驗證或數位簽章；SHA-256 目前仍安全。"},{"id":"E2-39","i":"t7","s":"E","n":39,"q":"在制定營運持續計畫（BCP）時，有關資料「備份頻率」的設定應遵循下列哪一項原則？","o":["資料備份頻率應等於 RTO（Recovery Time Objective）","資料備份頻率不可大於 RPO（Recovery Point Objective）","資料備份頻率應大於 MTPD（Maximum Tolerable Period of Disruption）","資料備份頻率隨機決定，有時間再備份"],"a":1,"e":"RPO 是可容忍的資料遺失時間點，備份間隔不可大於 RPO。"},{"id":"E2-40","i":"t8","s":"E","n":40,"q":"在日誌管理流程中，「日誌分析」（LogAnalysis）階段最主要的核心任務為下列何項？","o":["設定日誌的儲存時間與刪除策略","確保日誌資料在傳輸與儲存過程中的完整性與機密性","將來自不同系統的日誌檔彙整到單一儲存庫","從大量的日誌資料中，識別出異常模式、安全威脅或營運問題的跡象"],"a":3,"e":"日誌分析的核心是從大量日誌中找出異常模式、威脅或營運問題；(A)(B)(C) 屬保存、保護、集中。"},{"id":"E2-41","i":"t8","s":"E","n":41,"q":"金融機構需要向稽核人員證明，他們已嚴格遵守「支付卡產業資料安全標準（PCI DSS)」中對於持卡人資料存取控制的要求。在這種情境下，日誌管理系統應產出下列何種報告，才能最直接且有效地滿足此項稽核需求？","o":["一份包含所有網路設備（如防火牆、路由器）流量的總體統計報告","一份關於系統所有軟體更新與漏洞修補安裝狀態的報告","一份關於系統管理員帳號所有活動的日誌報告","一份詳細列出所有成功與失敗的、針對儲存持卡人資料之伺服器與資料庫的存取紀錄報告"],"a":3,"e":"PCI DSS 要求追蹤所有對持卡人資料的存取，最直接的證據是針對持卡人資料伺服器與資料庫的成功／失敗存取紀錄。"},{"id":"E2-42","i":"t8","s":"E","n":42,"q":"某企業在導入 SIEM 後，告警數量暴增，導致 SOC 人員疲勞，反而錯失真正攻擊行為。上述問題最可能源自下列哪一項日誌管理決策？","o":["日誌存取權限設計過嚴","日誌來源涵蓋範圍不足","日誌事件告警規則設計失當","日誌保存時間設定過長"],"a":2,"e":"告警暴增造成告警疲勞，通常是關聯／告警規則設計失當，需調校門檻與降噪。"},{"id":"E2-43","i":"t8","s":"E","n":43,"q":"建立日誌管理系統時，為了防止攻擊者在入侵後刪除日誌軌跡，下列何者是最佳做法？","o":["僅在伺服器本機對日誌資料夾進行嚴格的存取權限控管","縮短日誌保留期限至 1 天","將日誌即時傳送到遠端獨立的日誌伺服器（Log Server）","將本機日誌檔案設定為隱藏與唯讀屬性（Read-Only）"],"a":2,"e":"即時把日誌轉送到遠端獨立日誌伺服器，入侵者即使取得本機權限也難以刪除完整軌跡。"},{"id":"E2-44","i":"t8","s":"E","n":44,"q":"下列哪一項資訊較「不」建議直接記錄在明文的系統日誌（Log）中，以免造成資訊洩露？","o":["來源 IP 位址","系統執行錯誤代碼","使用者的登入時間","使用者的明文密碼（Plaintext Password）"],"a":3,"e":"明文密碼絕不可寫入日誌，以免日誌外洩造成帳號被盜。"},{"id":"E2-45","i":"t11","s":"E","n":45,"q":"在 5G 行動通訊網路架構中，為了提供超低延遲服務，運算資源會從雲端移至靠近使用者的「邊緣運算（Edge Computing）」。從資安角度來看，邊緣運算面臨的主要挑戰為下列哪一項？","o":["後端伺服器的運算壓力過大，容易造成 DDoS 攻擊","資料傳輸路徑變長，導致攔截風險增加","物理節點分布廣泛且環境不安全，增加設備被物理接觸或破壞的風險","邊緣設備不需要加密，因此容易造成資料外洩"],"a":2,"e":"邊緣節點分散在各地、環境不受控，更容易遭物理接觸、竄改或破壞。"},{"id":"E2-46","i":"t11","s":"E","n":46,"q":"針對人工智慧（AI）模型，攻擊者透過輸入經過微小干擾的樣本（如在交通標誌貼上特定貼紙），誤導模型做出錯誤判斷。這種針對模型邏輯漏洞的攻擊稱為下列何項？","o":["阻斷服務攻擊（DoS）","後門攻擊（Backdoor Attack）","對抗性攻擊（Adversarial Attack）","社交工程攻擊（Social Engineering）"],"a":2,"e":"對抗性攻擊以人眼難察覺的微小擾動樣本，誤導 AI 模型的判斷結果。"},{"id":"E2-47","i":"t11","s":"E","n":47,"q":"在虛實整合系統（CPS）或工業控制環境（OT）中，資安防護邏輯與傳統辦公室環境（IT）有所不同。關於 OT 環境的特性，下列敘述何者正確？","o":["OT 設備生命週期較短，建議每 2-3 年即汰換","系統必須確保極高的可用性（Availability）","只要實施實體隔離（Air-gap）即可，就不需考慮病毒偵測或其他端點防禦機制","與 IT 環境相同，資料的機密性（Confidentiality）是最高指導原則"],"a":1,"e":"OT 環境以可用性（與人身安全）為最高優先，設備生命週期長，且即使隔離也仍需端點防護。"},{"id":"E2-48","i":"t11","s":"E","n":48,"q":"針對未來量子電腦可能破解現有的公鑰加密演算法（如 RSA、ECC），目前國際間資安標準正積極推動下列哪一種防禦技術？","o":["後量子密碼學（Post-Quantum Cryptography, PQC）","全面改用對稱式加解密（如 AES-128）取代所有非對稱加解密演算法","區塊鏈雜湊鏈結技術","增加 RSA 密鑰長度至 8192 bits 以上"],"a":0,"e":"後量子密碼學（PQC）設計可抵抗量子電腦攻擊的演算法，NIST 已發布 ML-KEM、ML-DSA 等標準。"},{"id":"E2-49","i":"t11","s":"E","n":49,"q":"AI SOC Agent 使用「端點紀錄（EDR/Sysmon）」分析比「網路流量（Network Traffic）」精準的主要原因，下列何項敘述較為適切？","o":["因為網路流量數據被加密，無法被 AI 讀取或分析","因為端點紀錄的儲存空間較小，AI 分析速度更快","因為端點紀錄可以呈現處理程序樹（Process Tree），辨識合法工具是否被異常調用","因為端點紀錄不需要考慮員工隱私問題"],"a":2,"e":"端點紀錄能呈現處理程序樹與命令列，可辨識 PowerShell 等合法工具被異常調用（Living off the Land）。"},{"id":"E2-50","i":"t11","s":"E","n":50,"q":"導入 AI SOC Agent 時，下列哪一項設計最有助於避免 AI 成為單點失效（Single Point of Failure）？","o":["持續提高 AI 模型處理未知資安事件的自動化回應比例","授權 AI 模型獨立進行端點設備的隔離決策","整合安全資訊與事件管理（SIEM）系統進行零人工的全自動化阻斷","應避免系統全自動化，採用關鍵處置環節設置斷點引入人工審核的分層決策機制"],"a":3,"e":"在關鍵處置設置人工審核斷點的分層決策，可避免 AI 誤判造成全面衝擊，降低單點失效風險。"}]};</script>
<script>window.TUT={"m1":[{"t":"CIA 三要素：資安到底在保護什麼？","b":"資訊安全的目標可以濃縮成三個字母 <b>C、I、A<\/b>：<br><b>機密性 Confidentiality<\/b>：資料只給「被授權的人」看。<br><b>完整性 Integrity<\/b>：資料正確、沒被偷改或損壞。<br><b>可用性 Availability<\/b>：被授權的人「需要的時候」用得到。<br>ISO/IEC 27000 另外還提到驗證性、可歸責性、不可否認性、可靠性，可以當成 CIA 的延伸。","a":"想像你的日記本：上鎖不讓別人偷看是<b>機密性<\/b>；沒有人偷偷撕頁或改內容是<b>完整性<\/b>；你想寫的時候找得到、打得開是<b>可用性<\/b>。","w":{"type":"sort","tip":"每個情境破壞（或保護）的是哪一個？","buckets":["C 機密性","I 完整性","A 可用性"],"items":[["員工把客戶名單寄錯人",0,"資料被不該看的人看到，是機密性。"],["網站遭 DDoS 攻擊打掛",2,"服務停擺，合法使用者用不到，是可用性。"],["駭客竄改資料庫中的成績",1,"資料被未授權修改，是完整性。"],["下載頁面附上 SHA-256 讓你比對",1,"雜湊比對是用來確認檔案沒被改過。"],["機房停電，系統全部停止",2,"系統無法使用，影響可用性。"],["公司網路要求 24 小時運作",2,"強調隨時可用，就是可用性。"],["重要檔案設定密碼保護",0,"防止未授權的人讀取內容。"],["檔案毀損導致內容錯亂",1,"學習指引把「檔案遭毀損」歸在完整性受影響。"]]},"k":["機密性看「誰能看」，完整性看「有沒有被改」，可用性看「能不能用」","加密主要保護機密性；雜湊、數位簽章主要保護完整性；備份、備援、負載平衡主要保護可用性"],"q":{"q":"軟體商在下載頁同時提供檔案的 SHA-256 雜湊值，主要是為了實現哪一項？","o":["機密性","完整性","可用性","不可否認性"],"a":1,"e":"使用者自己算一次雜湊值來比對，相同就代表檔案沒被竄改，所以是完整性。"}},{"t":"用什麼方法保護 C、I、A？","b":"知道三個目標後，下一步是「用什麼工具守住它們」。學習指引列出的手段整理在下表，點表頭可以把那一欄標亮。","a":"保全公司的三種服務：門禁和保險箱（機密）、監視器和簽收單（完整）、備用發電機和第二個倉庫（可用）。","w":{"type":"grid","cols":["","機密性 C","完整性 I","可用性 A"],"rows":[["一句話","不該看的人看不到","資料正確沒被改","需要時用得到"],["被破壞的例子","傳輸中被攔截竊取、誤公布資料","惡意竄改、誤操作、雜訊干擾","系統故障、阻斷服務攻擊"],["防護手段","加密、SSL/TLS、IPsec、嚴格認證與存取控制","變更需授權確認、記錄使用者活動、雜湊與數位簽章","備份、容錯備援、資料庫多副本、容量規劃、負載平衡"]]},"k":["同一個工具可能幫到不只一項，例如嚴謹的存取控制同時保護機密性和完整性","考題常問「某措施主要保護哪一項」，先想它防的是偷看、偷改還是停擺"],"q":{"q":"導入負載平衡與容量規劃，主要是為了強化哪一項？","o":["機密性","完整性","可用性","可歸責性"],"a":2,"e":"負載平衡和容量規劃讓系統在流量大時仍然撐得住，保護的是可用性。"}},{"t":"資產、弱點、威脅、風險：四個名詞一次搞懂","b":"<b>資產 Asset<\/b>：對組織有價值的東西（軟體、人員、設施、服務、信譽）。<br><b>弱點 Vulnerability<\/b>：資產本身的脆弱處。弱點自己不會造成損害。<br><b>威脅 Threat<\/b>：可能造成損害的潛在事件，必須<b>利用弱點<\/b>才能傷害資產。<br><b>風險 Risk<\/b>：威脅利用弱點、對組織造成傷害的<b>可能性<\/b>。<br><b>控制措施 Control<\/b>：用來降低風險的防護機制。","a":"你家（資產）的窗戶沒鎖（弱點），附近有小偷（威脅），所以「家裡被偷」有一定機率（風險）。裝上窗鎖就是控制措施。","w":{"type":"sort","tip":"把每個項目分到正確的類別。","buckets":["資產","弱點","威脅"],"items":[["客戶資料庫",0,"有價值、需要保護的對象。"],["沒有安裝修補程式的舊伺服器",1,"系統本身的缺陷，就是弱點。"],["勒索軟體集團",2,"會主動利用弱點造成傷害的來源。"],["颱風與淹水",2,"自然災害也是威脅。"],["員工沒有接受資安訓練",1,"人員的不足也是一種弱點。"],["公司品牌與信譽",0,"無形資產也算資產。"],["預設密碼沒有更改",1,"設定上的缺陷，屬於弱點。"]]},"k":["弱點 + 威脅 → 才會產生風險","風險管理的目標是把風險降到「可接受」範圍，而不是降到零"],"q":{"q":"關於弱點，下列敘述何者正確？","o":["弱點本身就會直接造成損害","弱點必須被威脅利用才會造成損害","弱點只存在於軟體中","有弱點就一定會發生資安事件"],"a":1,"e":"學習指引：弱點本身不會產生損害，而是因為威脅出現並加以利用。"}},{"t":"ISO/IEC 27000 家族：編號翻牌記憶","b":"ISO/IEC 27000 是由 ISO 與 IEC 發布的一系列資安標準，提供建立 <b>ISMS（資訊安全管理系統）<\/b> 的框架。<br>最重要的兩本：<b>27001<\/b> 是 ISMS 的「要求」，可以拿去做第三方驗證；<b>27002<\/b> 是控制措施的「作業規範」，告訴你有哪些措施可以用。<br>點卡片翻面，記住每個編號在講什麼。","a":"27001 像駕照考試的評分標準（考官照它打分數）；27002 像駕訓班教材（教你怎麼開）。","w":{"type":"cards","items":[["27000","概述與詞彙"],["27001","ISMS 要求<br>可取得驗證"],["27002","控制措施<br>作業規範"],["27003","實施指引"],["27004","資安管理量測"],["27005","資安風險管理"],["27007","ISMS 稽核指導綱要"],["27017","雲端服務<br>資安控制"],["27018","雲端服務<br>個資保護"],["27799","醫療健康<br>資安管理"],["27011","電信業<br>資安管理"],["27701","隱私資訊管理<br>PIMS"]]},"k":["要「通過驗證」找 27001；要「參考有哪些控制措施」找 27002","雲端：27017 管資安、27018 管個資；醫療找 27799"],"q":{"q":"醫院想強化健康醫療資訊的資安管控，最適合參考哪一項標準？","o":["ISO 13485","ISO 27011","ISO 27799","ISO 27036"],"a":2,"e":"ISO 27799 是把 27002 套用到健康醫療領域的標準；13485 是醫療器材品質管理，27011 是電信業。"}},{"t":"PDCA：讓資安一直變好的循環","b":"ISMS 用 <b>PDCA<\/b> 循環持續改善：<br><b>Plan 規劃<\/b>：依公司政策與目標，建立 ISMS 的政策、目標、流程與程序。<br><b>Do 執行<\/b>：實施並運作這些政策與控制措施。<br><b>Check 查核<\/b>：量測績效、內部稽核，向管理階層報告。<br><b>Act 行動<\/b>：依稽核結果採取矯正與預防措施，持續改善。<br>資安治理是<b>由上而下（Top-Down）<\/b>的，需要高階管理階層的承諾與支持。","a":"就像減肥：訂目標和菜單（P）→ 照著吃和運動（D）→ 每週量體重（C）→ 沒瘦就調整菜單（A），然後再來一輪。","w":{"type":"steps","order":true,"items":[["Plan 規劃","建立 ISMS 政策、目標、流程，界定範圍並做風險評鑑規劃。"],["Do 執行","實施和運作政策、控制措施、流程與程序。"],["Check 查核","監控、量測績效與內部稽核，向管理階層報告。"],["Act 行動","依稽核與檢核結果採取矯正和預防措施，持續改善。"]]},"k":["PDCA 是循環，不是做一次就結束","「依稽核結果改善」是 Act；「量測與稽核」是 Check"],"q":{"q":"依據內部 ISMS 稽核結果，採取矯正與預防措施，屬於 PDCA 的哪個階段？","o":["Plan","Do","Check","Act"],"a":3,"e":"稽核本身是 Check；根據稽核結果去改善是 Act。"}}],"m2":[{"t":"資訊倫理與 PAPA","b":"<b>資訊倫理<\/b>是使用電腦、網路時的道德規範，屬於<b>自律<\/b>；法律則是有強制力的他律。<br>1986 年學者 Mason 提出 <b>PAPA<\/b>，是資訊倫理的四大議題：隱私權、正確性、財產權、使用權。","a":"倫理像排隊不插隊（沒人罰你，但你該做）；法律像闖紅燈會被開罰單。","w":{"type":"cards","items":[["P · Privacy","隱私權<br>個人資料該不該被蒐集、公開"],["A · Accuracy","正確性<br>資訊錯誤由誰負責"],["P · Property","財產權<br>軟體、資料、創作歸誰"],["A · Accessibility","使用權<br>誰有權利存取資訊"]]},"k":["PAPA = 隱私、正確、財產、使用","常見陷阱選項：「安全性」「可用性」都不在 PAPA 裡"],"q":{"q":"下列何者「不」屬於 Mason 提出的 PAPA 四大議題？","o":["隱私權","正確性","安全性","使用權"],"a":2,"e":"PAPA 是 Privacy、Accuracy、Property、Accessibility，沒有安全性。"}},{"t":"法規遵循：你的組織要守哪些規定？","b":"企業為了符合法規與要求所做的各種防範與控制措施，稱為<b>法規遵循（Compliance）<\/b>。常見的有：<br><b>個人資料保護法<\/b>（台灣）、<b>GDPR<\/b>（歐盟，2018 年施行）、<b>PCI DSS<\/b>（支付卡產業資料安全標準）、<b>HIPAA<\/b>（美國健康保險可攜性與責任性法案）。這些法規通常要求定期報告與稽核。","a":"開餐廳要守食安法、消防法；做刷卡生意就要守 PCI DSS，跟產業有關。","w":{"type":"sort","tip":"每個情境主要要遵循哪一項？","buckets":["個資法","GDPR","PCI DSS","HIPAA"],"items":[["台灣電商蒐集會員姓名電話",0,"在台灣蒐集處理個資，適用個資法。"],["網站提供服務給歐盟居民",1,"GDPR 保護歐盟境內的個人資料。"],["網路商店處理信用卡交易",2,"只要儲存、處理或傳輸持卡人資料，就要遵循 PCI DSS。"],["美國醫院處理病患健康資料",3,"HIPAA 規範美國醫療健康資訊。"]]},"k":["看到「刷卡」→ PCI DSS；「歐盟」→ GDPR；「美國醫療」→ HIPAA","GDPR 規定資料外洩通常要在 72 小時內通知主管機關"],"q":{"q":"一家公司要證明它有保護持卡人資料，應遵循哪一項標準？","o":["HIPAA","PCI DSS","ISO 27799","GDPR"],"a":1,"e":"PCI DSS 是支付卡產業資料安全標準。"}},{"t":"稽核：第一方、第二方、第三方","b":"稽核是檢查組織的政策與控制措施是否適當、有沒有被落實。依「誰來稽核」分三種：<br><b>第一方<\/b>：組織自己做的<b>內部稽核<\/b>。<br><b>第二方<\/b>：有利害關係的外部單位，例如客戶稽核供應商、<b>主管機關對所屬機構<\/b>。<br><b>第三方<\/b>：獨立的驗證或認證機構（例如 ISO 27001 驗證）、法令法規稽核。","a":"第一方像自己對答案；第二方像家長檢查你的作業；第三方像參加全國統一考試，由中立的考試中心評分。","w":{"type":"sort","tip":"這是哪一方稽核？","buckets":["第一方","第二方","第三方"],"items":[["公司稽核室檢查 IT 部門",0,"組織內部自己稽核。"],["銀行派人稽核它的委外廠商",1,"客戶對供應商的稽核。"],["主管機關稽核所屬機構",1,"學習指引把主管機關對所屬機構的稽核歸在第二方。"],["驗證機構來做 ISO 27001 驗證",2,"獨立第三方的驗證稽核。"]]},"k":["內稽 = 第一方；客戶或主管機關 = 第二方；驗證機構 = 第三方","稽核員要獨立，不能稽核自己負責的工作（職責分離）"],"q":{"q":"驗證機構到公司執行 ISO 27001 驗證稽核，屬於哪一種稽核？","o":["第一方稽核","第二方稽核","第三方稽核","自我評估"],"a":2,"e":"驗證（Certification）或認證稽核屬於第三方稽核。"}},{"t":"稽核的角色、證據與發現","b":"<b>主導稽核員<\/b>：規劃稽核、帶領小組、彙整結果寫報告、主持啟動與結案會議。<br><b>稽核小組成員<\/b>：依檢查表執行、報告缺失、保密。<br><b>受稽核方<\/b>：接受報告、決定矯正措施並安排資源完成。<br><b>稽核證據<\/b>：可查證的紀錄或事實，例如系統日誌、申請表、核准單。<br><b>稽核發現<\/b>：把證據拿去對照稽核準則評估的<b>結果<\/b>。<br><b>稽核軌跡<\/b>：事件過程留下可供稽核的文件或紀錄。","a":"證據像監視器畫面；發現像裁判看完畫面後判定「越位」。","w":{"type":"cards","items":[["稽核證據","可查證的紀錄、事實陳述<br>例：日誌、核准單"],["稽核發現","證據對照準則<br>評估後的結果"],["稽核軌跡","事件過程留下的<br>文件或紀錄"],["主導稽核員","規劃、帶隊、<br>寫報告、開結案會"],["受稽核方","接受報告、<br>決定並完成矯正"],["稽核員能力","專業、獨立、客觀<br>不稽核自己的工作"]]},"k":["發現（Findings）= 證據（Evidence）對照準則（Criteria）","沒有足夠的紀錄與證據，就無法證明組織有落實保護"],"q":{"q":"「把蒐集到的稽核證據拿來對照稽核準則進行評估的結果」稱為什麼？","o":["稽核證據","稽核發現","稽核軌跡","稽核計畫"],"a":1,"e":"這正是稽核發現（Audit Findings）的定義。"}},{"t":"資通安全管理法重點","b":"《資通安全管理法》規範<b>公務機關<\/b>與<b>特定非公務機關<\/b>（關鍵基礎設施提供者、公營事業、政府捐助的財團法人）。<br>• 依「資通安全責任等級」A 到 E 辦理不同的應辦事項。<br>• 機關要設<b>資通安全長<\/b>、配置資安專職人員，並對專職人員做<b>適任性查核<\/b>。<br>• 發現資安事件後要在 <b>1 小時內<\/b>通報。<br>• <b>危害國家資通安全產品<\/b>原則上不得使用；特定非公務機關若業務需要且無替代方案，須經資通安全長核可，函報<b>中央目的事業主管機關<\/b>核定，並列冊管理。","a":"就像學校的消防安全規定：每間教室依大小有不同的滅火器數量（責任等級），要有負責的老師（資安長），火災要立刻通報。","w":{"type":"steps","order":true,"items":[["確認業務需要","確定沒有其他替代方案，才考慮使用危害國家資通安全產品。"],["資通安全長核可","特定非公務機關先由機關的資通安全長核可。"],["函報核定","函報中央目的事業主管機關核定。"],["列冊管理","核定後列冊管理，並持續控管風險。"]]},"k":["特定非公務機關：資安長核可 → 函報「中央目的事業主管機關」核定","專職人員查核不適任：不得辦理涉及國家機密、軍事機密、國防秘密的資安業務"],"q":{"q":"特定非公務機關因業務需求且無替代方案，欲使用危害國家資通安全產品，正確程序為何？","o":["資訊長自行核定","經機關首長同意後報主管機關","經資通安全長核可，函報中央目的事業主管機關核定","經資訊長核可，函報主管機關核定"],"a":2,"e":"這是 115 年公告試題的考點：資安長核可，函報中央目的事業主管機關核定。"}}],"m3":[{"t":"個人資料與特種個資","b":"<b>個人資料<\/b>：可以直接或間接識別某個人的資料，例如姓名、出生日期、身分證字號、護照號碼、特徵、指紋、婚姻、教育、職業、聯絡方式、財務狀況等（個資法第 2 條）。<br><b>特種（敏感）個資<\/b>（第 6 條）：<b>病歷、醫療、基因、性生活、健康檢查、犯罪前科<\/b>，原則上不得蒐集、處理或利用。","a":"一般個資像你的名片；特種個資像你的病歷和前科紀錄，曝光後傷害特別大，所以法律管得更嚴。","w":{"type":"sort","tip":"這是特種個資，還是一般個資？","buckets":["特種個資","一般個資"],"items":[["病歷",0,"105 年修法新增病歷為特種個資。"],["基因",0,"屬於第 6 條特種個資。"],["健康檢查",0,"屬於第 6 條特種個資。"],["犯罪前科",0,"屬於第 6 條特種個資。"],["指紋",1,"指紋是個資，但不是第 6 條列舉的特種個資。"],["身分證字號",1,"一般個資。"],["財務狀況",1,"一般個資。"],["性生活",0,"屬於第 6 條特種個資。"]]},"k":["特種個資 6 項：病歷、醫療、基因、性生活、健康檢查、犯罪前科","指紋、生物特徵是個資，但不在特種個資清單裡，常被拿來當陷阱"],"q":{"q":"下列何者「不」屬於特種個資？","o":["病歷","健康檢查","性生活","指紋"],"a":3,"e":"指紋屬於一般個資。"}},{"t":"蒐集、處理、利用","b":"個資法把對個資的行為分三種：<br><b>蒐集<\/b>：以任何方式取得個資。<br><b>處理<\/b>：為了建立或利用個資檔案所做的記錄、輸入、儲存、編輯、更正、複製、檢索、刪除、輸出、連結或內部傳送（包括備份）。<br><b>利用<\/b>：把蒐集到的個資做「處理以外」的使用。","a":"去市場買菜是蒐集；洗菜、切菜、放冰箱是處理；煮成菜端給客人吃是利用。","w":{"type":"sort","tip":"這個動作屬於哪一種？","buckets":["蒐集","處理","利用"],"items":[["用線上表單請會員填姓名電話",0,"取得個資，是蒐集。"],["把會員資料匯入 CRM 系統",1,"輸入、儲存屬於處理。"],["替個資檔案做備份",1,"備份檔案也算在處理裡。"],["用會員電子郵件寄送行銷信",2,"把個資拿去做處理以外的用途，是利用。"],["修正會員填錯的地址",1,"更正屬於處理。"]]},"k":["處理是「為了建立或利用檔案」做的內部作業；利用是拿去用","蒐集時要告知：機關名稱、目的、類別、利用期間地區對象方式、當事人權利、不提供的影響"],"q":{"q":"把蒐集到的個人資料做「處理以外」的使用，在個資法中稱為什麼？","o":["蒐集","處理","利用","傳輸"],"a":2,"e":"這是「利用」的定義。"}},{"t":"當事人的五項權利","b":"個資法第 3 條，當事人對自己的個資有以下權利，而且<b>不得預先拋棄或用契約限制<\/b>：<br>1. 查詢或請求閱覽<br>2. 請求製給<b>複製本<\/b><br>3. 請求補充或更正<br>4. 請求停止蒐集、處理或利用<br>5. 請求刪除","a":"你存在銀行的個資就像你寄放的行李：可以來看、可以要一份影本、可以叫他們改正、可以叫他們別再用、可以叫他們丟掉。","w":{"type":"sort","tip":"這是不是當事人依法可以行使的權利？","buckets":["是法定權利","不是"],"items":[["請求閱覽自己的資料",0,"第 1 項：查詢或請求閱覽。"],["請求製給複製本",0,"第 2 項。"],["請求製給正本",1,"法條是「複製本」，沒有正本。這是 115 年試題的陷阱。"],["請求更正錯誤資料",0,"第 3 項：補充或更正。"],["請求停止行銷利用",0,"第 4 項：停止蒐集、處理或利用。"],["簽約時同意永久放棄刪除權",1,"這些權利不得預先拋棄或以特約限制。"]]},"k":["五權口訣：看、抄、改、停、刪","是「複製本」不是「正本」"],"q":{"q":"依個資法第 3 條，下列何者「不是」當事人的權利？","o":["請求停止蒐集、處理或利用","請求製給正本","查詢或請求閱覽","請求補充或更正"],"a":1,"e":"法定是請求製給複製本。"}},{"t":"組織要怎麼保護個資？","b":"• <b>公務機關<\/b>（第 18 條）：保有個資檔案者，應指定專人辦理安全維護。<br>• <b>非公務機關<\/b>（第 27 條）：應採行適當安全措施；主管機關可要求訂定「個資檔案安全維護計畫」與「業務終止後個資處理方法」。<br>• 施行細則第 12 條列出 11 項安全措施，包括配置人員與資源、界定範圍、風險評估、事故預防通報應變、內部管理程序、人員管理、教育訓練、設備安全、稽核、軌跡資料與證據保存、持續改善。<br>• 大數據分析前應<b>去識別化<\/b>，並定期評估是否可能被重新識別。","a":"保護個資像管理一間藥局：要有負責的藥師（專人）、上鎖的藥櫃（設備安全）、進出貨紀錄（軌跡）、員工訓練，還要定期盤點。","w":{"type":"steps","order":false,"items":[["配置人員與資源","指定負責人與預算。"],["界定個資範圍","先盤點有哪些個資。"],["風險評估與管理","找出風險並處理。"],["事故預防、通報、應變","外洩時知道怎麼做。"],["內部管理程序","蒐集、處理、利用都有規則。"],["資料與人員管理","權限控管、保密約定。"],["教育訓練","讓員工知道怎麼保護。"],["設備安全管理","電腦、儲存媒體要保護。"],["安全稽核","定期檢查有沒有做到。"],["軌跡與證據保存","留下存取紀錄。"],["持續改善","整體計畫不斷改進。"]]},"k":["內部員工私下下載客戶資料 → 限制權限 + 建立紀錄與警示","TLS 只保護傳輸，不能取代去識別化"],"q":{"q":"社群平台想用使用者資料做大數據分析，但資料含敏感個資，最適切的做法是？","o":["直接用原始資料分析","去識別化後分析，並定期評估再識別風險","交給廣告公司處理","用 TLS 加密連線後開放明文資料"],"a":1,"e":"去識別化兼顧資料利用和隱私，而且要持續評估是否還能被認出個人。"}},{"t":"智慧財產權與營業秘密","b":"<b>智慧財產權<\/b>包含：著作權、商標權、工業設計、專利、積體電路電路布局等。組織只能安裝和使用有授權的軟體，且不能超過授權人數。<br><b>著作權<\/b>：創作完成時就自動享有，包括著作人格權與著作財產權。<br><b>營業秘密<\/b>（營業秘密法第 2 條）三要件：①非一般涉及該類資訊之人所知（秘密性）②因秘密性而有實際或潛在經濟價值 ③所有人已採取合理保密措施。","a":"可口可樂的配方從不申請專利（專利會公開），而是當成營業秘密鎖在保險庫裡。","w":{"type":"sort","tip":"這受到哪一種保護？","buckets":["著作權","專利","商標","營業秘密"],"items":[["你寫的程式碼",0,"創作完成即享有著作權。"],["新發明的電池結構",1,"技術發明可申請專利。"],["公司的 Logo",2,"識別品牌的標誌是商標。"],["飲料的獨家配方",3,"具秘密性、經濟價值且有保密措施。"],["一本技術書",0,"文字著作受著作權保護。"]]},"k":["營業秘密三要件：秘密性、經濟價值、合理保密措施","「受雇人職務上研發的營業秘密歸雇用人」是歸屬規定，不是成立要件"],"q":{"q":"下列何者「不」是營業秘密法第 2 條所述的成立要件？","o":["已採取合理保密措施","因秘密性而有經濟價值","非一般涉及該類資訊之人所知","受雇人職務上研發者歸雇用人所有"],"a":3,"e":"(D) 是歸屬規定，不是成立要件。"}}],"m4":[{"t":"資產清冊與擁有者","b":"資產管理的第一步：識別所有與資訊有關的資產，做成<b>資產清冊<\/b>並持續維護。<br>清冊中每項資產都要指派<b>擁有者（Owner）<\/b>：<br>• 擁有者對資產的產生、使用與安全負責，也是該資產<b>風險的擁有者<\/b>。<br>• 擁有者不一定擁有財產權。<br>• 只有擁有者可以<b>調降<\/b>資訊的分級。","a":"圖書館每本書都有編號（清冊），每一區有負責館員（擁有者），清潔人員（保管人）照館員的規定打掃維護。","w":{"type":"grid","cols":["角色","負責什麼","例子"],"rows":[["擁有者 Owner","決定分類分級、核准存取、對風險負責","業務部主管對客戶名單"],["保管人 Custodian","依擁有者的要求執行保護（備份、權限設定）","系統管理員、IT 部門"],["使用者 User","依規定使用資產","一般業務人員"],["稽核員 Auditor","獨立檢查控制措施有沒有落實","內部稽核人員"]]},"k":["決定機密等級：擁有者；執行保護：保管人","系統管理員不適合決定資料的機密等級"],"q":{"q":"最有可能負責定義資訊敏感性等級的角色是？","o":["保管人","擁有者","查核員","使用者"],"a":1,"e":"分類分級由資訊擁有者決定。"}},{"t":"資產有哪些類型？","b":"資產不只電腦。常見分類：<b>資料<\/b>（資料庫、文件）、<b>軟體<\/b>（系統、應用程式）、<b>硬體<\/b>（伺服器、網路設備）、<b>人員<\/b>、<b>服務<\/b>（電力、空調、網路線路）、<b>無形資產<\/b>（信譽、品牌）。","a":"盤點一家咖啡店：咖啡機（硬體）、POS 系統（軟體）、會員資料（資料）、咖啡師（人員）、水電（服務）、店的口碑（無形）。","w":{"type":"sort","tip":"這是哪一類資產？","buckets":["資料","軟體","硬體","人員","服務/無形"],"items":[["客戶資料庫",0,""],["ERP 系統",1,""],["核心交換器",2,""],["資安工程師",3,"人員也是資產，而且常是最脆弱的一環。"],["機房電力與空調",4,"支援服務。"],["企業商譽",4,"無形資產。"],["合約掃描檔",0,""]]},"k":["人員是資產，也是常見的弱點來源","資產價值和風險會隨時間改變，要定期更新清冊"],"q":{"q":"「人員」常是資安管理中最脆弱的突破口，下列何者較「不」屬於人員安全管理措施？","o":["考勤管理","職務區隔","盡職調查","認知及宣導"],"a":0,"e":"考勤是人事行政；職務區隔、任用前盡職調查、資安宣導才是人員安全措施。"}},{"t":"資訊的分類與分級","b":"分類分級的目的：讓資訊依照它對組織的重要性，得到<b>適當等級<\/b>的保護。學習指引的範例：","a":"寄東西時，一般信件用平信，重要文件用掛號，現金要用保價：越重要的東西，保護越嚴。","w":{"type":"sort","tip":"這份資料應該分到哪一級？","buckets":["Public 公開","Internal 內部","Confidential 機密","Private 隱私"],"items":[["官網上的新聞稿",0,"公開不會造成傷害。"],["內部網站的部門公告",1,"公開不會造成重大損害。"],["尚未發表的新產品設計圖",2,"曝光會損害企業，是商業機密。"],["客戶身分證字號",3,"曝光會損害他人隱私。"],["員工信用卡號碼",3,"個人資料。"],["公司未公開的財報",2,""]]},"k":["Public < Internal < Confidential / Private","只有擁有者可以調降等級"],"q":{"q":"資訊資產分級的主要目的為何？","o":["讓所有資料一律加密","確保資訊依重要性受到適當等級的保護","減少資料數量","方便刪除舊資料"],"a":1,"e":"分級是為了讓保護強度跟資訊價值相稱。"}},{"t":"盤點流程與個資盤點","b":"ISMS 中盤點的位置：<b>定義適用範圍之後、風險評鑑之前<\/b>。沒有完整的資產清冊，就無法評估風險。<br><b>個資盤點<\/b>要記錄人、事、時、地、物：檔案名稱、保有單位與負責人、特定目的、個資類別與範圍、保有期限、蒐集方式與來源、生命週期處理活動、利用對象、國際傳遞對象。<br>新議題：<b>SBOM<\/b>（軟體物料清單）盤點軟體裡的第三方元件與版本；<b>影子 IT<\/b>（員工私用未核准的雲端或 AI 工具）要先盤點才能管理。","a":"整理房間要先把東西全部拿出來看（盤點），才知道哪些要鎖起來、哪些可以丟（風險評鑑與處理）。","w":{"type":"steps","order":true,"items":[["定義 ISMS 適用範圍","先決定要管哪些部門、系統、地點。"],["盤點資訊資產","建立清冊並指派擁有者。"],["分類分級","依 CIA 價值決定保護等級。"],["風險評鑑","識別、分析、評估風險。"],["風險處理","選擇並實施控制措施。"]]},"k":["盤點在範圍定義之後、風險評鑑之前","資產盤點與評鑑宜由跨部門的資安執行小組負責"],"q":{"q":"員工私下把程式碼上傳到未核准的 AI 工具，為管理此影子 IT 風險，首要步驟是？","o":["重灌所有電腦","封鎖所有對外連線","執行軟體與雲端服務的資產盤點","要求簽離職切結書"],"a":2,"e":"先盤點，知道大家用了哪些服務，才能評估風險、訂政策。"}}],"m5":[{"t":"風險管理的全貌","b":"風險管理包括：<b>風險評鑑<\/b>、<b>風險處理<\/b>、<b>風險接受<\/b>、<b>風險溝通<\/b>。<br><b>風險評鑑 = 風險分析 + 風險評估<\/b>：<br>• 風險分析：用定性或定量的方式估計風險大小。<br>• 風險評估：把估出來的風險和<b>風險準則<\/b>比較，決定哪些要優先處理。<br>ISO 27001:2022 第 6.1.2 條：建立風險準則 → 識別風險（含負責人）→ 分析 → 評估並排出處理順序。","a":"健康檢查：抽血化驗是「分析」（算出數值），醫生拿數值對照標準決定要不要治療是「評估」。","w":{"type":"steps","order":true,"items":[["建立風險準則","先訂好評鑑方法與「多少風險可以接受」。"],["風險識別","找出可能影響 CIA 的風險，指定風險擁有者。"],["風險分析","估計可能性與衝擊，算出風險等級。"],["風險評估","對照準則，決定優先處理順序。"],["風險處理","選擇控制措施：降低、轉移、避免、接受。"],["監控與審查","持續追蹤，情況改變就重新評鑑。"]]},"k":["分析是「算多大」，評估是「跟準則比，決定先處理誰」","風險溝通貫穿整個流程"],"q":{"q":"依風險接受準則比較各項風險的分析結果，並決定優先處理項目，屬於哪個步驟？","o":["教育訓練","評估風險並決定處理順序","建立政策文件","建立風險清冊"],"a":1,"e":"這就是風險評估（Risk Evaluation）。"}},{"t":"定性分析：可能性 × 衝擊","b":"<b>定性分析<\/b>用等級描述風險。學習指引的例子：<br>• 可能性：經常 4、可能 3、有可能 2、不可能 1、非常不可能 0<br>• 衝擊：非常高 4、高 3、中 2、低 1、非常低 0<br>• 風險等級 = 兩者相加：<b>低 0–2、中 3–5、高 6–8<\/b><br>點下方格子試試看。","a":"颱風天出門：被吹倒的機率（可能性）加上吹倒會多嚴重（衝擊），一起決定你要不要出門。","w":{"type":"riskq"},"k":["定性用「高中低」，快速但較主觀","定量用「金額」，需要可靠的數據"],"q":{"q":"依學習指引的定性範例，可能性「可能（3）」、衝擊「高（3）」，風險等級是？","o":["低風險","中風險","高風險","無法判斷"],"a":2,"e":"3 + 3 = 6，落在高風險 6–8。"}},{"t":"定量分析：SLE 與 ALE","b":"<b>定量分析<\/b>用金額表示風險：<br><b>SLE 單一預期損失 = AV 資產價值 × EF 曝光係數<\/b><br><b>ALE 年預期損失 = ARO 年發生率 × SLE<\/b><br>EF 是資產受損的比例（全毀 = 1.0）。學習指引範例：系統價值 100 萬，遭 DoS 造成 30% 時間無法服務，SLE = 30 萬。<br>拉動滑桿算算看。","a":"手機價值 3 萬（AV），摔一次螢幕破要花掉 1/3（EF），SLE 就是 1 萬；如果一年摔 2 次（ARO），ALE 就是 2 萬。這時花 3 千買保護殼就很划算。","w":{"type":"ale"},"k":["SLE = AV × EF；ALE = ARO × SLE","控制措施的年成本若低於它能減少的 ALE，就值得投資"],"q":{"q":"某系統價值 200 萬元，一次攻擊會損失 25%，平均每 2 年發生一次，ALE 是多少？","o":["50 萬","25 萬","100 萬","12.5 萬"],"a":1,"e":"SLE = 200 萬 × 0.25 = 50 萬；ARO = 0.5；ALE = 0.5 × 50 萬 = 25 萬。"}},{"t":"風險處理的四種選擇","b":"ISO/IEC 27005 提出四種處理方式：<br><b>修改（降低）<\/b>：增加或改變控制措施，降低可能性或衝擊。<br><b>保留（接受）<\/b>：風險在可接受範圍內，知情地不另外處理。<br><b>避免<\/b>：停止產生風險的活動。<br><b>分攤（轉移）<\/b>：交給更能處理的一方，例如買保險、外包。<br>處理後剩下的是<b>殘餘風險<\/b>，需經管理階層核准接受。","a":"騎機車的風險：戴安全帽（降低）、買保險（轉移）、改搭捷運不騎了（避免）、短程慢慢騎就算了（接受）。","w":{"type":"sort","tip":"這屬於哪一種風險處理？","buckets":["降低","轉移","避免","接受"],"items":[["導入網段隔離與惡意程式偵測",0,"加控制措施降低攻擊成功的可能性。"],["購買資安保險",1,"把財務損失轉給保險公司。"],["停止提供高風險的舊服務",2,"直接不做會產生風險的活動。"],["風險低於接受準則，不另處理",3,"知情地接受。"],["機房委外給專業業者",1,"把風險分攤給更能管理的一方。"],["全面啟用多因子驗證",0,"降低帳號被盜的可能性。"]]},"k":["降低 Reduce / 轉移 Transfer / 避免 Avoid / 接受 Accept","低風險或處理成本過高的項目，組織可能選擇接受"],"q":{"q":"電力公司為降低控制中心遭攻擊的可能性，導入網段隔離與惡意程式偵測，屬於？","o":["風險避免","風險降低","風險接受","風險轉移"],"a":1,"e":"加上控制措施來降低可能性，是風險降低。"}},{"t":"NIST RMF 與供應鏈風險","b":"NIST 的風險管理流程分四步：<b>Frame 界定<\/b> → <b>Assess 評估<\/b> → <b>Respond 回應<\/b> → <b>Monitor 監控<\/b>。完成評估後，下一步是回應風險。<br><b>供應鏈風險<\/b>：供應商被攻擊可能牽連到你。對策是對供應商做資安評估與審查，把資安要求寫進合約，並定期稽核。<br>資通系統的安全等級，依<b>機密性、完整性、可用性、法律遵循性<\/b>四個構面評估。","a":"供應鏈就像團購：只要有一家廠商的食物出問題，所有買的人都會受影響，所以要先審核廠商。","w":{"type":"steps","order":true,"items":[["Frame 界定風險","建立風險管理的背景、假設、限制與容忍度。"],["Assess 評估風險","識別威脅、弱點、衝擊與可能性。"],["Respond 回應風險","決定並實施處理方式。"],["Monitor 監控風險","持續追蹤風險與措施的有效性。"]]},"k":["RMF：Frame → Assess → Respond → Monitor","選供應商不能只看報價，要做資安評估"],"q":{"q":"公司採用 NIST 風險管理框架，已完成風險評估，下一步應該是？","o":["Framing risk","Responding risk","Monitoring risk","Asset Inventory"],"a":1,"e":"Assess 之後是 Respond。"}}],"m6":[{"t":"存取控制的四道關卡（由外而內）","b":"存取控制可以由外而內分成四個範疇，點開每一層看例子。另外要記住 <b>AAA<\/b>：認證（你是誰）、授權（你能做什麼）、可歸責（記錄你做了什麼）。","a":"進公司的過程：大樓門禁（實體）→ 公司 Wi-Fi 要登入（網路）→ 開電腦要帳密（系統）→ 打開資料夾要有權限（資料）。","w":{"type":"layers","items":[{"h":"① 實體存取控制","s":"誰能進入場所","d":"門禁卡、警衛、監視器、機房上鎖、訪客登記。"},{"h":"② 網路存取控制","s":"誰能連上網路","d":"防火牆、VPN、NAC 網路存取控制、Wi-Fi 認證、網段隔離。"},{"h":"③ 系統存取控制","s":"誰能登入系統","d":"帳號密碼、多因子驗證、帳號鎖定、SSO。"},{"h":"④ 資料存取控制","s":"誰能讀寫哪些資料","d":"檔案權限、資料庫權限、加密、DLP 資料外洩防護。"}]},"k":["由外而內：實體 → 網路 → 系統 → 資料","AAA：Authentication、Authorization、Accounting"],"q":{"q":"「確認使用者是誰」屬於 AAA 中的哪一項？","o":["Authentication 認證","Authorization 授權","Accounting 可歸責","Availability 可用性"],"a":0,"e":"認證是驗明身分；授權是決定能做什麼。"}},{"t":"認證三因素與多因子驗證","b":"認證因素分三類：<br><b>知識<\/b>（Something you know）：密碼、PIN、安全問題。<br><b>持有<\/b>（Something you have）：手機 OTP、智慧卡、硬體金鑰。<br><b>生物特徵<\/b>（Something you are）：指紋、臉部、虹膜。<br><b>多因子驗證（MFA）<\/b>要結合<b>不同類別<\/b>的因素。密碼加 PIN 都是知識，不算 MFA。","a":"領錢時插提款卡（持有）再輸入密碼（知識），就是雙因子。","w":{"type":"sort","tip":"這是哪一類認證因素？","buckets":["知識","持有","生物特徵"],"items":[["密碼",0,""],["手機收到的 OTP",1,"證明你持有那支手機。"],["指紋",2,""],["自然人憑證卡",1,""],["安全問題答案",0,""],["臉部辨識",2,""],["FIDO2 硬體金鑰",1,""],["PIN 碼",0,""]]},"k":["MFA 要「不同類」，兩個密碼不算","FIDO2 綁定網域，可以抗釣魚；SMS OTP、TOTP 仍可能被釣魚網站即時轉送"],"q":{"q":"員工登入 VPN 要輸入密碼並使用手機 OTP，OTP 屬於哪一類因素？","o":["知識因素","生物特徵因素","持有因素","行為因素"],"a":2,"e":"OTP 證明你持有那支手機。"}},{"t":"存取控制模型","b":"<b>DAC 自由存取控制<\/b>：資訊<b>擁有者<\/b>自己決定給誰權限（例如分享雲端檔案）。<br><b>MAC 強制存取控制<\/b>：由<b>管理者／系統<\/b>依安全標籤強制比對，使用者無法自行改變（例如軍方機密等級）。<br><b>RBAC 角色基準<\/b>：依職務角色給權限。<br><b>Rule-based 規則基準<\/b>：依預設規則（例如防火牆規則、上班時間才能登入）。<br><b>ABAC 屬性基準<\/b>：依使用者、裝置、時間、地點等多個屬性動態判斷，常用在零信任。<br><b>Claim-based 宣告基準<\/b>：依身分提供者發出的宣告（claim）判斷。","a":"DAC 像你自己決定把家裡鑰匙給誰；MAC 像軍營，門禁等級由上級規定，你沒權改；RBAC 像醫院，醫生和護理師的權限不同。","w":{"type":"sort","tip":"這個情境最像哪一種模型？","buckets":["DAC","MAC","RBAC","ABAC"],"items":[["使用者自己決定把檔案分享給誰",0,"擁有者自行決定。"],["依機密標籤，低權限者禁止讀取高機密",1,"系統強制比對標籤。"],["你是經理，所以能進人資系統",2,"依角色授權。"],["上班時間、公司電腦、台灣 IP 才允許存取",3,"多個屬性組合判斷。"]]},"k":["DAC 擁有者決定；MAC 管理者／系統強制","職責分離：避免一個人球員兼裁判"],"q":{"q":"「只有在上班時間、使用公司配發電腦且來自台灣 IP 的請求才允許」最能體現哪種模型？","o":["DAC","MAC","RBAC","ABAC"],"a":3,"e":"同時看時間、裝置、地點等屬性，是 ABAC。"}},{"t":"最小權限、零信任與特權管理","b":"<b>最小權限<\/b>：只給完成工作需要的最少權限。<br><b>需知原則<\/b>：只讓需要知道的人知道。<br><b>職責分離<\/b>：關鍵工作拆給不同人，避免一人包辦。<br><b>零信任<\/b>：永不信任、持續驗證；不因為在內網就信任，每次存取都要依情境驗證並動態授權。<br><b>JIT 即時存取<\/b>：平時權限為零，核准後在限定期間內給權限，用完收回。<br><b>帳號生命週期<\/b>：權限要跟需求連動，專案結束或離職就回收。","a":"飯店房卡：只能開你的房間（最小權限）、退房後自動失效（JIT／生命週期）、每次刷卡都會檢查（零信任）。","w":{"type":"cards","items":[["最小權限","只給完成工作<br>所需的最少權限"],["需知原則","不需要知道<br>就不讓你知道"],["職責分離","不讓同一人<br>球員兼裁判"],["零信任","永不信任<br>持續驗證"],["JIT 即時存取","平時零權限<br>核准後才給、用完收回"],["帳號生命週期","權限跟需求連動<br>專案結束就回收"]]},"k":["零信任：首次通過 MFA 也不代表整段連線都能放行","連續登入失敗：鎖定並拉長重試間隔，而不是刪帳號"],"q":{"q":"外包廠商帳號在專案結束半年後仍可登入，從「管理面」最有效的改善是？","o":["把帳號權限與需求連動","強制外包帳號用 MFA","增加登入失敗次數限制","縮短密碼期限"],"a":0,"e":"問題根源是帳號沒有跟著需求回收，所以要做帳號生命週期管理。"}},{"t":"生物辨識：誤殺與誤放","b":"生物辨識有兩種錯誤：<br><b>FRR 誤殺<\/b>（False Rejection Rate）：本人被拒絕。<br><b>FAR 誤放<\/b>（False Acceptance Rate）：冒充者被接受。<br>靈敏度越嚴，FAR 越低但 FRR 越高；兩條曲線的交叉點叫 <b>CER／EER（交叉錯誤率）<\/b>，CER 越低代表設備越準。<br>面對照片、面具、Deepfake 等<b>呈現攻擊<\/b>，要有<b>活體檢測（Liveness Detection／PAD）<\/b>。","a":"超市自動門太敏感會一直開（誤放），太遲鈍會讓客人卡在門外（誤殺），要調到剛剛好。","w":{"type":"bio"},"k":["CER 越低越準","活體檢測防照片、模型、Deepfake"],"q":{"q":"生物辨識設備在「誤殺」與「誤放」兩條曲線的交叉點稱為？","o":["FAR","FRR","CER（交叉錯誤率）","MTBF"],"a":2,"e":"交叉點是 CER（Crossover Error Rate），也叫 EER。"}}],"m7":[{"t":"對稱式 vs 非對稱式加密","b":"<b>對稱式加密<\/b>：加密和解密用<b>同一把金鑰<\/b>。速度快，適合大量資料；難題是怎麼把金鑰安全地交給對方。常見：DES、3DES、AES。<br><b>非對稱式加密<\/b>（公開金鑰加密）：一對金鑰，<b>公鑰<\/b>可以公開、<b>私鑰<\/b>只有自己有，一把加密就要用另一把解密。不需要事先共享秘密就能安全通訊，還能做數位簽章；缺點是速度慢。常見：RSA、ECC、Diffie-Hellman。","a":"對稱式像同一把鑰匙的置物櫃，鑰匙要先交到朋友手上；非對稱式像信箱的投信口，大家都能投信（公鑰加密），只有你有鑰匙打開（私鑰解密）。","w":{"type":"grid","cols":["","對稱式","非對稱式"],"rows":[["金鑰","一把，雙方共用","一對：公鑰 + 私鑰"],["速度","快","慢"],["演算法","DES、3DES、AES","RSA、ECC、D-H"],["主要用途","加密大量資料","交換金鑰、數位簽章、身分驗證"],["難題","金鑰如何安全分配","運算成本高"],["提供","機密性","機密性、驗證、不可否認性"]]},"k":["加密強度看：演算法強度、金鑰長度、金鑰保護","同樣技術下，金鑰越長越安全"],"q":{"q":"關於公開金鑰加密，下列何者最適切？","o":["讓沒有共享秘密金鑰的兩方也能安全通訊","用同一把金鑰加解密","比對稱式更快","不需要金鑰產生演算法"],"a":0,"e":"這是非對稱加密最大的價值。"}},{"t":"混合式加密：HTTPS 怎麼做的？","b":"實務上會把兩種加密<b>組合<\/b>：先用非對稱式加密安全地交換一把對稱金鑰，再用這把對稱金鑰加密大量資料。TLS（HTTPS）就是這樣運作的。按照順序點點看。","a":"先用掛號信（慢但安全）把保險箱鑰匙寄給朋友，之後的東西都用保險箱（快）傳遞。","w":{"type":"steps","order":true,"items":[["瀏覽器連線","瀏覽器向網站發出 HTTPS 連線請求。"],["伺服器送出憑證","憑證裡有伺服器的公鑰，由 CA 簽發。"],["驗證憑證","瀏覽器確認憑證由可信任的 CA 簽發、未過期、網域正確。"],["交換對稱金鑰","雙方用非對稱方式協商出一把只有彼此知道的對稱金鑰。"],["對稱加密傳資料","之後所有內容都用對稱金鑰加密，速度快。"]]},"k":["非對稱負責「交換金鑰」，對稱負責「加密資料」","TLS 在傳輸層之上加密，與應用層協定無關"],"q":{"q":"系統需要在大量資料傳輸時兼顧效能，又要安全地與眾多對象交換金鑰，最適切的架構是？","o":["以非對稱加密交換對稱金鑰，再以對稱加密資料","全程使用非對稱加密","以對稱加密交換金鑰，再用非對稱加密資料","全程對稱加密並預先共享金鑰"],"a":0,"e":"這就是混合式加密。"}},{"t":"雜湊：資料的指紋","b":"<b>雜湊函數<\/b>把任意長度的資料變成<b>固定長度<\/b>的值（訊息摘要）：<br>• <b>單向<\/b>：不能從雜湊值還原原文，所以雜湊不是加密。<br>• <b>雪崩效應<\/b>：原文改一個字，雜湊值幾乎全變。<br>• 用途：檢查完整性、儲存密碼。<br>• MD5、SHA-1 已被證實有<b>碰撞<\/b>（不同內容算出相同雜湊），不該再用於完整性與簽章；建議用 SHA-256 以上。<br>• 儲存密碼要加<b>鹽值（Salt）<\/b>：雜湊前加一段隨機字串，相同密碼也會得到不同結果，可對抗彩虹表。<br>在下面輸入文字，看看 SHA-256 怎麼變。","a":"雜湊像把蛋打成蛋汁：同一顆蛋打出來的樣子一定一樣，但你沒辦法把蛋汁變回一顆蛋。","w":{"type":"hash"},"k":["雜湊 = 固定長度、單向、雪崩","鹽值讓相同密碼產生不同雜湊，抵抗彩虹表"],"q":{"q":"雜湊運算前在密碼中加入一段隨機的唯一字串，這個技術稱為？","o":["鹽值 Salt","憑證","數位信封","訊息摘要"],"a":0,"e":"鹽值可以讓相同密碼產生不同的雜湊值。"}},{"t":"數位簽章：用誰的鑰匙？","b":"<b>數位簽章<\/b>：把文件算出雜湊，再用<b>寄件者的私鑰<\/b>加密這個摘要；收件者用<b>寄件者的公鑰<\/b>解開，比對雜湊是否一致。<br>它提供<b>完整性<\/b>和<b>不可否認性<\/b>（只有你有私鑰，所以賴不掉），但<b>不提供機密性<\/b>。<br>如果要讓內容保密，則要用<b>收件者的公鑰<\/b>加密，收件者用自己的私鑰解密。","a":"簽章像蓋你的私人印章（私鑰），大家都能拿你公開的印鑑證明（公鑰）來比對真假。","w":{"type":"sort","tip":"這個動作要用哪一把金鑰？","buckets":["寄件者私鑰","寄件者公鑰","收件者公鑰","收件者私鑰"],"items":[["寄件者簽署數位簽章",0,"簽章一定用自己的私鑰。"],["收件者驗證簽章",1,"用寄件者公開的公鑰驗證。"],["寄件者加密機密訊息給收件者",2,"用收件者的公鑰加密，只有收件者能解。"],["收件者解密機密訊息",3,"用自己的私鑰解密。"]]},"k":["簽章：自己私鑰簽、對方用你的公鑰驗","保密：用對方公鑰加密、對方用自己私鑰解"],"q":{"q":"數位簽章「無法」提供下列哪一項？","o":["完整性","不可否認性","來源驗證","機密性"],"a":3,"e":"簽章只證明是誰簽的、內容沒被改，不會把內容藏起來。"}},{"t":"PKI 與金鑰生命週期","b":"<b>PKI 公開金鑰基礎建設<\/b>：由 <b>CA 憑證機構<\/b>簽發憑證，把公鑰和持有者身分綁在一起；憑證被撤銷時透過 CRL 或 OCSP 查詢。自然人憑證就是一例。<br><b>金鑰管理注意事項<\/b>（學習指引）：金鑰設備要實體保護；金鑰要有明確啟用與終止日期；保護金鑰不被修改、遺失與破壞；私鑰不得未授權揭露；訂定金鑰被破解的處理程序；<b>不同系統不要用相同金鑰<\/b>。","a":"金鑰像家裡的鑰匙：打造、交給家人、收好、使用、定期換鎖、遺失就作廢、搬家時銷毀。","w":{"type":"steps","order":true,"items":[["產生","用安全的亂數與設備（例如 HSM）產生金鑰。"],["分發","安全地交給需要的人或系統。"],["儲存","加密保存並做實體保護，備份與歸檔。"],["使用","只在授權範圍與有效期間內使用。"],["輪替更換","到期或定期更換，降低被破解的機會。"],["撤銷","外洩或人員異動時立即撤銷。"],["銷毀","不再需要時安全銷毀，無法復原。"]]},"k":["金鑰要有有效期間","不同系統不要共用同一把金鑰"],"q":{"q":"下列何者「不是」良好的金鑰管理做法？","o":["金鑰設定明確的啟用與終止日期","在不同系統使用相同金鑰以便管理","訂定金鑰被破解的處理程序","金鑰設備要有實體保護"],"a":1,"e":"學習指引明確要求避免在不同系統使用相同金鑰。"}}],"m8":[{"t":"事件 vs 事故","b":"<b>資訊安全事件（Event）<\/b>：系統、服務或網路出現的狀態變化，<b>可能<\/b>跟資安有關。<br><b>資訊安全事故（Incident）<\/b>：有顯著機率危害營運、威脅資訊安全的一個或一連串非預期事件。<br>事件要經過<b>評估<\/b>，才決定是否升級為事故。","a":"煙霧偵測器嗶一聲是「事件」（可能只是煎魚）；確認真的起火了才是「事故」。","w":{"type":"sort","tip":"這比較像事件還是事故？","buckets":["事件 Event","事故 Incident"],"items":[["防火牆擋下一次外部掃描",0,"狀態變化，但沒有造成危害。"],["勒索軟體加密了檔案伺服器",1,"已經危害營運。"],["使用者輸錯密碼一次",0,""],["客戶個資外洩",1,""],["核心系統遭入侵且被植入後門",1,""],["防毒軟體更新失敗一次",0,""]]},"k":["事件 → 評估 → 才判定是否為事故","應變時不是「先觀察後處理」，而是判斷後立即行動"],"q":{"q":"關於資安事件發生時的應變，下列何者較「不」正確？","o":["依應變計畫進行處置","先觀察一陣子再處理","保全證據","依程序通報"],"a":1,"e":"第一時間要判斷後立即採取行動。"}},{"t":"NIST SP 800-61：事故處理四階段","b":"<b>1. 準備<\/b>：建立應變小組、工具、程序與演練。<br><b>2. 偵測與分析<\/b>：從跡證判斷是否為事故、界定影響範圍並分級。<br><b>3. 圍堵、根除與復原<\/b>：先隔離不讓擴散，再清除根因，最後恢復運作。高隱匿性惡意程式（如 Rootkit）無法確定清乾淨時，應從乾淨備份還原或重新安裝。<br><b>4. 事後活動<\/b>：檢討改善，避免再發生。","a":"像處理廚房失火：平常備滅火器（準備）→ 發現冒煙確認位置（偵測）→ 關瓦斯、滅火（圍堵根除）→ 恢復煮飯（復原）→ 檢討怎麼起火的（事後）。","w":{"type":"sort","tip":"這個動作屬於哪個階段？","buckets":["準備","偵測與分析","圍堵根除復原","事後活動"],"items":[["建立應變小組與聯絡清單",0,""],["依跡證界定影響範圍與嚴重度",1,""],["把受感染主機斷網隔離",2,"圍堵：限制擴散。"],["移除惡意程式並修補弱點",2,"根除。"],["從乾淨備份重建系統",2,"復原。"],["召開檢討會議修正流程",3,""]]},"k":["圍堵的首要目標：限制擴散、阻止損害蔓延","主機遭駭的第一步：先隔離網路"],"q":{"q":"依 NIST SP 800-61，「依觀測到的跡證進行影響範圍界定與嚴重度分級」屬於哪個階段？","o":["準備","偵測與分析","圍堵根除復原","事後活動"],"a":1,"e":"這是第二階段偵測與分析的任務。"}},{"t":"通報時限與事件分級","b":"依《資通安全事件通報及應變辦法》：<br>• 發現資安事件後 <b>1 小時內<\/b>通報。<br>• 事件分 1–4 級（4 級最嚴重），依機密性、完整性、可用性的受損程度判定，<b>取最高者<\/b>。<br>• <b>3、4 級<\/b>：36 小時內完成損害控制或復原；<b>1、2 級<\/b>：72 小時內。<br>• 歐盟 GDPR：個資外洩通常要在 <b>72 小時內<\/b>通知主管機關。<br>下面選擇 C、I、A 各自的受損等級，看看結果。","a":"醫院急診檢傷分級：看所有症狀中最嚴重的一項來決定優先順序。","w":{"type":"level"},"k":["1 小時內通報；取 CIA 中最高等級","3、4 級 36 小時；1、2 級 72 小時"],"q":{"q":"某事件機密性 2 級、完整性 3 級、可用性 1 級，最終應判定為幾級？","o":["第 3 級","第 1 級","第 2 級","由資訊主管決定"],"a":0,"e":"取三者中最高的等級：3 級。"}},{"t":"ITIL 事故管理流程","b":"ITIL（資訊技術基礎架構庫）把事故管理拆成九步。按順序點點看：","a":"像客服中心處理客訴：接到電話確認問題、建單、分類、決定急不急、先試著解決、解決不了就轉給專家、深入調查、修好、結案。","w":{"type":"steps","order":true,"items":[["事故確認","確認真的發生事故，才啟動後續工作。"],["事故記錄","記錄所有相關資訊，形成完整歷史。"],["事故分類","給予正確的分類編碼。"],["優先等級","依影響程度與緊急性排序。"],["初始診斷","服務台先做初步診斷。"],["事故提升","一線無法解決或超時，就往上提升。"],["調查與診斷","支援人員完整記錄調查過程。"],["解決與復原","排除問題並恢復服務。"],["事故關閉","確認解決後結案。"]]},"k":["先確認、再記錄、再分類","從事故中學習，減少未來發生的可能性"],"q":{"q":"ITIL 事故管理中，服務台無法解決或超過一線解決時間時，應進行哪一步？","o":["事故關閉","事故提升","事故分類","事故記錄"],"a":1,"e":"這時要提升（escalation）以獲得進一步支援。"}},{"t":"證據、SIEM 與 SOC","b":"<b>證據蒐集<\/b>：要有程序識別、收集、保存證據，維持<b>監管鏈<\/b>（誰、何時、怎麼經手），才能在法律上站得住。<br><b>SIEM<\/b>（安全資訊與事件管理）：從多種來源即時收集日誌，做關聯分析，產生威脅偵測與告警。<br><b>SOC<\/b>（資安監控中心）：負責 24 小時監控與應變的團隊。<br>ISO 27002 也要求：盡快通報事故、通報發現的弱點、從事故中學習。","a":"監管鏈像證物袋上的簽收紀錄，每次交接都要簽名，法庭才會採信。","w":{"type":"cards","items":[["SIEM","集中收集日誌<br>關聯分析與告警"],["SOC","資安監控中心<br>24 小時監控應變"],["監管鏈","證據經手紀錄<br>確保可被採信"],["弱點通報","使用者發現弱點<br>要主動通報"],["從事故中學習","分析結果用來<br>預防再次發生"],["根除","無法確認清乾淨<br>就從乾淨備份重建"]]},"k":["SIEM = 集中 + 關聯 + 告警","保全證據：不要急著重灌，先留下跡證"],"q":{"q":"能從多種資料來源即時收集，或從歷史事件分析產生威脅偵測與事故應變的是？","o":["SIEM","DLP","WAF","VPN"],"a":0,"e":"這是 SIEM 的定義。"}}],"m9":[{"t":"RPO、RTO、MTPD：三個時間目標","b":"<b>RPO 回復點目標<\/b>：最多可以接受遺失多少時間的資料。RPO = 2 小時，代表備份間隔不能超過 2 小時。<br><b>RTO 回復時間目標<\/b>：服務中斷後，多久內要恢復。RTO 越短，成本越高。<br><b>MTPD 最大可容忍中斷時間<\/b>：超過就會造成無法接受的後果。<br>規則：<b>RTO 不可大於 MTPD<\/b>；備份間隔不可大於 RPO。<br>拖動下方滑桿，看看是否達標。","a":"寫報告時電腦當機：RPO 是「最多可以重打幾分鐘的內容」（自動存檔間隔）；RTO 是「多久內要重新開好電腦繼續寫」；MTPD 是「再拖下去就趕不上截止時間」。","w":{"type":"rto"},"k":["RPO 看「資料」（往回看），RTO 看「時間」（往後看）","RTO ≤ MTPD；備份頻率 ≤ RPO"],"q":{"q":"制定 BCP 時間目標時，絕對不可違背的邏輯限制是？","o":["RTO 不可大於 MTPD","WRT 必須小於 RPO","MTPD 必須小於 RTO","RPO 不可大於 WRT"],"a":0,"e":"恢復時間超過最大可容忍中斷時間，計畫就沒有意義。"}},{"t":"熱、溫、冷備援站點","b":"重大災難時，要靠<b>異地備援中心<\/b>復原。依準備程度分三種：","a":"熱備援像隨時待命的替補球員；溫備援像在場邊熱身但還沒換裝；冷備援像只有球場，球員要臨時找。","w":{"type":"grid","cols":["","Hot Site 熱","Warm Site 溫","Cold Site 冷"],"rows":[["設備","專屬設備，系統完整鏡像","有合適設備","只有電力、空調、網路等基礎環境"],["資料","即時同步，幾乎不遺失","有時間差，可能遺失部分資料","要從備份還原"],["切換速度","立即接管","需要一段時間","最慢，要搬設備、安裝、設定"],["成本","最高","中","最低"]]},"k":["異地備援的目的：避免單一地域災難同時毀掉主系統與備份","要「立即切換、資料幾乎零遺失」→ 熱備援"],"q":{"q":"公司希望系統故障時立即切換到另一台伺服器，資料幾乎零遺失，應採用？","o":["離線備份","熱備援","溫備援","冷備援"],"a":1,"e":"熱備援即時同步、可立即接管。"}},{"t":"營運持續管理（BCM）流程","b":"<b>BCM<\/b> 保護關鍵業務不因災難中斷。典型流程如下，按順序點點看。重點：<br>• 要先建立業務持續運作策略（範圍、政策），才做 <b>BIA 營運衝擊分析<\/b>。<br>• BIA 找出核心業務與它們的復原時效需求（RTO、RPO、MTPD）。<br>• BCM 必須由<b>所有核心業務相關部門<\/b>共同投入，不是只有 IT 的事。","a":"學校的防災計畫：先決定要保護哪些活動（上課、考試）、評估停擺的影響、規劃替代方案、寫成計畫、定期演練、每年更新。","w":{"type":"steps","order":true,"items":[["建立業務持續運作策略","確認範圍、政策與組織。"],["營運衝擊分析 BIA","識別核心業務，定出 RTO、RPO、MTPD。"],["發展復原策略","選擇備援方式與資源。"],["制定營運持續計畫 BCP","寫成可執行的計畫與程序。"],["測試與演練","定期演練確認可行。"],["維護與改善","依變化與演練結果更新計畫。"]]},"k":["BIA 之前要先建立業務持續運作策略","BCM 是全公司的事"],"q":{"q":"在進行 BIA 之前，通常應先完成哪一項？","o":["發展復原策略","維護營運持續計畫","建立業務持續運作策略","測試與演練"],"a":2,"e":"先定範圍與策略，才知道要分析哪些業務。"}},{"t":"可用性怎麼算？","b":"學習指引的公式：<b>可用性(%) = (約定服務時間 − 停機時間) ÷ 約定服務時間 × 100%<\/b><br>其他指標：<b>MTRS<\/b>（平均復原服務時間），涵蓋記錄、回應、解決、實體修復或更換與恢復的時間。<br>規劃策略時要考慮：服務對營運的重要性、風險評鑑、復原時間、復原成本、安全性。<br>試試看不同的可用性目標，一年可以停機多久。","a":"「三個 9」聽起來很高，但一年其實能停機將近 9 小時。","w":{"type":"avail"},"k":["99.9% ≈ 一年停機 8.76 小時","每多一個 9，停機時間少十倍，成本卻大增"],"q":{"q":"約定服務時間 1000 小時，停機 5 小時，可用性是？","o":["99.5%","95%","99.95%","99%"],"a":0,"e":"(1000 − 5) ÷ 1000 = 99.5%。"}}],"t2":[{"t":"OSI 七層：網路通訊的分工表","b":"1984 年 ISO 發布 <b>OSI 參考模型<\/b>，把網路通訊拆成七層，每層只負責一件事。它是「概念模型」，實際網路跑的是 TCP/IP，但大家都用 OSI 的語言溝通，例如「這是第三層的問題」。<br>口訣（由上到下）：<b>All People Seem To Need Data Processing<\/b>；（由下到上）：<b>Please Do Not Throw Sausage Pizza Away<\/b>。<br>點開每一層看它負責什麼、PDU 叫什麼、有哪些攻擊。","a":"寄一份禮物到國外：寫卡片（應用）→ 翻譯成對方的語言（展示）→ 約好收件時間（會議）→ 選掛號或平信（傳輸）→ 寫國際地址、選航線（網路）→ 交給本地郵差送到下一站（資料連結）→ 卡車和飛機實際載運（實體）。","w":{"type":"layers","items":[{"h":"L7 應用層 Application","s":"提供網路服務給應用程式","d":"不是 Chrome、LINE 本身，而是它們使用的<b>協定<\/b>：HTTP/HTTPS、DNS、SMTP、POP3/IMAP、FTP、SSH、DHCP。<br>攻擊：SQL Injection、XSS、暴力登入、應用層 DDoS。","tag":"資料 Data"},{"h":"L6 展示層 Presentation","s":"翻譯官：格式轉換、加密、壓縮","d":"字元編碼（ASCII、UTF-8）、加解密（TLS/SSL 常被歸在這層附近）、壓縮（JPEG、MP3、MP4）。","tag":"資料 Data"},{"h":"L5 會議層 Session","s":"管理對話的建立、維持與結束","d":"讓每個分頁有各自的對話；單工、半雙工（對講機）、全雙工（電話）；檢查點讓下載可以續傳。","tag":"資料 Data"},{"h":"L4 傳輸層 Transport","s":"把資料送到正確的程式（埠號）","d":"<b>TCP<\/b>：三向交握、可靠、有順序，PDU 叫 <b>Segment 區段<\/b>。<b>UDP<\/b>：免連線、快但不保證送達，PDU 叫 Datagram。<br>埠號：HTTP 80、HTTPS 443、SSH 22、DNS 53。<br>攻擊：SYN Flood、DDoS。","tag":"區段 Segment"},{"h":"L3 網路層 Network","s":"IP 定址與路由","d":"用 <b>IP 位址<\/b>跨網路找路，像郵遞地址；設備：<b>路由器<\/b>；協定：IP、ICMP（ping）、IPsec；ARP 把 IP 對應到 MAC。PDU 叫 <b>Packet 封包<\/b>。<br>攻擊：IP Spoofing、Source Route、BGP 劫持。","tag":"封包 Packet"},{"h":"L2 資料連結層 Data Link","s":"同一個區網內，設備對設備","d":"用 <b>MAC 位址<\/b>（48 位元，前 24 位元是廠商 OUI），像身分證號碼；設備：<b>交換器<\/b>；PDU 叫 <b>Frame 訊框<\/b>，尾端有 FCS 檢查碼。<br>攻擊：封包監聽、ARP 欺騙、VLAN 跳躍、MAC Flooding。","tag":"訊框 Frame"},{"h":"L1 實體層 Physical","s":"把 0 與 1 變成電、光、無線訊號","d":"纜線規格、電壓、傳輸速度；設備：<b>集線器 Hub<\/b>（不分青紅皂白地廣播給所有埠）。<br>攻擊：線路搭接竊聽、破壞線路。","tag":"位元 Bits"}]},"k":["PDU：L4 Segment、L3 Packet、L2 Frame、L1 Bits","MAC 像身分證號（平面），IP 像郵遞地址（有階層）"],"q":{"q":"交換器主要依據哪一層的位址轉送資料？","o":["L1 實體層","L2 資料連結層的 MAC","L3 網路層的 IP","L4 傳輸層的埠號"],"a":1,"e":"交換器看 MAC 位址；路由器看 IP 位址。"}},{"t":"封裝與解封裝：資料怎麼一路包下去","b":"傳送時資料<b>由上往下<\/b>，每一層加上自己的標頭（header），這叫<b>封裝<\/b>；接收端<b>由下往上<\/b>一層層拆開，叫<b>解封裝<\/b>。<br>沿路經過每台路由器時：<b>MAC 標頭每一跳都換<\/b>，<b>IP 標頭端到端不變<\/b>（TTL 每跳減 1）。<br>按「下一步」看封裝過程。","a":"俄羅斯娃娃：一層一層套上去，對方再一層一層打開。","w":{"type":"encap"},"k":["L4 加埠號 → Segment；L3 加 IP → Packet；L2 加 MAC 與 FCS → Frame；L1 變成訊號","每一跳換 MAC，IP 不變"],"q":{"q":"封裝時，在資料前加上來源與目的「埠號」的是哪一層？","o":["L2 資料連結層","L3 網路層","L4 傳輸層","L7 應用層"],"a":2,"e":"埠號屬於傳輸層的 TCP/UDP 標頭。"}},{"t":"OSI 對照 TCP/IP；TCP 對比 UDP","b":"實際運作的 <b>TCP/IP 模型<\/b>只有四層，對照如下。TCP/IP 先在 ARPANET 上跑起來，靠先發優勢贏了；業界習慣「用 OSI 思考溝通，用 TCP/IP 實際運作」。<br>傳輸層的兩個主角 TCP、UDP 比較見下表；點表頭可以標亮。","a":"TCP 像掛號信，要簽收、遺失會補寄；UDP 像廣播或傳單，發出去就算了，所以直播寧願畫面糊一下也不要卡住。","w":{"type":"grid","cols":["OSI","TCP/IP","常見協定"],"rows":[["L7 應用 / L6 展示 / L5 會議","應用層","HTTP、HTTPS、DNS、SMTP、SSH、FTP"],["L4 傳輸","傳輸層","TCP、UDP"],["L3 網路","網際網路層","IP、ICMP、IPsec"],["L2 資料連結 / L1 實體","網路存取層","Ethernet、Wi-Fi、ARP"]],"extra":{"cols":["","TCP","UDP"],"rows":[["連線","連線導向，三向交握","免連線"],["可靠性","確認、重傳、有順序","盡力而為，可能遺失"],["速度","較慢","快、延遲低"],["標頭","20–60 bytes","固定 8 bytes"],["用途","網頁、Email、檔案傳輸","影音串流、VoIP、遊戲、DNS、Syslog 514"]]}},"k":["TCP/IP 四層：應用、傳輸、網際網路、網路存取","Syslog 用 UDP 514，流量大時可能遺失"],"q":{"q":"公司以 UDP 514 遠端蒐集 Syslog，下列何者最正確？","o":["遠端日誌不能當證據","網路流量大時可能遺失資料","Syslog 不需加密","日誌存放時不應加密"],"a":1,"e":"UDP 不保證送達，流量大時可能掉封包。"}},{"t":"各層的安全協定","b":"要保護不同層的通訊，要用對應的協定：<br>• <b>應用層<\/b>：HTTPS（HTTP + TLS）、SSH、SFTP、S/MIME、PGP。<br>• <b>傳輸層附近<\/b>：TLS／SSL，介於應用與傳輸之間，提供加密與來源驗證。<br>• <b>網路層<\/b>：IPsec，可建立 VPN，保護 IP 封包的機密性與完整性。<br>• <b>資料連結層<\/b>：WPA2／WPA3 無線加密、L2TP、L2F、PPTP。<br>常見陷阱：<b>SSH 不在資料連結層<\/b>，它是應用層協定。<br>另外注意 <b>SFTP 是檔案傳輸<\/b>，遠端 Shell 要用 SSH。","a":"不同層的保全：大樓門禁（資料連結層）、電梯刷卡（網路層）、辦公室門鎖（傳輸層）、保險箱（應用層）。","w":{"type":"sort","tip":"這個協定主要運作在哪一層？","buckets":["應用層","TLS（應用與傳輸之間）","網路層","資料連結層"],"items":[["HTTPS",0,"HTTP 跑在 TLS 上，屬應用層協定。"],["SSH",0,"應用層，不在資料連結層。"],["TLS / SSL",1,""],["IPsec",2,""],["WPA3",3,"無線區網加密。"],["L2TP",3,"名稱裡的 L2 就是 Layer 2。"],["SFTP",0,"基於 SSH 的檔案傳輸。"]]},"k":["IPsec → 網路層 VPN；TLS → HTTPS 的基礎","檔案傳輸 FTPS/SFTP；網頁 HTTPS；寄信 SMTPS；遠端 Shell 用 SSH"],"q":{"q":"關於協定與 OSI 層級的對應，下列何者錯誤？","o":["HTTPS 透過 TLS 提供端對端加密","TLS 介於應用層與傳輸層之間","IPsec 可建立 VPN 保護 IP 封包","SSH 運作於資料連結層加密 MAC 位址"],"a":3,"e":"SSH 是應用層協定。"}},{"t":"無線網路與加密工作模式","b":"<b>無線加密演進<\/b>：WEP（已破解）→ WPA → WPA2 → <b>WPA3<\/b>。WPA3 用 <b>SAE（同等實體同時驗證）<\/b>交握，強化對<b>離線字典／暴力破解<\/b>的防護。<br>無線攻擊：<b>Evil Twin<\/b>（假冒同名 AP）、<b>KRACK<\/b>（WPA2 金鑰重裝）、<b>降級攻擊<\/b>（在 WPA3 過渡模式中逼用戶端改用 WPA2）。<br><b>區塊加密工作模式<\/b>：ECB 同樣明文得到同樣密文，不安全；CBC 需搭配 MAC 才有完整性；<b>GCM<\/b> 是 AEAD，同時提供加密與完整性驗證。","a":"降級攻擊就像小偷騙你：「新門鎖壞了，先用舊的那把吧」，然後撬開舊鎖。","w":{"type":"grid","cols":["","ECB","CBC","GCM"],"rows":[["原理","每個區塊獨立加密","每個區塊與前一個密文串連","計數器模式 + 認證標籤"],["相同明文","相同密文，會露出圖樣","不同","不同"],["完整性","沒有","沒有（要另外加 MAC）","有（AEAD）"],["評價","不建議使用","可用但要注意","TLS 1.2/1.3 常用，推薦"]]},"k":["WPA3 → SAE，防離線暴力破解","要同時加密與驗證完整性 → GCM"],"q":{"q":"哪一種對稱區塊加密工作模式同時具備加密與完整性驗證？","o":["CBC","GCM","ECB","DES"],"a":1,"e":"GCM 是 AEAD 模式。"}},{"t":"VPN、數位簽章、電子簽章與憑證","b":"<b>VPN<\/b>：用通道協定（Tunneling）在兩端建立安全通道；<b>沒有加密的 VPN 仍可能被竊聽<\/b>。常見協定：L2F、L2TP、PPTP、IPsec、TLS/SSL。<br><b>數位簽章<\/b>：用簽署人的<b>私鑰<\/b>加密文件摘要，可用公鑰驗證，提供不可否認性與完整性。<br><b>電子簽章<\/b>：範圍更廣，凡能辨識簽署人身分與文件真偽的都算，包含數位簽章、指紋、人臉、簽名筆跡。<br><b>憑證<\/b>：載有簽章驗證資料，用來確認簽署人身分的電子證明。<br><b>SNMP<\/b>：最常用的網路管理協定，監控網路設備狀態。","a":"電子簽章像「所有能證明是你的方式」，數位簽章是其中用密碼學做的那一種。","w":{"type":"cards","items":[["VPN","通道協定建立安全通道<br>沒加密仍可能被竊聽"],["數位簽章","私鑰簽、公鑰驗<br>不可否認 + 完整性"],["電子簽章","範圍更廣<br>含指紋、人臉、筆跡"],["憑證","確認簽署人身分的<br>電子形式證明"],["SNMP","網路管理協定<br>監控設備狀態"],["網路存取保護","用戶端要符合安全狀態<br>才能連上企業網路"]]},"k":["數位簽章 ⊂ 電子簽章","VPN 的安全來自加密，不是通道本身"],"q":{"q":"VPN 主要利用什麼技術在兩端建立安全連線？","o":["通道協定 Tunneling","DHCP","NAT","ARP"],"a":0,"e":"VPN 用 Tunneling Protocol 建立通道，再加上加密保護內容。"}}],"t1":[{"t":"四種網路攻擊類型","b":"學習指引把網路攻擊分成四類，各自破壞不同的安全性：<br><b>中斷 Interruption<\/b>：資料傳不到目的地 → 可用性。<br><b>攔截 Interception<\/b>：未授權取得傳送內容 → 機密性。<br><b>篡改 Modification<\/b>：內容被修改 → 完整性。<br><b>偽造 Fabrication<\/b>：假冒他人傳送資料 → 真實性（驗證性）。","a":"寄信的四種倒楣事：信被丟掉（中斷）、被偷看（攔截）、被改內容（篡改）、有人冒你的名寄信（偽造）。","w":{"type":"sort","tip":"這屬於哪一類攻擊？","buckets":["中斷","攔截","篡改","偽造"],"items":[["DDoS 讓網站無法連線",0,""],["用 Sniffer 竊聽明文密碼",1,""],["中間人把轉帳帳號改掉",2,""],["冒用主管名義寄信要求匯款",3,""],["剪斷網路線",0,""],["IP Spoofing 偽造來源位址",3,""]]},"k":["中斷→A、攔截→C、篡改→I、偽造→真實性","DoS 的目的是耗盡資源，不是偷資料"],"q":{"q":"關於 DoS／DDoS，下列何者最適切？","o":["通常只用單一來源","只會讓網路變慢不會癱瘓主機","主要目的是耗盡目標系統的資源","只能經由惡意程式散播"],"a":2,"e":"阻斷服務的核心是耗盡資源，讓正常使用者無法存取。"}},{"t":"各層常見攻擊","b":"用 OSI 的角度看攻擊會比較好記。下面把攻擊分到它主要發生的層，分完後看說明。","a":"就像防小偷要分大門、窗戶、保險箱，網路防禦也要每一層都顧到。","w":{"type":"sort","tip":"這個攻擊主要發生在哪一層？","buckets":["L1 實體","L2 資料連結","L3 網路","L4 傳輸","L7 應用"],"items":[["線路搭接竊聽",0,"直接在纜線上動手腳。"],["ARP 欺騙",1,"ARP 把 IP 對應到 MAC，欺騙它就能攔截區網流量。"],["VLAN 雙重標籤攻擊",1,"利用 802.1Q 標籤跳到其他 VLAN。"],["IP Spoofing／Source Route",2,""],["BGP 劫持",2,"偽造路由宣告，把流量導走。"],["SYN Flood",3,"耗盡 TCP 連線資源。"],["SQL Injection",4,""],["暴力破解登入",4,""]]},"k":["DDoS 分基礎設施層（L3、L4）和應用層（L6、L7）","暴力登入對策：輸錯數次就鎖定"],"q":{"q":"哪一種防禦機制最能驗證 BGP 路由的合法性，降低 BGP 劫持？","o":["IDS","RPKI","VLAN 分段","DHCP Snooping"],"a":1,"e":"RPKI 用憑證驗證 IP 前綴與 AS 的對應。"}},{"t":"防火牆：規則怎麼寫？","b":"防火牆放在網路邊界，依規則過濾流量：<br>• <b>封包過濾<\/b>（網路層）：看 IP、埠號、協定等<b>表頭<\/b>，不看內容；規則複雜要有經驗的人設定。<br>• <b>狀態檢測<\/b>：記得連線狀態，回應封包自動放行。<br>• <b>應用層／代理型<\/b>：檢查應用內容，代理用戶端存取資源；<b>WAF<\/b> 專門保護網站。<br>原則：<b>預設拒絕（Default Deny）<\/b>，逐主機、逐服務只開必要的。<br>在下方勾選規則，讓網頁伺服器只開 HTTPS，SSH 只給管理員。","a":"防火牆像大樓警衛：封包過濾只看訪客證件（表頭），應用層防火牆會打開包包檢查（內容）。","w":{"type":"fw"},"k":["預設拒絕，只開必要的服務","封包過濾看不到加密內容裡的惡意指令"],"q":{"q":"下列何者正確描述封包過濾式防火牆？","o":["能偵測加密內容中的惡意指令","需要有經驗的管理人員建立複雜規則","能阻擋已知惡意網站的所有流量","主要檢查封包中的資料內容"],"a":1,"e":"它只看表頭，規則要靠管理人員細心設定。"}},{"t":"IDS、IPS 與其他防線","b":"<b>IDS 入侵偵測系統<\/b>：監控網路或主機，發現可疑活動就<b>告警<\/b>。<br><b>IPS 入侵防禦系統<\/b>：部署在流量路徑上，可以<b>即時阻斷<\/b>、調整或隔離惡意流量。<br>其他防線：防毒系統（受感染電腦要先移出網路）、垃圾郵件過濾、DMZ（把對外服務放在隔離區）。<br>L2 防護：<b>DHCP Snooping<\/b> 擋惡意 DHCP、<b>DAI<\/b> 擋 ARP 欺騙、<b>Port Security<\/b> 限制 MAC 數量、Native VLAN 改成未使用的 VLAN 防雙重標籤攻擊。","a":"IDS 像監視器加警鈴，只會叫；IPS 像會自己關門的保全。","w":{"type":"sort","tip":"這個攻擊該用哪一個防護？","buckets":["DHCP Snooping","DAI 動態 ARP 檢查","Native VLAN 改為未使用","RPKI"],"items":[["惡意 DHCP 伺服器發假 DNS 設定",0,"只允許信任埠回應 DHCP。"],["ARP 欺騙中間人攻擊",1,""],["VLAN 雙重標籤攻擊",2,""],["BGP 路由劫持",3,""]]},"k":["IDS 偵測告警；IPS 即時阻斷","惡意 DHCP 的後續威脅：發錯誤 DNS，把人導到惡意網站"],"q":{"q":"惡意 DHCP 伺服器最可能造成的後續威脅是？","o":["提供錯誤 DNS 設定，引導受害者到惡意網站","直接取得所有設備管理員權限","直接加密受害主機檔案","對目標發動 DDoS"],"a":0,"e":"控制 DHCP 就能控制用戶端的 DNS 與閘道設定。"}},{"t":"社交工程與釣魚","b":"<b>社交工程<\/b>：利用人性（信任、恐懼、好奇、急迫）騙人做出動作或洩露資訊。<br><b>釣魚 Phishing<\/b>：假冒可信單位，騙取帳密、信用卡等資料。<br>變形：<b>魚叉式釣魚<\/b>（針對特定對象）、<b>鯨釣<\/b>（針對高階主管）、<b>簡訊釣魚 Smishing<\/b>、<b>語音釣魚 Vishing<\/b>。<br>注意：魚叉式釣魚不是程式開發疏失造成的，而是針對人。","a":"詐騙集團打電話說你家人出事要匯款，就是典型的社交工程。","w":{"type":"cards","items":[["Phishing","大量寄送的假信<br>騙帳密或卡號"],["Spear Phishing","魚叉式<br>針對特定人或組織"],["Whaling","鯨釣<br>鎖定高階主管"],["Smishing","簡訊釣魚"],["Vishing","電話語音釣魚"],["CAPTCHA","區分人與機器<br>擋自動化攻擊"]]},"k":["最有效的防線是教育訓練 + 多因子驗證","看到急迫、要求保密、要你點連結輸入密碼，先停下來查證"],"q":{"q":"下列何者「不」是開發過程中未留意程式安全所造成的問題？","o":["魚叉式網路釣魚","SQL Injection","XSS","CSRF"],"a":0,"e":"魚叉式釣魚是針對人的社交工程。"}}],"t3":[{"t":"系統強化：縮小攻擊面","b":"<b>系統強化（Hardening）<\/b>：用最少的功能來配置作業系統，<b>關閉不必要的服務、移除預設帳號、套用安全基準組態<\/b>（例如政府的 <b>GCB<\/b>），縮小攻擊面。<br>對已不再提供修補的舊系統，考慮從網路隔離。<br>對系統軟體的更新要有流程：經授權、由受訓人員執行，並準備<b>還原（rollback）策略<\/b>。","a":"強化像把家裡用不到的門窗都封起來，小偷能進來的地方就少了。","w":{"type":"sort","tip":"這算不算「系統強化」？","buckets":["是系統強化","不是"],"items":[["關閉不必要的服務",0,""],["移除或停用預設帳號",0,""],["套用 GCB 安全基準",0,""],["停用光碟與隨身碟的 autorun",0,""],["同時安裝多套防毒軟體",1,"那是多層防禦，不是強化的定義。"],["為了方便測試開放所有連接埠",1,"反而擴大攻擊面。"]]},"k":["強化 = 最小化：最少服務、最少帳號、安全組態","變更前準備 rollback 策略，保留前一版本"],"q":{"q":"關於系統強化，下列何者最適切？","o":["關閉不必要服務、移除預設帳號、設定安全基準以縮小攻擊面","安裝多套防護軟體","對所有資料完整加密","在網路安裝 IPS"],"a":0,"e":"這就是 Hardening 的定義。"}},{"t":"修補管理","b":"修補程式（Patch）要<b>及時或定期<\/b>套用，包含用戶端與伺服器，並用<b>集中式管理<\/b>部署。安裝前要<b>先測試<\/b>，確認有效且不會造成無法容忍的副作用。按順序點點看：","a":"修補像疫苗：要定期打，但新疫苗也要先確認安全才大規模施打。","w":{"type":"steps","order":true,"items":[["取得修補資訊","訂閱廠商公告、VANS、CVE 情報。"],["評估影響","確認哪些資產受影響、風險多大。"],["測試","在測試環境驗證有效且無嚴重副作用。"],["集中部署","用集中式管理工具派送。"],["驗證","確認都已安裝成功。"],["無法修補者","隔離、加強監控或其他補償措施。"]]},"k":["先測試再部署","不再支援的舊系統 → 考慮網路隔離"],"q":{"q":"主機確定遭駭後，資安人員第一項處置行動最適切的是？","o":["先申報再等指示","立即格式化重灌","立即將主機與網路隔離","通知所有人改密碼"],"a":2,"e":"先隔離防止擴散，也能保留跡證。"}},{"t":"帳號與存取管理","b":"• 建立正式的使用者<b>註冊與取消註冊<\/b>程序。<br>• 每人<b>獨立唯一的帳號<\/b>，才能把活動追到個人。<br>• 用 <b>LDAP<\/b> 做集中式帳號管理（例如 Windows AD、OpenLDAP）。<br>• 新帳號預設只給<b>最低權限<\/b>。<br>• <b>帳號鎖定<\/b>：多次失敗後鎖定，且<b>逐步延長<\/b>鎖定時間並設上限，既擋暴力破解又不會永久誤鎖。<br>• Windows 的登入紀錄看<b>事件檢視器 → 安全性<\/b>。","a":"公司門禁卡一人一張，離職就收回；刷錯太多次就暫時鎖住。","w":{"type":"cards","items":[["唯一帳號","一人一帳號<br>活動可追溯"],["LDAP / AD","集中式<br>帳號密碼管理"],["最低權限","預設只給<br>工作所需"],["漸進式鎖定","多次失敗後鎖定<br>時間逐步延長並設上限"],["取消註冊","離職、調職<br>立即停用"],["事件檢視器","安全性紀錄<br>看登入是否異常"]]},"k":["三次失敗就「永久鎖定」會誤傷合法使用者","只記錄失敗次數、不鎖定，擋不住暴力破解"],"q":{"q":"能有效防止暴力破解、又避免合法使用者被誤鎖的策略是？","o":["多次失敗後增加鎖定時間，並設定最大鎖定時間","只記錄不鎖定","三次失敗永久鎖定","每次失敗就要求改密碼"],"a":0,"e":"漸進式鎖定兼顧安全與可用性。"}},{"t":"記憶體防護機制","b":"很多攻擊（例如緩衝區溢位）需要知道或改寫記憶體。作業系統用這些機制擋：","a":"ASLR 像每天換停車位，小偷不知道你的車停哪；DEP 像規定倉庫只能放貨不能住人，資料區不能拿來執行程式。","w":{"type":"grid","cols":["機制","做什麼","擋什麼"],"rows":[["ASLR / KASLR","每次啟動時隨機配置（核心）記憶體位址","需要先知道或猜出記憶體位址的攻擊"],["DEP / NX","把資料區標成不可執行","把惡意程式碼塞進堆疊或堆積後執行"],["Stack Canary","在返回位址前放檢查值，被覆寫就中止","堆疊型緩衝區溢位"],["最小權限 / SELinux","限制程式能做的事","降低被攻破後的損害"]]},"k":["「必須先取得或推測核心記憶體位址」→ KASLR","DEP 防執行、ASLR 防定位"],"q":{"q":"攻擊需先推測核心記憶體位址才能利用緩衝區溢位，哪種機制最能降低成功率？","o":["最小特權原則","禁止未簽章驅動","ASLR / KASLR","SELinux"],"a":2,"e":"位址隨機化讓攻擊者猜不到位址。"}},{"t":"可移除媒體與常用指令","b":"<b>可移除媒體管控<\/b>：檔案加密、限制 USB 使用、大量部署用 AD 群組原則、個別電腦用本機群組原則、封鎖藍牙與紅外線埠、控管燒錄、停用 autorun。<br>排查網路問題常用的 Windows 指令，分一分：","a":"指令就像醫生的聽診器、體溫計，各量不同的東西。","w":{"type":"sort","tip":"想做這件事，用哪個指令？","buckets":["ping","ipconfig","netstat","arp","nslookup","tracert"],"items":[["測試與某台主機是否連得通",0,"ICMP Echo。"],["查看本機 IP、閘道設定",1,""],["查看目前有哪些連線與監聽埠",2,""],["查看 IP 與 MAC 的對應表",3,""],["查詢網域名稱解析",4,""],["查看封包經過哪些路由器",5,""]]},"k":["測連通 → ping；查連線 → netstat；查 DNS → nslookup","大量電腦統一管控 USB → AD 群組原則"],"q":{"q":"Windows 設備遭入侵後，要測試它與某外部 IP 的連線是否暢通，最適切的指令是？","o":["ipconfig","ping","arp","nslookup"],"a":1,"e":"ping 用 ICMP 測連通性。"}}],"t4":[{"t":"惡意手法辭典","b":"學習指引列出的作業系統與應用程式攻擊手法，先讀描述再分類：","a":"同樣是壞人，有的撬鎖（溢位）、有的偷配鑰匙（後門）、有的綁架勒贖（勒索），手法不同。","w":{"type":"sort","tip":"這段描述是哪一種手法？","buckets":["緩衝區溢位","後門","勒索軟體","邏輯炸彈","殭屍網路","Rootkit"],"items":[["寫入超過緩衝區大小的資料，奪取程式控制權",0,""],["繞過正常安全控管，用隱密管道存取系統",1,""],["把硬碟檔案加密，要求付贖金換金鑰",2,""],["嵌在正常軟體中，特定日期或條件才發作",3,""],["數萬台被控制的電腦聽命發動 DDoS",4,""],["取得 root 權限並隱藏檔案、程序與入侵紀錄",5,""]]},"k":["Rootkit 的核心是「隱藏」","寫入 Run/RunOnce 登錄機碼開機自動執行 = 持久化"],"q":{"q":"駭客入侵後把惡意程式加入登錄檔的 Run/RunOnce，每次開機自動執行，這屬於？","o":["密碼暴力破解","系統後門與持久化","中間人攻擊","社交工程"],"a":1,"e":"讓惡意程式在重開機後仍能存活，就是持久化。"}},{"t":"SQL Injection 實驗室","b":"<b>SQL Injection<\/b>：在輸入欄位夾帶 SQL 指令，設計不良的程式把它直接拼進查詢，資料庫就會照著執行，可能被讀取、修改甚至刪除整個資料庫。<br>種類：<b>In-band<\/b>（結果直接回傳）、<b>Blind／Inferential<\/b>（看不到結果，靠真假或時間差推敲）、<b>Out-of-band<\/b>（讓資料庫發 DNS 或 HTTP 請求把資料送出去）。<br>最有效的防禦：<b>預備語句（Prepared Statement）／參數化查詢<\/b>。下面自己試試。","a":"像點餐時在「備註」欄寫「順便把收銀機的錢給我」，如果店員照單全收就糟了。參數化查詢就是店員只把備註當備註看。","w":{"type":"sqli"},"k":["防 SQLi：參數化查詢 > 輸入驗證","利用資料庫的 DNS 請求外送資料 → Out-of-band SQLi"],"q":{"q":"哪一種 SQLi 會利用資料庫伺服器的 DNS 請求把資料傳給攻擊者？","o":["Inferential","Out-of-band","Blind","In-band"],"a":1,"e":"資料透過另一條通道（DNS）送出，就是 Out-of-band。"}},{"t":"XSS、CSRF、SSRF 怎麼分？","b":"三個名字很像，重點在「誰被騙去做事」：","a":"XSS 像在公布欄貼了一張會偷你錢包的紙；CSRF 像有人趁你登入網銀時，騙你點一個會自動轉帳的連結；SSRF 像騙櫃台人員替你打電話到內部辦公室。","w":{"type":"grid","cols":["","XSS 跨站腳本","CSRF 跨站請求偽造","SSRF 伺服端請求偽造"],"rows":[["發生什麼","惡意腳本被插入網頁，在其他使用者的瀏覽器執行","誘使已登入的使用者，在不知情下送出非預期的請求","讓伺服器替攻擊者去存取內部或非預期的位址"],["被利用的是","使用者的瀏覽器","使用者已登入的身分","伺服器本身"],["防禦","輸入驗證、輸出編碼、CSP","CSRF Token、SameSite Cookie、CAPTCHA","白名單、預設阻擋外部流量"]]},"k":["XSS 偷東西、CSRF 借身分、SSRF 借伺服器","輸入檢查可同時降低 XSS、注入與 CSRF 風險"],"q":{"q":"「誘使已驗證的使用者在不知情下向目標網站送出惡意請求」是哪一種攻擊？","o":["CSRF","XSS","Session 劫持","暴力破解"],"a":0,"e":"這是 CSRF 的定義。"}},{"t":"OWASP Top 10（2021）翻牌記憶","b":"OWASP 整理的十大 Web 應用程式安全風險，點卡片看說明和預防方法。","a":"這十張卡就像網站體檢的十個必檢項目。","w":{"type":"cards","items":[["A01 權限控制失效","能存取不該存取的功能或資料<br>預防：預設拒絕"],["A02 加密機制失效","缺少或錯誤的加密、寫死密碼<br>預防：用可信的加密方案"],["A03 注入攻擊","SQL、OS、LDAP Injection<br>預防：參數化查詢"],["A04 不安全設計","設計上的漏洞被利用<br>預防：安全設計模式"],["A05 安全設定缺陷","沒改預設值、測試後忘了關<br>預防：關閉不必要功能"],["A06 危險或過舊元件","用了有已知漏洞的元件<br>預防：定期掃描、更新"],["A07 認證機制失效","弱密碼、憑證填充<br>預防：多因子驗證"],["A08 軟體與資料完整性失效","未驗證更新檔來源<br>預防：PKI 簽章驗證"],["A09 記錄與監控失效","沒記錄、沒告警<br>預防：失敗登入要記錄並告警"],["A10 SSRF","伺服器被騙去存取內部資源<br>預防：白名單、預設擋外部"]]},"k":["A01 是權限控制失效，A03 是注入","自動安裝更新但不驗證檔案 → A08"],"q":{"q":"應用程式自動安裝更新檔，卻沒有驗證檔案是否為原始版本，屬於哪一項風險？","o":["權限控制失效","軟體及資料完整性失效","安全設定缺陷","SSRF"],"a":1,"e":"缺乏完整性驗證，就是 A08。"}},{"t":"進階手法：DLL 側載、請求走私","b":"<b>DLL 側載<\/b>：利用程式載入 DLL 的<b>搜尋順序<\/b>，把惡意 DLL 放在優先路徑，冒充合法版本被載入執行。<br><b>HTTP 請求走私<\/b>：前端代理與後端伺服器對 HTTP 請求<b>邊界的解析不一致<\/b>（Content-Length 與 Transfer-Encoding），讓攻擊者偷塞請求。<br><b>Session 劫持<\/b>：竊取工作階段令牌，直接以使用者身分登入。<br><b>權限提升<\/b>：從一般權限取得管理員權限。","a":"DLL 側載像在別人要拿的那份文件前面，放一份同名的假文件，讓他先拿到假的。","w":{"type":"cards","items":[["DLL 側載","利用 DLL 搜尋順序<br>放惡意版本在優先路徑"],["HTTP 請求走私","前後端對請求邊界<br>解析不一致"],["Session 劫持","偷走 Session Token<br>冒充使用者"],["權限提升","一般使用者<br>變成管理員"],["持久化","重開機後<br>惡意程式仍會執行"],["邏輯炸彈","特定條件才觸發"]]},"k":["DLL 側載關鍵字：搜尋順序、優先路徑","請求走私關鍵字：前後端解析不一致"],"q":{"q":"關於 HTTP 請求走私的成因，下列何者最適切？","o":["重複發送相同請求造成競爭","伺服器未驗證身分","在回應中注入腳本讓快取保存","前端代理與後端伺服器對請求邊界解析不一致"],"a":3,"e":"邊界混淆是請求走私的核心。"}}],"t5":[{"t":"安全開發生命週期（SDL）","b":"安全要從開發一開始就放進去。國際標準 <b>ISO/IEC 27034<\/b> 規範開發軟體的安全流程；微軟的 <b>SDL<\/b> 分成下列階段，按順序點點看。<br>• 設計階段要<b>減小攻擊面<\/b>：限制服務存取、最小權限、分層防禦。<br>• 驗證階段的<b>模糊測試<\/b>：故意輸入錯誤或混亂的資料，看程式會不會出錯。<br>• 發行時一定要附<b>事件回應計畫<\/b>。","a":"蓋房子時就把防火建材、逃生梯設計進去，比蓋完才加裝便宜又有效。","w":{"type":"steps","order":true,"items":[["訓練","安全設計、威脅模型、安全測試、隱私。"],["要求","訂出安全與隱私的最低要求，做風險評估。"],["設計","威脅建模、減小攻擊面。"],["實施","用核准的工具，禁用不安全的函數與 API。"],["驗證","動態分析、模糊測試、重新檢視攻擊面。"],["發行","最終安全審查，準備事件回應計畫。"],["回應","上線後處理新發現的漏洞。"]]},"k":["ISO/IEC 27034 = 應用程式安全","模糊測試 = 故意餵錯誤資料"],"q":{"q":"專門針對開發軟體安全性所需流程與框架的國際標準是？","o":["ISO/IEC 27001","ISO/IEC 27034","ISO/IEC 27017","ISO 9001"],"a":1,"e":"27034 是應用程式安全標準。"}},{"t":"越晚修，越貴","b":"同一個安全問題，越晚發現修補成本越高，到<b>上線維運（產品）階段<\/b>最高。下圖是常見的相對成本示意（不同研究數字不同，記住趨勢就好）。","a":"設計圖上改一條線幾分鐘；房子蓋好再改牆就要敲掉重做。","w":{"type":"bars","unit":"倍","items":[["需求",1,""],["設計",5,""],["實作",10,""],["測試",20,""],["上線維運",100,"最貴"]]},"k":["考題問「成本最高」→ 產品／維運階段","所以安全要「左移」，越早處理越好"],"q":{"q":"在 SDLC 中，修正同一個安全問題，哪個階段成本最高？","o":["設計","需求","產品（上線）","測試"],"a":2,"e":"上線後才修要回頭改設計、程式、重測、重新部署。"}},{"t":"白箱、黑箱與檢測工具","b":"<b>白箱測試<\/b>：看得到原始碼，測內部邏輯，例如<b>原碼掃描 SAST<\/b>。<br><b>黑箱測試<\/b>：看不到原始碼，從外部輸入輸出測試，例如<b>滲透測試、DAST<\/b>；比較像真實攻擊者。<br><b>灰箱<\/b>：知道部分內部資訊。<br>常見工具分一分（注意有一個不是檢測工具）：","a":"白箱像拆開手錶看齒輪；黑箱像只看手錶準不準。","w":{"type":"sort","tip":"這個工具屬於哪一類？","buckets":["靜態原碼檢測 SAST","動態／滲透測試","不是檢測工具"],"items":[["Fortify",0,""],["Checkmarx",0,""],["PMD",0,""],["SonarQube",0,""],["Burp Suite",1,"網頁應用程式測試的代理工具。"],["OWASP ZAP",1,""],["Chef",2,"Chef 是組態管理自動化工具。"]]},"k":["機器掃描原始碼屬於白箱","滲透測試屬於黑箱"],"q":{"q":"關於白箱與黑箱測試，下列何者較「不」正確？","o":["白箱測試主要測內部邏輯","黑箱測試主要運用機器掃描原始程式碼","滲透測試屬於黑箱","原碼掃描屬於白箱"],"a":1,"e":"掃描原始碼是白箱。"}},{"t":"安全部署、委外與 SBOM","b":"<b>安全部署<\/b>：移除除錯用程式碼、不留維護後門、不以最高權限執行、關閉不必要的底層服務。<br><b>委外開發<\/b>：資安要求要和自行開發一致，寫進合約並監督。<br><b>SBOM 軟體物料清單<\/b>：記錄元件名稱、版本、供應者、授權類型、相依關係，可對應已知漏洞；<b>不記錄執行時的動態行為日誌<\/b>。<br><b>格式字串弱點<\/b>：<code>printf(buffer)<\/code> 直接把使用者輸入當格式字串，應改為 <code>printf(\"%s\", buffer)<\/code>。<br><b>硬編碼憑證<\/b>：不要把密碼寫死在程式碼；CI/CD 改用工作負載身分或託管身分的短期憑證。","a":"SBOM 像食品包裝上的成分表，出現問題原料時可以馬上查出哪些產品受影響。","w":{"type":"sort","tip":"這是不是好的做法？","buckets":["好做法","壞做法"],"items":[["上線前移除除錯程式碼",0,""],["保留維護用後門方便日後修改",1,""],["用最高權限執行應用程式",1,""],["把資料庫密碼加密後放進版本控制",1,"仍然是把憑證放在程式碼庫。"],["CI/CD 使用短期的工作負載身分",0,""],["把 printf(buffer) 改成 printf(\"%s\", buffer)",0,""]]},"k":["SBOM：名稱、版本、授權、漏洞對應；不是執行日誌","委外與自行開發的資安要求一致"],"q":{"q":"關於應用系統安全部署，下列何者較正確？","o":["建立維護用後門","以最高權限執行","移除除錯用的原始程式碼","開啟所有底層服務"],"a":2,"e":"移除除錯碼可以減少洩漏資訊與攻擊面。"}}],"t6":[{"t":"惡意程式家族","b":"惡意軟體透過網路、可攜式媒體散播，造成資料外洩、系統損害或故障。差別看下表：","a":"病毒像感冒要靠人傳人（附在檔案上）；蠕蟲像會自己飛的蚊子；木馬像包著禮物外表的特洛伊木馬。","w":{"type":"grid","cols":["","病毒","蠕蟲","木馬","間諜軟體","勒索軟體"],"rows":[["需要宿主","要，附在程式或文件","不用","偽裝成正常程式","通常夾帶在軟體中","可透過病毒、蠕蟲或木馬"],["自我複製","會（需觸發）","會，可自動散播","不會","不會","視載體而定"],["主要危害","感染、破壞檔案","耗頻寬、阻斷服務","開後門、遠端控制、偷密碼","偷偷蒐集個資與上網行為","加密檔案或鎖機勒贖"]]},"k":["蠕蟲不需要附在別的程式、可自我複製","木馬不會自動執行，要騙使用者開啟"],"q":{"q":"下列何者是蠕蟲與病毒最主要的差別？","o":["蠕蟲不需要附在其他程式上就能自我複製","蠕蟲只會加密檔案","病毒不會破壞檔案","蠕蟲只存在手機上"],"a":0,"e":"病毒需要宿主，蠕蟲可以獨立散播。"}},{"t":"怎麼偵測惡意程式？","b":"• <b>特徵碼掃描<\/b>：比對已知惡意程式的特徵，適合<b>已知<\/b>威脅。<br>• <b>檔案完整性檢查<\/b>：先算出正常檔案的校驗和（Checksum），之後比對是否改變。<br>• <b>啟發式／行為分析<\/b>：找可疑邏輯或行為，偵測新威脅。<br>• <b>沙箱<\/b>：在隔離環境實際執行可疑程式觀察；惡意程式會用<b>延遲執行、要求滑鼠鍵盤互動<\/b>等手法規避沙箱。<br>• <b>白名單<\/b>只允許核准的程式；<b>黑名單<\/b>只擋已知壞的，對零日攻擊效果差。","a":"特徵碼像通緝犯照片，只能抓已知的人；沙箱像把可疑包裹放進防爆室打開。","w":{"type":"sort","tip":"這段描述對應哪一種方式？","buckets":["特徵碼","完整性檢查","沙箱","白名單"],"items":[["比對病毒碼資料庫",0,""],["定期比對檔案的 Checksum",1,""],["在隔離的虛擬機實際執行可疑程式",2,""],["只允許核准過的程式執行",3,""],["惡意程式延遲數十分鐘才執行，想躲過的對象",2,"延遲與要求互動，是規避自動化沙箱的手法。"]]},"k":["零日攻擊用黑名單最不妥當","新惡意程式 → 啟發式、沙箱、EDR"],"q":{"q":"零日漏洞攻擊的應對措施中，最「不」妥當的是？","o":["用 EDR 監控可疑行為","用 IRP 快速封鎖受影響系統","定期取得漏洞情報並更新","使用應用程式黑名單"],"a":3,"e":"零日攻擊沒有已知特徵，黑名單擋不到。"}},{"t":"弱點管理流程","b":"有效管理技術弱點的基本原則是：<b>先有完整且現行的資產清冊<\/b>。之後依下列流程循環。按順序點點看：","a":"弱點管理像定期健康檢查：先知道身體有哪些器官（清冊），再檢查（掃描）、看嚴重程度（評分）、治療（修補）、複診（驗證）。","w":{"type":"steps","order":true,"items":[["建立資產清冊","不知道有什麼，就不知道要掃什麼。"],["弱點掃描","自動化工具找出已知弱點（CVE）。"],["評分與排序","用 CVSS 評分，可依組織特性重新調整。"],["決定處理方式","修補、調整組態或補償措施。"],["測試後修補","先測試修補程式再部署。"],["驗證","重新掃描確認已修好。"]]},"k":["VANS：資通安全弱點通報機制，比對資產與公開弱點","還沒有修補程式時：關閉相關服務、加控制措施、加強監控、提升員工認知"],"q":{"q":"企業定期比對資產是否存在已公開的弱點，這個通報機制的簡稱是？","o":["SOC","VPN","VANS","GCB"],"a":2,"e":"VANS = Vulnerability Analysis and Notice System。"}},{"t":"弱掃、滲透測試與實體隔離","b":"比較三種評估方式：","a":"弱掃像拿清單逐一檢查門窗有沒有鎖；滲透測試像請專業小偷實際試著闖進來。","w":{"type":"grid","cols":["","弱點掃描","安全性測試評估","滲透測試"],"rows":[["做法","自動化工具探測已知弱點","測試控制措施是否有效","模擬駭客實際攻擊"],["會不會實際利用弱點","不會","視情況","會，嘗試取得控制權"],["目的","找出已知 CVE","確認防護有效","發現弱點並提出改善"],["注意","要安排時間，避免觸發 IDS 警報","涵蓋網路、主機、存取控制、應用程式","要事先取得授權"]]},"k":["弱掃 ≠ 清除病毒 ≠ 阻擋連線","實體隔離（Air-Gap）最常見的入侵管道：USB 隨身碟"],"q":{"q":"執行弱點掃描最主要的目的是？","o":["自動化探測並識別已知弱點","清除病毒","模擬駭客主動利用弱點","即時阻擋惡意連線"],"a":0,"e":"主動利用弱點的是滲透測試。"}}],"t7":[{"t":"備份還原模擬器","b":"<b>完整備份<\/b>：每次全部備份；還原最簡單，但最花時間與空間。<br><b>增量備份<\/b>：只備份<b>上一次任何備份<\/b>之後的變動；備份快，還原時要「完整 + 每一份增量」。<br><b>差異備份<\/b>：只備份<b>上一次完整備份<\/b>之後的變動；還原時只要「完整 + 最後一份差異」。<br>選擇策略和當機的日子，看看還原要用到哪幾份備份。","a":"增量像每天只記今天新寫的日記，要重建全部就要從頭一頁頁讀；差異像每天記「從月初到今天的所有新內容」，越後面越厚，但只要讀月初那本和最新那本。","w":{"type":"backup"},"k":["增量：還原要完整 + 全部增量","差異：還原只要完整 + 最後一份差異"],"q":{"q":"週日完整備份、週一到週六增量備份，週五晚上當機，還原需要哪些？","o":["只要週日完整","週日完整 + 週五增量","週日完整 + 週一到週五所有增量","只要週五增量"],"a":2,"e":"增量備份每天只存當天變動，要全部串起來。"}},{"t":"3-2-1 原則與儲存媒體","b":"<b>3-2-1 原則<\/b>：至少 <b>3 份<\/b>資料、存放在 <b>2 種<\/b>不同媒介、其中 <b>1 份<\/b>放在異地。<br><b>RAID 不是備份<\/b>：RAID 提升效能與容錯，但誤刪、勒索加密會同步發生在所有磁碟上。RAID 1（鏡像）的容錯率最高。<br>備份<b>不可<\/b>放在同一台伺服器；放在雲端也要保留本地副本。<br>媒體汰除：含機密資訊的媒體要用燒毀、粉碎或抹除等正式程序，確保無法復原。","a":"重要照片：電腦一份、外接硬碟一份（不同媒介）、雲端一份（異地）。","w":{"type":"sort","tip":"這個做法對不對？","buckets":["正確","錯誤"],"items":[["RAID 不能當作唯一的備份方案",0,""],["備份檔存在同一台伺服器的另一個資料夾",1,"伺服器壞了就一起沒了。"],["雲端有備份，本地也保留一份",0,""],["3-2-1 = 3 種媒介、2 份異地、1 份備份",1,"正確是 3 份資料、2 種媒介、1 份異地。"],["報廢硬碟前先做資料抹除或實體破壞",0,""],["定期測試還原流程",0,"沒測過的備份不算數。"]]},"k":["3 份資料、2 種媒介、1 份異地","RAID ≠ 備份"],"q":{"q":"關於備份儲存策略，最「不」妥當的是？","o":["RAID 不可作為唯一備份","備份不可放在同一台主機","雲端備份仍保留本地檔案","3-2-1 為 3 種媒介、2 份異地、1 份備份"],"a":3,"e":"(D) 把 3-2-1 的意思說錯了。"}},{"t":"對抗勒索軟體的備份","b":"勒索軟體不只加密正式資料，還會<b>找出並刪除備份<\/b>。對策：<br>• <b>不可變備份（Immutable／WORM）<\/b>：在保存期內無法刪除或修改。<br>• <b>離線備份<\/b>：與網路斷開，攻擊者碰不到。<br>• <b>零信任存取控管<\/b>：備份管理權限最小化、多因子驗證，API 金鑰外洩也不能隨意刪除。<br>• <b>備份頻率不可大於 RPO<\/b>，並定期演練還原。<br>• 加密演算法要選對：MD5 已有碰撞，不能用來驗證完整性。","a":"把重要的東西鎖進銀行保險箱，而且保險箱設定「一年內誰都打不開刪除」。","w":{"type":"cards","items":[["不可變備份","保存期內<br>無法刪改"],["離線備份","斷網保存<br>攻擊者碰不到"],["零信任存取","刪除備份也要<br>多重驗證與授權"],["還原演練","定期測試<br>確保真的能用"],["備份頻率","間隔 ≤ RPO"],["熱備援","即時切換<br>資料幾乎零遺失"]]},"k":["多雲備份仍可能被同一把外洩的 API 金鑰刪光","不可變備份 + 零信任"],"q":{"q":"駭客用竊得的 API 金鑰跨雲刪除多個備份版本，最能補強的做法是？","o":["只依賴多雲","改用差異備份","把備份統一壓縮","不可變備份 + 零信任存取控管"],"a":3,"e":"讓備份即使有權限也刪不掉，並收緊存取。"}}],"t8":[{"t":"日誌要記什麼？不能記什麼？","b":"學習指引建議日誌包含：使用者 ID、系統活動、登入登出等關鍵事件的日期時間與細節、成功與被拒絕的存取紀錄、系統組態變更、特權使用、存取的檔案、網路位址與協定、使用者在應用系統中的操作。<br>但<b>機敏資料不能直接寫進明文日誌<\/b>，例如明文密碼。","a":"日誌像大樓的訪客登記簿：要記誰、何時、去哪一樓，但不會記下他的保險箱密碼。","w":{"type":"sort","tip":"這項資訊該不該記錄在日誌中？","buckets":["應該記錄","不應明文記錄"],"items":[["使用者 ID",0,""],["登入與登出時間",0,""],["被拒絕的存取嘗試",0,""],["系統組態變更",0,""],["特權帳號的使用",0,""],["使用者的明文密碼",1,"日誌外洩就等於密碼外洩。"],["完整信用卡號",1,"應遮罩或不記錄。"],["來源 IP 位址",0,""]]},"k":["失敗的登入嘗試一定要記錄並告警","工單資料通常不屬於事件日誌內容"],"q":{"q":"哪一項資訊較「不」建議直接記錄在明文日誌中？","o":["來源 IP","錯誤代碼","登入時間","明文密碼"],"a":3,"e":"密碼絕不能寫進日誌。"}},{"t":"日誌的生命週期與保護","b":"依序點點看日誌從產生到銷毀的過程。保護重點：<br>• 防止日誌被<b>竄改、刪除<\/b>或未授權存取。<br>• 注意<b>容量<\/b>，滿了會導致無法記錄或覆蓋舊紀錄。<br>• <b>即時傳送到遠端獨立的 Log Server<\/b>，入侵者即使拿到本機權限也刪不掉完整軌跡。<br>• 用 NTP 同步時間，不同系統的日誌才能對得起來。<br>• 管理者和操作員的活動也要記錄，並由<b>不受他們控制<\/b>的系統監視。","a":"重要的帳本不只放在自己抽屜，還要每天寄一份副本到會計師事務所，這樣有人偷改也查得到。","w":{"type":"steps","order":true,"items":[["產生","系統、網路設備、應用程式記錄事件。"],["傳送","Syslog 等方式送出；UDP 514 可能遺失，可改 TCP／TLS。"],["集中儲存","送到遠端獨立的 Log Server 或 SIEM。"],["分析","從大量日誌中找出異常模式與威脅。"],["保存","依法規或政策保存，作為證據。"],["銷毀","超過保存期限後安全刪除。"]]},"k":["防刪除軌跡：即時送到遠端獨立日誌伺服器","日誌分析的核心：找出異常、威脅或營運問題"],"q":{"q":"為防止攻擊者入侵後刪除日誌軌跡，最佳做法是？","o":["只在本機嚴格控管權限","保留期限縮短為 1 天","即時傳送到遠端獨立的 Log Server","把本機日誌設為隱藏唯讀"],"a":2,"e":"本機的保護擋不住取得管理員權限的入侵者。"}},{"t":"SIEM、告警與稽核報告","b":"<b>SIEM<\/b> 把不同來源的日誌集中、做<b>關聯分析<\/b>並產生告警。<br><b>告警疲勞<\/b>：規則設計不當會產生大量誤報，SOC 人員疲於奔命而漏掉真正的攻擊，要調校門檻與降噪。<br>Windows 常見事件代碼：<b>4624<\/b> 登入成功、<b>4625<\/b> 登入失敗。<br>稽核需求要給對的報告：例如要證明符合 <b>PCI DSS<\/b> 的持卡人資料存取控制，就要提供針對持卡人資料伺服器與資料庫的成功與失敗存取紀錄。","a":"火災警報太敏感，每次煮飯都響，大家就會開始無視它，真的失火時反而沒人理。","w":{"type":"cards","items":[["SIEM","集中 + 關聯分析 + 告警"],["告警疲勞","規則設計失當<br>誤報太多"],["4624 / 4625","Windows 登入<br>成功 / 失敗"],["PCI DSS 稽核","持卡人資料的<br>成功與失敗存取紀錄"],["日誌保存","依法規保存<br>可作為司法證據"],["時間同步","NTP<br>讓日誌對得起來"]]},"k":["告警暴增 → 告警規則設計失當","日誌分析 ≠ 日誌保存或集中"],"q":{"q":"導入 SIEM 後告警暴增、SOC 人員疲勞而錯失真正攻擊，最可能源自？","o":["存取權限過嚴","來源涵蓋不足","告警規則設計失當","保存時間過長"],"a":2,"e":"需要調校規則、降低誤報。"}}],"t9":[{"t":"雲端運算的五大特性","b":"NIST 對雲端運算的定義有五個特性：<br>1. <b>隨需自助服務<\/b>：需要時自己開資源，不用人工介入。<br>2. <b>廣泛的網路存取<\/b>：透過標準網路機制存取。<br>3. <b>資源池化<\/b>：資源共用，依需求分給多個使用者。<br>4. <b>快速彈性<\/b>：可以快速擴充或縮減。<br>5. <b>可量測的服務<\/b>：用量可監控、報告，依量計費。","a":"雲端像自來水：打開水龍頭就有（隨需），家家戶戶都接得到（網路），大家共用水庫（池化），用多用少都行（彈性），水表計費（量測）。","w":{"type":"sort","tip":"這是不是 NIST 定義的雲端特性？","buckets":["是","不是"],"items":[["使用者可隨時自行配置資源",0,""],["資源由多個使用者共享",0,""],["可快速擴充或縮減",0,""],["用量可被量測與報告",0,""],["資源調配都要由供應商人員協助",1,"剛好相反，雲端強調自助、不需人工介入。"],["只能在公司內網使用",1,""]]},"k":["五特性：自助、網路、池化、彈性、量測","「需要供應商人員協助調配」不是雲端特性"],"q":{"q":"下列何者「不」是 NIST 定義的雲端關鍵特性？","o":["隨需自助服務","資源調配皆由供應商人員協助","快速彈性","可量測的服務"],"a":1,"e":"雲端強調使用者自助。"}},{"t":"IaaS、PaaS、SaaS 與共同責任","b":"<b>IaaS 基礎架構即服務<\/b>：租伺服器、網路、儲存等硬體資源，作業系統以上自己管。<br><b>PaaS 平台即服務<\/b>：提供開發與執行環境，你只要管<b>自己的應用程式和資料<\/b>。<br><b>SaaS 軟體即服務<\/b>：直接用供應商的軟體，你主要管<b>帳號存取和資料<\/b>。<br>下表是共同責任模型（U = 使用者負責，P = 供應商負責）。不管哪種模式，<b>資料和帳號存取永遠是使用者的責任<\/b>。","a":"「披薩即服務」：自己在家做（地端）、買冷凍披薩自己烤（IaaS）、叫外送（PaaS）、直接去餐廳吃（SaaS）。越往右，你要做的越少。","w":{"type":"grid","cols":["","地端","IaaS","PaaS","SaaS"],"rows":[["資料","U","U","U","U"],["帳號與存取管理","U","U","U","U"],["應用程式","U","U","U","P"],["執行環境、中介軟體","U","U","P","P"],["作業系統","U","U","P","P"],["虛擬化","U","P","P","P"],["伺服器、儲存、網路","U","P","P","P"],["機房實體","U","P","P","P"]],"extra":{"cols":["服務","模式"],"rows":[["Gmail、Microsoft 365","SaaS"],["Google App Engine、Heroku","PaaS"],["AWS EC2、Azure 虛擬機","IaaS"]]}},"k":["PaaS：顧好應用程式與資料；SaaS：顧好帳號存取與資料","IaaS 使用者負責最多（作業系統修補也是自己的事）"],"q":{"q":"關於 PaaS 與 SaaS 的權責差異，下列何者較適切？","o":["兩者完全相同","PaaS 使用者負責實體硬體","PaaS 使用者負責應用程式與資料，SaaS 使用者主要負責存取管理與資料","SaaS 使用者負責作業系統修補"],"a":2,"e":"對照上表就能看出來。"}},{"t":"四種部署模式","b":"雲端環境由誰使用、放在哪裡，分成四種：","a":"公有雲像租公寓（大家共用一棟樓）；私有雲像自己的透天厝；社群雲像同業合租的共用辦公室；混合雲像住家加上租的倉庫。","w":{"type":"grid","cols":["","公有雲","私有雲","社群雲","混合雲"],"rows":[["使用者","一般大眾","單一組織","特定社群的組織","組合兩種以上"],["位置","雲服務提供者處所","自有或外部租借環境","視社群協議","跨環境整合"],["特點","規模大、成本低","控制權最高，安全性通常最佳","共享合規需求","保持資料與應用的可移植性"]]},"k":["安全性通常私有雲最佳","混合雲：兩種以上的雲靠標準或專有技術整合"],"q":{"q":"下列何種雲端型態的安全性一般認為最佳？","o":["公有雲","社區雲","混合雲","私有雲"],"a":3,"e":"私有雲由單一組織建立管理，控制權最高。"}},{"t":"雲端威脅與安全服務","b":"CSA（雲端安全聯盟）調查的主要威脅：資料洩露、弱身分認證與存取管理、不安全的 API、系統漏洞、帳戶劫持、惡意內部人士、APT、資料遺失、盡職調查不足、濫用雲端服務、阻斷服務、共享技術問題。<br>使用雲端前要在<b>合約<\/b>寫清楚：稽核權、需要的日誌與報告、資料外洩時雙方的責任。<br>常見的雲端安全服務如下，點卡片看說明。","a":"CASB 像站在你和各種雲端服務之間的海關，檢查誰帶了什麼出去。","w":{"type":"cards","items":[["CASB","雲端存取安全代理<br>SaaS 可視性、存取控管、DLP"],["SWG","安全網頁閘道<br>過濾上網流量"],["ZTNA","零信任網路存取<br>取代傳統 VPN"],["FWaaS","防火牆即服務"],["SASE","把網路與以上安全功能<br>整合成雲端服務"],["虛擬化","把 CPU、記憶體、儲存<br>以邏輯方式切割分配"]]},"k":["不用 VPN 直接安全存取 SaaS 並做 DLP → CASB","合約要明訂稽核權與外洩處理"],"q":{"q":"哪個 SASE 組件能讓員工不用 VPN 直接安全存取雲端應用，同時做 DLP 檢查？","o":["FWaaS","CASB","SWG","SD-WAN"],"a":1,"e":"CASB 專門處理對雲端應用的存取與資料保護。"}}],"t10":[{"t":"行動裝置面對的威脅","b":"行動運算包含行動通訊、行動硬體、行動軟體三部分。行動裝置好用，但也帶來風險：裝置遺失或被竊、惡意 App、釣魚、不安全的公共 Wi-Fi、越獄或 Root、透過 USB 充電被入侵、藍牙與 NFC 的漏洞。","a":"手機就像隨身帶著的小型辦公室，掉了就等於辦公室鑰匙和檔案櫃一起掉了。","w":{"type":"sort","tip":"這是不是行動裝置的安全威脅？","buckets":["是安全威脅","不是"],"items":[["裝置遺失或被竊",0,""],["安裝來路不明的 App",0,""],["連上公共場所的未知 Wi-Fi",0,""],["越獄或 Root",0,"會繞過系統的安全機制。"],["插在來路不明的 USB 充電站",0,""],["行動裝置因欠費停話",1,"這是帳務問題，不是資安威脅。"]]},"k":["無痕瀏覽不能防止釣魚","關閉 Wi-Fi 自動連線，避免連上不受信任的網路"],"q":{"q":"下列何者「不」屬於行動裝置可能遭受的安全威脅？","o":["裝置遺失","惡意 App","不安全的 Wi-Fi","裝置因欠費停話"],"a":3,"e":"欠費不是資安威脅。"}},{"t":"MDM、MAM、UEM 與 BYOD","b":"企業管理行動裝置的三種工具：","a":"MDM 像公司配給你的整支手機，公司全權管理；MAM 像只在你的私人手機裡放一個公司專用的上鎖抽屜。","w":{"type":"grid","cols":["","MDM","MAM","UEM"],"rows":[["管理對象","整台裝置","只管企業 App 與資料","整合各種端點（手機、電腦）"],["能做什麼","強制密碼、加密、遠端抹除整機","App 容器化、限制複製貼上、只抹除公司資料","統一政策管理"],["隱私影響","較大","較小，適合 BYOD","視設定"],["適用","公司配發的裝置","員工自帶裝置","大型企業"]]},"k":["BYOD + 不想被管整台手機 → MAM","BYOD 政策：企業與私人資訊隔離，使用者簽署協議"],"q":{"q":"員工抗拒安裝接管整台手機的 MDM，想只保護企業 App 與資料，較符合隱私趨勢的是？","o":["DLP","UEM","MAM","RBI"],"a":2,"e":"MAM 只管 App 層。"}},{"t":"行動裝置的控制措施","b":"學習指引列出的行動裝置政策要點，依序翻開：","a":"把手機當成公司的筆電一樣管理：要登記、要上鎖、要更新、掉了要能遠端清除。","w":{"type":"steps","order":false,"items":[["註冊","經過註冊才能存取企業資源。"],["實體保護","報廢、販賣或捐贈前完整清除並回復原廠設定；只用可信任的傳輸線充電。"],["軟體安裝限制","只從官方商店安裝，評估 App 要求的權限是否合理。"],["更新","定期更新作業系統與 App。"],["存取控制","設定密碼與自動鎖定；違規或離職就取消存取權。"],["連線功能","小心公共 Wi-Fi；關閉不常用的藍牙、NFC、GPS。"],["加密","裝置、記憶卡與傳輸中的資料都要加密。"],["惡意軟體防護","安裝防護軟體。"],["遠端鎖定與刪除","遺失時定位、鎖定、抹除資料。"],["備份","定期備份，損毀時可還原。"]]},"k":["App 要求的權限要評估是否合理","遺失 → 遠端鎖定與抹除"],"q":{"q":"強化行動裝置安全的方法中，何者較「不」安全？","o":["只從官方商店安裝 App","開啟 Wi-Fi 自動連線以方便上網","設定螢幕自動鎖定","啟用遠端抹除"],"a":1,"e":"自動連線可能連上惡意或不受信任的熱點。"}}],"t11":[{"t":"物聯網的架構與六大挑戰","b":"物聯網常分三層：<b>感知層<\/b>（感測器、裝置）、<b>網路層<\/b>（傳輸）、<b>應用層<\/b>（平台與服務）。<br>物聯網出事的影響不只是資料外洩，還可能危及<b>人身安全<\/b>、生產與社會運作。<br>學習指引列出的六大挑戰：點開每一項。","a":"智慧家庭：門鎖、攝影機是感知層，Wi-Fi 是網路層，手機 App 是應用層。門鎖被駭，影響的是你家的安全。","w":{"type":"layers","items":[{"h":"設備的安全性","s":"小、便宜、容易被偷或移動","d":"幾乎沒有實體防護，需要實施實體保護。"},{"h":"系統的安全性","s":"晶片大量嵌入","d":"使用者可能不知道自己的活動正在被記錄。"},{"h":"網路的安全性","s":"缺乏連線備援","d":"主要連線中斷，服務就停止。"},{"h":"管理的安全性","s":"難以遠端管理","d":"設備上線後，不容易做安全的遠端管理與更新。"},{"h":"存取控制的安全性","s":"感測器、驅動器被操控","d":"駭客未經授權存取，可能造成實際傷害。"},{"h":"隱私權","s":"位置資訊被分析","d":"可能被用來未經授權地追蹤人的行為。"}]},"k":["IoT 安全目標：穩健性（準確、可靠、彈性）、安全性（CIA + Safety）、個資保護","物聯網應在設計階段就做威脅分析與風險評估"],"q":{"q":"關於物聯網安全，下列何者「不」正確？","o":["政府與開發商應協力降低風險","建立利害關係人的風險意識","規劃提升 IoT 安全的獎勵措施","不用建立損害侵權、保險補償、安全認證等措施"],"a":3,"e":"這些措施都需要建立。"}},{"t":"物聯網攻擊手法","b":"讀描述，分到正確的攻擊名稱：","a":"中間人攻擊像郵差偷拆信再封回去；黑洞攻擊像郵局把所有經過的信都丟掉。","w":{"type":"sort","tip":"這段描述是哪一種攻擊？","buckets":["中間人","黑洞","重送","金鑰淪陷","密碼攻擊"],"items":[["分別與兩個裝置連線，擷取並轉送雙方資料",0,""],["控制一個節點後，丟棄所有經過的封包",1,""],["錄下合法的開鎖指令，之後再送一次",2,""],["竊取加密金鑰來解密通訊",3,""],["猜測密碼入侵設備",4,""]]},"k":["OWASP IoT Top 10 第一名：弱密碼、可猜測或寫死的密碼","垃圾搜尋（翻垃圾找資料）不是利用通訊協定的攻擊"],"q":{"q":"攻擊者控制物聯網中的一個節點，並丟棄所有傳到該節點的封包，這是？","o":["黑洞攻擊","重送攻擊","Sybil 攻擊","中間人攻擊"],"a":0,"e":"吞掉所有封包就像黑洞。"}},{"t":"縱深防禦與安全策略","b":"<b>縱深防禦<\/b>：用多層防禦，就算一層失守，下一層還能攔住。物聯網的分層：實體層、設備層、網路層、應用層。<br>美國國土安全部的 IoT 策略原則：設計階段就納入安全、促進更新與漏洞管理、運用公認的做法、依潛在影響排序、提升透明度、謹慎連接。<br>加密時要兼顧<b>效能<\/b>：部分嵌入式設備資源有限，可能要選較小的金鑰。<br><b>預防無用論<\/b>：沒有防禦能保證擋下所有針對性攻擊，所以要假設自己正被攻擊、降低衝擊、建立持續的防禦流程。","a":"城堡的護城河、城牆、守衛、內城，一層一層，不會只靠一道門。","w":{"type":"layers","items":[{"h":"實體層","s":"設備不被偷、不被拆","d":"外殼防拆、安裝位置、實體加固。"},{"h":"設備層","s":"設備本身要安全","d":"改掉預設密碼、安全開機、韌體簽章與安全更新。"},{"h":"網路層","s":"通訊要保護","d":"加密傳輸、網段隔離、只開必要的連線。"},{"h":"應用層","s":"平台與 App","d":"身分驗證、存取控制、API 安全、隱私保護。"}]},"k":["預防無用論：假設正被攻擊、降低衝擊、持續防禦","IoT 加密要兼顧效能"],"q":{"q":"「預防無用論」的主要見解，下列何者「不」正確？","o":["應假設自己正遭受攻擊","應降低攻擊帶來的衝擊","企業絕對可以成功阻止針對性攻擊","應建立整體性的持續防禦流程"],"a":2,"e":"沒有防禦能保證擋下所有針對性攻擊。"}},{"t":"新興科技：OT、邊緣運算、AI 與量子","b":"這幾個是 115 年試題出現的新題型，點卡片複習：","a":"OT 像醫院的維生系統，寧可資料不保密也不能停機。","w":{"type":"cards","items":[["OT / ICS","可用性（與人身安全）最優先<br>設備生命週期長<br>隔離也仍需端點防護"],["邊緣運算","節點分散、環境不受控<br>容易被物理接觸或破壞"],["對抗性攻擊","在輸入加入微小擾動<br>誤導 AI 判斷（例：交通標誌貼紙）"],["資料下毒","在訓練資料動手腳"],["後量子密碼 PQC","抵抗量子電腦破解 RSA、ECC<br>NIST 已發布 ML-KEM、ML-DSA"],["AI SOC","端點紀錄有處理程序樹，比流量精準<br>關鍵處置要保留人工審核"]]},"k":["OT：A > I > C","避免 AI 成為單點失效：關鍵環節加入人工審核"],"q":{"q":"在 OT 工控環境中，下列敘述何者正確？","o":["設備每 2–3 年汰換","系統必須確保極高的可用性","實體隔離就不需要端點防禦","機密性是最高指導原則"],"a":1,"e":"OT 以可用性與安全為最優先。"}}]};</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* =========================================================
   Data
   ========================================================= */
const { islands, questions } = window.DATA;
const QMAP = new Map(questions.map(q => [q.id, q]));
const HUB = { id:'hub', subj:0, name:'中央港口廣場', nick:'中央廣場', emoji:'⛲', q:0, r:0, chap:'群島總覽', sec:'', kp:[] };
const ALL = [HUB, ...islands];
const IMAP = new Map(ALL.map(i => [i.id, i]));
const QBY = {}; islands.forEach(i => QBY[i.id] = []); questions.forEach(q => QBY[q.i].push(q));
const SUBJ = { 1:'科目一 資訊安全管理概論', 2:'科目二 資訊安全技術概論' };
const SUBJ_SHORT = { 0:'群島總覽', 1:'科目一 管理', 2:'科目二 技術' };
const CHAP_COLOR = {
  '1|第四章 資訊安全管理系統':'#f5c376', '1|第五章 資產與風險管理':'#f3a28a', '1|第六章 存取控制、加解密與金鑰管理':'#eaa6c4', '1|第七章 事故管理與營運持續':'#c7b2e8',
  '2|第四章 網路與通訊安全':'#8fd3c1', '2|第五章 作業系統與應用程式安全':'#93c4ee', '2|第六章 資安維運技術':'#acd98b', '2|第七章 新興科技安全':'#9fb0f2'
};
const islandColor = i => i.id === 'hub' ? '#f1e2c6' : CHAP_COLOR[i.subj + '|' + i.chap];
const LETTERS = 'ABCD';
const srcLabel = q => q.s === 'G' ? '學習指引' : `115-1 試題 第${q.n}題`;
const srcLong = q => {
  const isl = IMAP.get(q.i);
  return q.s === 'G'
    ? `出處：學習指引（${SUBJ[isl.subj]}）${isl.chap}・${isl.sec}，解析為指引原文。`
    : `出處：115 年第一次資訊安全工程師初級能力鑑定公告試題（${SUBJ[isl.subj]}）第 ${q.n} 題。官方僅公布答案，解析為本站補充。`;
};

/* =========================================================
   Session store (memory + sessionStorage, no database)
   ========================================================= */
const KEY = 'aegis-isles-v1';
const store = { attempts: [], marks: new Set(), sound: true, music: true, fish: {}, introSeen: false };
try {
  const raw = sessionStorage.getItem(KEY);
  if (raw) { const s = JSON.parse(raw); store.attempts = s.attempts || []; store.marks = new Set(s.marks || []); store.sound = s.sound !== false; store.music = s.music !== false; store.layout = s.layout || 'side'; store.fish = s.fish || {}; store.tut = s.tut || {}; store.introSeen = !!s.introSeen; }
} catch (e) {}
function save() {
  try { sessionStorage.setItem(KEY, JSON.stringify({ attempts: store.attempts, marks: [...store.marks], sound: store.sound, music: store.music, fish: store.fish, tut: store.tut, layout: store.layout, introSeen: store.introSeen })); } catch (e) {}
}
function lastMap() { const m = new Map(); for (const a of store.attempts) m.set(a.q, a); return m; }
function islandStats(iid) {
  const lm = lastMap(); const pool = iid === 'hub' ? questions : QBY[iid];
  let answered = 0, correct = 0;
  for (const q of pool) { const a = lm.get(q.id); if (a) { answered++; if (a.ok) correct++; } }
  return { total: pool.length, answered, correct, acc: answered ? correct / answered : null };
}
