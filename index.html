function streak() { let s = 0; for (let k = store.attempts.length - 1; k >= 0 && store.attempts[k].ok; k--) s++; return s; }
function masteryColor(st) {
  if (!st.answered) return '#ffffff';
  if (st.acc >= .8) return '#3fb56f';
  if (st.acc >= .6) return '#f2b134';
  return '#e0574c';
}

function buildPath(nodeIds, r, endRad = 1.35) {
  const out = [];

    const A = IMAP.get(nodeIds[j]), B = IMAP.get(nodeIds[j + 1]);
    const dir = B.pos.clone().sub(A.pos).normalize();
    if (j > 0) out.push({ p: jitter(A.pos, .5, r), node: A.id });
    const ex = A.pos.clone().addScaledVector(dir, AP - .5); ex.y = TOP; out.push({ p: ex, node: A.id });
    const en = B.pos.clone().addScaledVector(dir, -(AP - .5)); en.y = TOP;
    for (let s = 1; s < 6; s++) { const t = s / 6; const p = ex.clone().lerp(en, t); p.y = TOP + Math.sin(Math.PI * t) * .35; out.push({ p, node: B.id, bridge: true }); }
    out.push({ p: en, node: B.id });
  }
  const last = IMAP.get(nodeIds[nodeIds.length - 1]);
  out.push({ p: jitter(last.pos, endRad, r), node: last.id, end: true });
  return out;
}

}

function updateNPC(n, dt, t) {
  const g = n.g; let moving = false;
  if (n.wi < n.wps.length) {
    const wp = n.wps[n.wi].p; const dx = wp.x - g.position.x, dz = wp.z - g.position.z; const dist = Math.hypot(dx, dz);
    const step = n.speed * dt;
    if (dist <= step) {
      g.position.x = wp.x; g.position.z = wp.z; n.node = n.wps[n.wi].node; n.wi++;
      if (n.wi >= n.wps.length) { n.wps = []; n.wi = 0; n.wait = n.isMain ? 1e9 : 1.5 + n.rnd() * 5; if (n.onArrive) { const f = n.onArrive; n.onArrive = null; f(); } }
    } else {
      g.position.x += dx / dist * step; g.position.z += dz / dist * step;
      const want = Math.atan2(dx, dz); let d = want - g.rotation.y; d = Math.atan2(Math.sin(d), Math.cos(d)); g.rotation.y += d * Math.min(1, dt * 10);
      moving = true;
    }
  } else if (!n.isMain) {
    n.wait -= dt;
    if (n.wait <= 0) {
      const r = n.rnd(); let tgt;
      if (r < .3) tgt = ADJ.get(n.node)[Math.floor(n.rnd() * ADJ.get(n.node).length)];
      else if (r < .4) tgt = 'hub';
      else if (r < .55) tgt = n.node;
      else tgt = islandIds[Math.floor(n.rnd() * islandIds.length)];
      sendTo(n, tgt);
    }
  }
  // animation
  if (moving) n.phase += dt * n.speed * 5.5;
  const sw = moving ? Math.sin(n.phase) * .7 : n.legL.rotation.x * .85;
  n.legL.rotation.x = sw; n.legR.rotation.x = -sw; n.armL.rotation.x = -sw * .8; n.armR.rotation.x = sw * .8;
  if (n.vy || n.jump > 0) { n.jump += n.vy * dt; n.vy -= 18 * dt; if (n.jump <= 0) { n.jump = 0; n.vy = 0; } }
  const bob = moving && !reduced ? Math.abs(Math.sin(n.phase)) * .06 : 0;
  g.userData.yOff = bob + n.jump;
  if (g.userData.ring) { g.userData.ring.material.opacity = .35 + Math.sin(t * 4) * .2; g.userData.ring.scale.setScalar(1 + Math.sin(t * 4) * .08); }
}

let offX = 0, offY = 0, wantOffX = 0, wantOffY = 0;
const LAYOUTS = { side: '靠右', center: '置中', full: '全畫面' };
function curLayout() { const l = store.layout || 'side'; return innerWidth <= 760 && l === 'center' ? 'full' : l; }
function nextLayout() { const order = innerWidth <= 760 ? ['side', 'full'] : ['side', 'center', 'full']; const i = order.indexOf(curLayout()); return order[(i + 1) % order.length]; }
const LAY_ICON = {
  side: '<svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><rect x="2" y="3" width="16" height="14" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="11" y="5" width="5" height="10" rx="1" fill="currentColor"/></svg>',
  center: '<svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><rect x="2" y="3" width="16" height="14" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="6" y="6" width="8" height="8" rx="1" fill="currentColor"/></svg>',
  full: '<svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M3 8V3h5M12 3h5v5M17 12v5h-5M8 17H3v-5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>'
};
function layoutBtn() { const nx = nextLayout(); const label = innerWidth <= 760 && nx === 'side' ? '縮小' : LAYOUTS[nx]; return `<button class="x lay" data-act="layout" title="切換版面：${label}" aria-label="面板改為${label}">${LAY_ICON[nx]}<span>${label}</span></button>`; }
function applyLayout() { const l = curLayout(); document.body.classList.toggle('pl-center', l === 'center'); document.body.classList.toggle('pl-full', l === 'full'); computeOffsets(); }
function cycleLayout() { store.layout = nextLayout(); save(); applyLayout(); renderPanel(); toast(`面板：${LAYOUTS[curLayout()]}`); }
addEventListener('resize', () => applyLayout());
function computeOffsets() {
  const p = $('#panel'); const mobile = innerWidth <= 760; const lay = curLayout();
  if (mobile) { wantOffX = 0; wantOffY = p.hidden || lay !== 'side' ? 0 : p.getBoundingClientRect().height * .9; return; }
  const L = $('#guide').getBoundingClientRect().right + 4;
  const R = p.hidden || lay !== 'side' ? 0 : (innerWidth - p.getBoundingClientRect().left) + 8;
  wantOffX = R - L; wantOffY = 0;
}
function applyView() {
  const w = innerWidth, h = innerHeight;
  camera.aspect = w / h;
  if (Math.abs(offX) > 1 || offY > 1) camera.setViewOffset(w + Math.abs(offX), h + offY, Math.max(0, offX), offY, w, h); else camera.clearViewOffset();
  camera.updateProjectionMatrix();
}
function onResize() { renderer.setSize(innerWidth, innerHeight, false); computeOffsets(); offX = wantOffX; offY = wantOffY; applyView(); }
addEventListener('resize', onResize);

let fly = null; let follow = false;
function flyTo(target, dist, dur = 1.3) {
  const dir = camera.position.clone().sub(controls.target).normalize();
  if (dir.y < .45) { dir.y = .62; dir.normalize(); }
  const toT = target.clone(); const toP = toT.clone().addScaledVector(dir, dist);
  if (reduced) { controls.target.copy(toT); camera.position.copy(toP); return; }
  fly = { t: 0, dur, fromT: controls.target.clone(), toT, fromP: camera.position.clone(), toP };
}
controls.addEventListener('start', () => { fly = null; follow = false; });
const HOME_T = new THREE.Vector3(0, 0, 2), HOME_DIR = new THREE.Vector3(0, 70, 80).normalize();
function homeDist() {
  const mobile = innerWidth <= 760; const t = Math.tan(THREE.MathUtils.degToRad(16));
  const freeW = mobile ? innerWidth : innerWidth - Math.abs(wantOffX) - ($('#panel').hidden ? 0 : 0);
  const freeH = innerHeight - (mobile ? wantOffY : 0);
  const d = Math.max(22 / t * (innerHeight / Math.max(300, freeH)), 31 / (t * (freeW / innerHeight)));
  return Math.min(d, mobile ? 175 : 150);
}
function goHome(dur = 1.2) { follow = false; computeOffsets(); const d = homeDist(); const toP = HOME_T.clone().addScaledVector(HOME_DIR, d); if (reduced || !dur) { controls.target.copy(HOME_T); camera.position.copy(toP); return; } fly = { t: 0, dur, fromT: controls.target.clone(), toT: HOME_T.clone(), fromP: camera.position.clone(), toP }; }

   Picking
   ========================================================= */
const ray = new THREE.Raycaster(); const ptr = new THREE.Vector2(); let hoverId = null, hoverNpc = null; let downAt = null; let lastMove = null;
const npcMeshes = []; npcs.forEach(n => n.g.traverse(o => { if (o.isMesh) npcMeshes.push(o); }));
function pick(cx, cy) {
  const rect = canvas.getBoundingClientRect();
  ptr.x = ((cx - rect.left) / rect.width) * 2 - 1; ptr.y = -((cy - rect.top) / rect.height) * 2 + 1;
  ray.setFromCamera(ptr, camera);
  const hn = ray.intersectObjects(npcMeshes, false)[0];
  const hi = ray.intersectObjects(pickables, false)[0];
  if (hn && (!hi || hn.distance < hi.distance + .5)) return { npc: hn.object.userData.npc };
  if (hi) return { island: hi.object.userData.id };
  return {};
}
canvas.addEventListener('pointerdown', e => { downAt = { x: e.clientX, y: e.clientY }; });
canvas.addEventListener('pointermove', e => { lastMove = { x: e.clientX, y: e.clientY }; });
canvas.addEventListener('pointerleave', () => { lastMove = null; hoverId = null; hoverNpc = null; });
canvas.addEventListener('pointerup', e => {
  if (!downAt || Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y) > 6) return; downAt = null;
  const r = pick(e.clientX, e.clientY);
  if (r.npc) talk(r.npc); else if (r.island) selectIsland(r.island);
});
function hoverTick() {
  if (!lastMove) { canvas.style.cursor = ''; return; }
  const r = pick(lastMove.x, lastMove.y);

  canvas.style.cursor = (r.npc || r.island) ? 'pointer' : 'grab';
}

const HUB_TIPS = ['旗子顏色就是熟練度：白色是還沒作答，紅色低於 60%，黃色低於 80%，綠色 80% 以上。','中央廣場可以開模擬考，題目從兩科題庫隨機抽。','點島嶼名牌也能出發，小盾會自己走過去。','答題時可以按 A–D 或 1–4 作答，Enter 跳下一題。','作答紀錄只保存在這次瀏覽，關掉分頁就會重來。'];

function subjStats(s) { const lm = lastMap(); let a = 0, c = 0; for (const q of questions) { if (IMAP.get(q.i).subj !== s) continue; const x = lm.get(q.id); if (x) { a++; if (x.ok) c++; } } return { answered: a, correct: c, acc: a ? c / a : null }; }

function buildList(iid) {

const SHA_K = (() => { const p = []; for (let n = 2; p.length < 64; n++) if (p.every(x => n % x)) p.push(n); return p.map(x => (Math.cbrt(x) % 1) * 4294967296 >>> 0); })();

  let H = SHA_H.slice(); const W = new Uint32Array(64);
  for (let o = 0; o < n; o += 64) {
    for (let t = 0; t < 16; t++) W[t] = dv.getUint32(o + t * 4);
    for (let t = 16; t < 64; t++) { const s0 = rr(W[t - 15], 7) ^ rr(W[t - 15], 18) ^ (W[t - 15] >>> 3), s1 = rr(W[t - 2], 17) ^ rr(W[t - 2], 19) ^ (W[t - 2] >>> 10); W[t] = (W[t - 16] + s0 + W[t - 7] + s1) | 0; }

    for (let t = 0; t < 64; t++) {
      const S1 = rr(e, 6) ^ rr(e, 11) ^ rr(e, 25), ch = (e & f) ^ (~e & g), t1 = (h + S1 + ch + SHA_K[t] + W[t]) | 0;

    }
    H = [H[0] + a, H[1] + bb, H[2] + c, H[3] + d, H[4] + e, H[5] + f, H[6] + g, H[7] + h].map(x => x | 0);
  }
  return H.map(x => (x >>> 0).toString(16).padStart(8, '0')).join('');

/* =========================================================
   Loop
   ========================================================= */

const clock = new THREE.Clock(); let hoverT = 0;
function loop() {
  const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime;
  waterU.uTime.value = t;
  for (const n of npcs) updateNPC(n, dt, t);
  fishTick(dt, t);
  for (const n of npcs) {
    const cur = n.wps[n.wi]; const prevWp = n.wps[n.wi - 1];
    let y = TOP; if (cur && cur.bridge) { const a = prevWp ? prevWp.p : cur.p; const d0 = Math.hypot(cur.p.x - a.x, cur.p.z - a.z) || 1; const d1 = Math.hypot(cur.p.x - n.g.position.x, cur.p.z - n.g.position.z); y = cur.p.y + (a.y - cur.p.y) * Math.min(1, d1 / d0); }
    else if (cur && prevWp && prevWp.bridge) { const d0 = Math.hypot(cur.p.x - prevWp.p.x, cur.p.z - prevWp.p.z) || 1; const d1 = Math.hypot(cur.p.x - n.g.position.x, cur.p.z - n.g.position.z); y = cur.p.y + (prevWp.p.y - cur.p.y) * Math.min(1, d1 / d0); }
    n.g.position.y = y + (n.g.userData.yOff || 0);
  }
  for (const c of clouds) { c.position.x += c.userData.v * dt; if (c.position.x > 120) c.position.x = -120; }
  for (const b of boats) { const u = b.userData; u.a += u.v * dt; b.position.set(Math.cos(u.a) * u.r, -.25 + Math.sin(t * 1.6 + u.r) * .08, Math.sin(u.a) * u.r * .8); b.rotation.y = -u.a; b.rotation.z = Math.sin(t * 1.3 + u.r) * .05; }
  for (const [id, o] of islandObj) {
    const lm = o.lm.userData;
    if (lm.spin) lm.spin.rotation.y += dt * 1.2;
    if (lm.spin2) lm.spin2.rotation.y = Math.sin(t * .8) * .6;
    if (lm.hand) lm.hand.rotation.z = -t * .8;
    if (lm.float) lm.float.position.y = 3 + Math.sin(t * 1.2) * .15;
    if (lm.bubble) lm.bubble.position.y = .85 + (t * .6 % 1) * .4;
    if (lm.jet) lm.jet.scale.setScalar(1 + Math.sin(t * 6) * .15);
    if (lm.waves) lm.waves.forEach(w => { const s = 1 + ((t * .7 + w.userData.wave * .33) % 1) * .8; w.scale.set(s, s, s); });
    const want = (hoverId === id ? .22 : 0) + (current && current.id === id ? .14 : 0);
    o.topM.emissive.copy(o.baseColor); o.topM.emissiveIntensity += (want - o.topM.emissiveIntensity) * Math.min(1, dt * 8);
    o.flag.rotation.y = Math.sin(t * 3 + o.grp.position.x) * .25;
  }
  // camera
  if (fly) {
    fly.t += dt / fly.dur; const k = fly.t >= 1 ? 1 : 1 - Math.pow(1 - fly.t, 3);
    controls.target.lerpVectors(fly.fromT, fly.toT, k); camera.position.lerpVectors(fly.fromP, fly.toP, k);
    if (fly.t >= 1) fly = null;
  } else if (follow) {
    const goal = hero.g.position.clone(); goal.y = TOP;
    const d = goal.sub(controls.target).multiplyScalar(1 - Math.exp(-dt * 3.5));
    controls.target.add(d); camera.position.add(d);
    if (!hero.wps.length && d.length() < .002) follow = false;
  }
  // view offset easing
  offX += (wantOffX - offX) * Math.min(1, dt * 7); offY += (wantOffY - offY) * Math.min(1, dt * 7); applyView();
  controls.update();
  if ((hoverT += dt) > .06) { hoverT = 0; hoverTick(); }
  renderer.render(scene, camera);
  updateLabels();
  requestAnimationFrame(loop);
}

/* boot */
setupPierLabel(); applyLayout(); onResize(); applyTheme(); refreshStats(); setSoundBtn(); updateFlags(); goHome(0);
requestAnimationFrame(loop);
const fromHash = () => { const h = location.hash.slice(1); if (h === 'fishing') { if (!fishingMode) goFishing(); } else if (IMAP.has(h)) selectIsland(h); };
addEventListener('hashchange', fromHash);
if (location.hash && (IMAP.has(location.hash.slice(1)) || location.hash === '#fishing')) setTimeout(fromHash, 300);
else if (!store.introSeen) showIntro();
setTimeout(() => { say(npcs[0], `<b>${npcs[0].name}</b>：歡迎！點我們聊天也能學考點喔。`, '', 4000); }, 1800);
addEventListener('pointerdown', function first() { removeEventListener('pointerdown', first, true); if (store.music && store.introSeen && !music.on) musicStart(); }, true);
window.__aegis = { fish, goFishing, selectIsland, store, doPick, questions, openHistory, startExam };
