<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="iPAS 資訊安全工程師（初級）3D 互動答題城市">
<title>守盾群島</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@400;600;800&family=Noto+Sans+TC:wght@400;500;700&family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Layout: full-bleed 3D toy city; chunky plastic cards float at the edges (guide left, island panel right, dock bottom). */
:root{
  --sky-a:#fde6c4; --sky-b:#cfe8e6;
  --paper:#fffaf1; --paper-2:#f7eddd; --ink:#3a2d27; --ink-2:#78665a; --line:#ead9c2; --line-2:#d9c3a5;
  --accent:#2d6bd3; --accent-2:#1d4fa6; --accent-ink:#ffffff; --sun:#f2b134;
  --good:#24935a; --good-bg:#e2f3e7; --bad:#cf463c; --bad-bg:#fbe4df; --warn:#c98a10;
  --m:#e2794a; --t:#24938c;
  --shadow:rgba(90,55,20,.16); --scrim:rgba(58,45,39,.38);
  --water:#8ccfcb; --fog:#e9e3cf; --night:0;
  --f-display:"Chiron GoRound TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-num:"Fredoka","Chiron GoRound TC",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --sky-a:#18203a; --sky-b:#2b3657;
  --paper:#222a3b; --paper-2:#2a3347; --ink:#f4ece1; --ink-2:#b5ab9d; --line:#3a4459; --line-2:#4b5670;
  --accent:#78a6ff; --accent-2:#4f7fdc; --accent-ink:#0e1630; --sun:#f6c75b;
  --good:#5bd18e; --good-bg:#1d3a2b; --bad:#ff7d70; --bad-bg:#45252a; --warn:#f0bf4c;
  --m:#f39a6d; --t:#4cc4bb;
  --shadow:rgba(0,0,0,.45); --scrim:rgba(6,10,22,.55);
  --water:#2a5d72; --fog:#27304b; --night:1; color-scheme:dark }}
:root[data-theme="dark"]{
  --sky-a:#18203a; --sky-b:#2b3657;
  --paper:#222a3b; --paper-2:#2a3347; --ink:#f4ece1; --ink-2:#b5ab9d; --line:#3a4459; --line-2:#4b5670;
  --accent:#78a6ff; --accent-2:#4f7fdc; --accent-ink:#0e1630; --sun:#f6c75b;
  --good:#5bd18e; --good-bg:#1d3a2b; --bad:#ff7d70; --bad-bg:#45252a; --warn:#f0bf4c;
  --m:#f39a6d; --t:#4cc4bb;
  --shadow:rgba(0,0,0,.45); --scrim:rgba(6,10,22,.55);
  --water:#2a5d72; --fog:#27304b; --night:1; color-scheme:dark }

[hidden]{display:none!important}
html,body{height:100%;overflow:hidden}
body{background:linear-gradient(180deg,var(--sky-a) 0%,var(--sky-b) 70%);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}

/* ---------- world labels ---------- */
.il{position:absolute;left:0;top:0;display:flex;align-items:center;gap:6px;padding:3px 10px 3px 4px;border-radius:999px;background:var(--paper);border:2px solid var(--line);box-shadow:0 3px 0 var(--line-2);white-space:nowrap;pointer-events:auto;cursor:pointer;font-family:var(--f-display);will-change:transform;transition:background .15s}
.il:hover,.il.hot{background:var(--paper-2)}
.il.sel{border-color:var(--accent);box-shadow:0 3px 0 var(--accent-2)}
.il-emo{width:26px;height:26px;display:grid;place-items:center;border-radius:50%;background:var(--paper-2);font-size:15px}
.il-txt{display:flex;flex-direction:column;line-height:1.15}
.il-txt b{font-weight:800;font-size:13px}
.il-txt small{font-size:10.5px;color:var(--ink-2);font-family:var(--f-body)}
.il-ring{font-family:var(--f-num);font-size:10.5px;font-weight:600;color:var(--ink-2);padding-left:4px;border-left:1px solid var(--line)}
#labels.far .il-txt small,#labels.far .il-ring{display:none}
#labels.far .il{padding:2px 8px 2px 3px}
.nl{position:absolute;left:0;top:0;font-size:11px;font-weight:700;letter-spacing:.02em;color:var(--ink);white-space:nowrap;will-change:transform;pointer-events:none;
  text-shadow:0 0 2px var(--paper),0 0 2px var(--paper),1px 1px 0 var(--paper),-1px -1px 0 var(--paper),1px -1px 0 var(--paper),-1px 1px 0 var(--paper)}
.nl.main{color:var(--accent);font-size:13px;font-weight:800;text-align:center;line-height:1.1;text-shadow:0 0 3px var(--paper),0 0 3px var(--paper),0 0 6px var(--paper),1px 1px 0 var(--paper),-1px -1px 0 var(--paper),1px -1px 0 var(--paper),-1px 1px 0 var(--paper)}
.nl.main::after{content:"▼";display:block;font-size:9px;line-height:1}
#labels.far .nl:not(.main){display:none}
.bubble{position:absolute;left:0;top:0;max-width:240px;padding:8px 12px;border-radius:14px;background:var(--paper);border:2px solid var(--line);box-shadow:0 4px 0 var(--line-2),0 10px 24px var(--shadow);font-size:13px;line-height:1.5;will-change:transform;pointer-events:none;white-space:normal}
.bubble b{font-family:var(--f-display)}
.bubble.big{font-family:var(--f-display);font-weight:800;font-size:16px;padding:6px 14px}
.bubble.ok{border-color:var(--good);color:var(--good)} .bubble.no{border-color:var(--bad);color:var(--bad)}

/* ---------- UI shell ---------- */
#ui{position:fixed;inset:0;pointer-events:none;display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr) minmax(0,440px);grid-template-rows:auto minmax(0,1fr) auto;gap:12px;
  padding-block:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.card{background:var(--paper);border:2px solid var(--line);border-radius:20px;box-shadow:0 5px 0 var(--line-2),0 16px 34px var(--shadow)}
.top{grid-column:1/-1;grid-row:1;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none;min-width:0}
.brand{pointer-events:auto;display:flex;align-items:center;gap:12px;padding:10px 16px 10px 10px}
.brand .logo{width:44px;height:44px;flex:none}
.brand h1{margin:0;font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:.04em;line-height:1.1;text-wrap:balance}
.brand p{margin:2px 0 0;font-size:12px;color:var(--ink-2)}
.stats{pointer-events:auto;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;padding:8px}
.stat{display:flex;flex-direction:column;align-items:center;min-width:64px;padding:2px 10px}
.stat b{font-family:var(--f-num);font-weight:700;font-size:20px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--ink-2);letter-spacing:.06em}
.stat + .stat{border-left:2px dashed var(--line)}

/* guide */
#guide{grid-column:1;grid-row:2/4;align-self:start;max-height:100%;overflow:auto;pointer-events:auto;padding:12px;display:flex;flex-direction:column;gap:10px;overscroll-behavior:contain}
.g-search{display:flex;gap:6px}
.g-search input{flex:1;min-width:0;font:inherit;font-size:14px;padding:8px 12px;border-radius:12px;border:2px solid var(--line);background:var(--paper-2);color:var(--ink)}
.g-hub{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 10px;border-radius:14px;border:2px solid var(--line);background:var(--paper-2)}
.g-hub b{font-family:var(--f-display)}
.g-subj{display:flex;flex-direction:column;gap:6px}
.g-subj h2{margin:4px 2px 0;font-family:var(--f-display);font-size:14px;font-weight:800;display:flex;align-items:center;gap:8px;letter-spacing:.03em}
.g-subj h2 i{width:12px;height:12px;border-radius:4px;display:inline-block}
.g-ch{font-size:11.5px;color:var(--ink-2);margin:4px 2px 0;display:flex;align-items:center;gap:6px;letter-spacing:.03em}
.g-ch i{width:9px;height:9px;border-radius:50%;display:inline-block;border:1px solid var(--line-2)}
.g-isl{display:grid;grid-template-columns:26px minmax(0,1fr) auto;align-items:center;gap:8px;width:100%;text-align:left;padding:5px 8px;border-radius:12px;border:2px solid transparent;background:transparent}
.g-isl:hover{background:var(--paper-2)}
.g-isl.sel{border-color:var(--accent);background:var(--paper-2)}
.g-isl .e{font-size:16px;text-align:center}
.g-isl .n{min-width:0}
.g-isl .n b{display:block;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-isl .n small{display:block;font-size:11px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-isl .p{font-family:var(--f-num);font-size:11px;color:var(--ink-2);font-variant-numeric:tabular-nums;text-align:right}
.meter{height:5px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:3px}
.meter i{display:block;height:100%;border-radius:9px;background:var(--good)}
.flagdot{display:inline-block;width:8px;height:8px;border-radius:50%;vertical-align:middle;margin-right:3px;border:1px solid var(--line-2)}
#g-results{display:flex;flex-direction:column;gap:4px}
.res{text-align:left;padding:7px 9px;border-radius:12px;border:2px solid var(--line);background:var(--paper-2);font-size:12.5px;line-height:1.45}
.res small{display:block;color:var(--ink-2);font-size:11px}
.res mark{background:color-mix(in srgb,var(--sun) 45%,transparent);color:inherit;border-radius:3px}

/* panel */
#panel{grid-column:3;grid-row:2/4;min-height:0;max-height:100%;display:flex;flex-direction:column;pointer-events:auto;overflow:hidden;transform-origin:right center;animation:pin .28s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pin{from{transform:translateX(30px) scale(.97);opacity:0}to{transform:none;opacity:1}}
.p-head{display:flex;gap:12px;align-items:flex-start;padding:14px 14px 10px 16px;border-bottom:2px dashed var(--line)}
.p-emo{width:46px;height:46px;flex:none;display:grid;place-items:center;font-size:24px;border-radius:14px;border:2px solid var(--line);box-shadow:0 3px 0 var(--line-2)}
.p-title{flex:1;min-width:0}
.p-crumb{font-size:11.5px;color:var(--ink-2);letter-spacing:.03em}
.p-title h2{margin:0;font-family:var(--f-display);font-weight:800;font-size:20px;line-height:1.25;text-wrap:balance}
.p-title .sub{font-size:13px;color:var(--ink-2)}
.x{flex:none;width:36px;height:36px;border-radius:12px;border:2px solid var(--line);background:var(--paper-2);display:grid;place-items:center;font-size:18px;line-height:1}
.tabs{display:flex;gap:6px;padding:10px 14px 0}
.tab{flex:1;padding:7px 6px;border-radius:12px 12px 0 0;border:2px solid var(--line);border-bottom:none;background:var(--paper-2);font-size:13.5px;font-weight:700;color:var(--ink-2)}
.tab[aria-selected="true"]{background:var(--paper);color:var(--ink);box-shadow:inset 0 3px 0 var(--accent)}
.p-body{flex:1;min-height:0;overflow:auto;padding:14px 16px 18px;border-top:2px solid var(--line);overscroll-behavior:contain}
.p-body h3{font-family:var(--f-display);font-size:15px;margin:14px 0 6px;font-weight:800}
.p-body h3:first-child{margin-top:0}
.kp{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px}
.kp li{position:relative;padding:8px 10px 8px 34px;background:var(--paper-2);border-radius:12px;font-size:13.5px;line-height:1.55}
.kp li::before{content:attr(data-n);position:absolute;left:9px;top:8px;width:18px;height:18px;border-radius:6px;background:var(--line);font-family:var(--f-num);font-size:11px;font-weight:700;display:grid;place-items:center;color:var(--ink-2)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kv div{background:var(--paper-2);border-radius:12px;padding:8px 10px}
.kv b{display:block;font-family:var(--f-num);font-size:20px;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums}
.kv span{font-size:11.5px;color:var(--ink-2)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{padding:5px 11px;border-radius:999px;border:2px solid var(--line);background:var(--paper);font-size:12.5px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent-2);color:var(--accent-ink)}
.lbl{font-size:12px;color:var(--ink-2);margin:10px 0 5px;letter-spacing:.04em}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:14px;border:2px solid var(--line-2);border-bottom-width:5px;background:var(--paper-2);font-weight:700;font-size:14px;transition:transform .06s}
.btn:active{transform:translateY(3px);border-bottom-width:2px}
.btn.pri{background:var(--accent);border-color:var(--accent-2);color:var(--accent-ink)}
.btn.wide{width:100%}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:11px;border-bottom-width:4px}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* quiz */
.qtop{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:700;background:var(--paper-2);border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.chip.e{background:color-mix(in srgb,var(--sun) 25%,var(--paper));color:var(--ink)}
.qprog{margin-left:auto;font-family:var(--f-num);font-weight:600;font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.star{border:none;background:none;font-size:18px;padding:0 2px;line-height:1;color:var(--line-2)}
.star[aria-pressed="true"]{color:var(--sun)}
.bar{height:6px;border-radius:9px;background:var(--line);overflow:hidden;margin-bottom:12px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:9px;transition:width .3s}
.qstem{font-size:16px;line-height:1.7;margin:0 0 12px;font-weight:500}
.prev{font-size:12px;color:var(--ink-2);margin:-6px 0 10px}
.opts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.opt{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:start;width:100%;text-align:left;padding:10px 12px;border-radius:14px;border:2px solid var(--line);border-bottom-width:4px;background:var(--paper);font-size:14.5px;line-height:1.55;transition:transform .06s,background .15s}
.opt:hover:not([disabled]){background:var(--paper-2);border-color:var(--line-2)}
.opt:active:not([disabled]){transform:translateY(2px)}
.opt .k{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--paper-2);border:2px solid var(--line);font-family:var(--f-num);font-weight:700}
.opt .tag{font-size:11.5px;font-weight:800;padding:2px 8px;border-radius:999px;align-self:center;white-space:nowrap}
.opt[disabled]{cursor:default}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.right .k{background:var(--good);border-color:var(--good);color:var(--paper)}
.opt.right .tag{background:var(--good);color:var(--paper)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:var(--paper)}
.opt.wrong .tag{background:var(--bad);color:var(--paper)}
.opt.dim{opacity:.6}
.fb{margin-top:12px;border-radius:16px;padding:12px 14px;border:2px solid var(--line);background:var(--paper-2);animation:pop .25s ease-out}
@keyframes pop{from{transform:scale(.97);opacity:0}to{transform:none;opacity:1}}
.fb.ok{border-color:var(--good)} .fb.no{border-color:var(--bad)}
.fb .v{font-family:var(--f-display);font-weight:800;font-size:18px}
.fb.ok .v{color:var(--good)} .fb.no .v{color:var(--bad)}
.fb .ans{margin:4px 0 6px;font-weight:700}
.fb .exp{margin:0;font-size:13.5px;line-height:1.7}
.fb .src{margin-top:8px;font-size:11.5px;color:var(--ink-2)}
.qnav{display:flex;gap:8px;margin-top:14px}
.qnav .btn{flex:1}
.hint{font-size:11.5px;color:var(--ink-2);text-align:center;margin-top:8px}
.hint kbd{font-family:var(--f-num);font-size:11px;padding:0 5px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:5px;background:var(--paper)}
.fig{margin:0 0 12px;border-radius:12px;border:2px solid var(--line);background:var(--paper-2);padding:10px;overflow-x:auto}
.fig pre{margin:0;font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;font-size:12.5px;line-height:1.6;color:var(--ink)}
.fig svg{display:block;max-width:100%;height:auto;margin:auto}
.empty{padding:18px;border-radius:14px;background:var(--paper-2);text-align:center;color:var(--ink-2)}

/* log list */
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.log li{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:8px;align-items:start;padding:8px 10px;border-radius:12px;background:var(--paper-2);font-size:13px;line-height:1.5}
.log .r{font-weight:800;font-family:var(--f-num);font-size:15px;line-height:1.3}
.log .r.ok{color:var(--good)} .log .r.no{color:var(--bad)}
.log .m{min-width:0}
.log .m small{display:block;color:var(--ink-2);font-size:11.5px}
.log .qt{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* dock */
.dock{grid-column:2;grid-row:3;justify-self:center;align-self:end;display:flex;gap:6px;padding:6px;pointer-events:auto;flex-wrap:wrap;justify-content:center}
.dock .btn{font-size:13px;padding:7px 12px}
.badge{font-family:var(--f-num);font-size:11px;min-width:18px;padding:0 5px;border-radius:999px;background:var(--accent);color:var(--accent-ink);line-height:18px}
#g-toggle{display:none}

/* modal */
.modal{position:fixed;inset:0;display:grid;place-items:center;background:var(--scrim);pointer-events:auto;z-index:20;
  padding-block:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet{width:min(780px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden;animation:pop .25s ease-out}
.sheet .p-body{border-top:2px solid var(--line)}
.heat{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px}
.heat button{text-align:left;padding:7px 9px;border-radius:12px;border:2px solid var(--line);background:var(--paper-2);font-size:12px;line-height:1.35}
.heat button b{display:block;font-size:12.5px}
.heat button span{font-family:var(--f-num);color:var(--ink-2)}
.intro{width:min(560px,100%);padding:22px 22px 18px;max-height:100%;overflow:auto;animation:pop .3s ease-out}
.intro h2{font-family:var(--f-display);font-size:26px;font-weight:800;margin:0 0 4px;letter-spacing:.03em;text-wrap:balance}
.intro p{margin:0 0 12px;color:var(--ink-2)}
.intro ul{margin:0 0 16px;padding:0;list-style:none;display:grid;gap:8px}
.intro li{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:center;padding:8px 10px;background:var(--paper-2);border-radius:12px;font-size:13.5px}
.intro li span{font-size:20px;text-align:center}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--ink-2);margin-bottom:14px}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:6px}
.t{padding:8px 16px;border-radius:999px;background:var(--ink);color:var(--paper);font-weight:700;font-size:13.5px;box-shadow:0 8px 20px var(--shadow);animation:pop .2s ease-out;white-space:nowrap}
.score{display:flex;align-items:center;gap:16px;padding:14px;border-radius:16px;background:var(--paper-2);margin-bottom:12px}
.score b{font-family:var(--f-num);font-size:44px;line-height:1;font-weight:700}
details.rv{border:2px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--paper)}
details.rv summary{cursor:pointer;font-size:13px}
details.rv + details.rv{margin-top:6px}

.fishstage{padding:18px 16px;border-radius:16px;background:linear-gradient(180deg,var(--paper-2),color-mix(in srgb,var(--water) 35%,var(--paper)));text-align:center;margin-bottom:12px}
.fishstage p{margin:4px 0 0;font-size:13.5px;color:var(--ink-2)}
.fs-big{font-family:var(--f-display);font-weight:800;font-size:20px}
.fishstage.bite{background:color-mix(in srgb,var(--sun) 40%,var(--paper));animation:shake .3s infinite}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.btn.pulse{animation:pls .5s infinite alternate}
@keyframes pls{to{transform:scale(1.04)}}
.odds{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.odds span{background:var(--paper-2);border-radius:12px;padding:7px 9px;font-size:12px;color:var(--ink-2);line-height:1.4}
.odds b{display:block;font-size:13px}
.fishcard{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:16px;background:color-mix(in srgb,var(--water) 30%,var(--paper));border:2px solid var(--line);margin-bottom:10px;animation:pop .3s ease-out}
.fc-pic{flex:none;display:grid;place-items:center}
.fc-pic svg{max-width:120px}
.fc-name{font-family:var(--f-display);font-weight:800;font-size:19px;line-height:1.3}
.fc-meta{font-size:12.5px;color:var(--ink-2)}
.concept{padding:10px 12px;border-radius:14px;border:2px dashed var(--line-2);background:var(--paper);font-size:13.5px;line-height:1.6;margin-bottom:12px}
.concept b{display:block;font-family:var(--f-display);font-size:12px;letter-spacing:.06em;color:var(--ink-2)}
.book{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.bk{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;padding:8px 6px;border-radius:14px;background:var(--paper-2);border:2px solid var(--line)}
.bk b{font-size:12.5px} .bk small{font-size:11px;color:var(--ink-2);line-height:1.4}
.bk.no b{color:var(--ink-2)}
@media (max-width: 900px){
  #ui{grid-template-columns:minmax(0,260px) minmax(0,1fr) minmax(0,380px)}
}
@media (max-width: 760px){
  #ui{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto}
  .brand{padding:6px 12px 6px 6px;gap:8px} .brand h1{font-size:17px;white-space:nowrap} .brand .logo{width:32px;height:32px} .brand p{display:none}
  .stats{padding:4px 2px;flex-wrap:nowrap} .stat{min-width:0;padding:0 8px} .stat b{font-size:15px} .stat span{font-size:10px;white-space:nowrap} .stat.opt2,.stat.opt3{display:none}
  #guide{position:fixed;left:0;top:0;bottom:0;width:min(320px,86vw);max-height:none;border-radius:0 20px 20px 0;z-index:15;transform:translateX(-105%);transition:transform .25s;
    padding-top:max(14px,env(safe-area-inset-top,0px));padding-bottom:max(14px,env(safe-area-inset-bottom,0px));padding-left:max(12px,env(safe-area-inset-left,0px))}
  #guide.open{transform:none}
  #g-toggle{display:inline-flex}
  #panel{position:fixed;left:0;right:0;bottom:0;max-height:62%;border-radius:22px 22px 0 0;z-index:12;animation:up .28s ease-out;
    padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  @keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
  .dock{grid-column:1}
  body.sheet-open .dock{display:none}
  .qstem{font-size:15px}
  .kv b{font-size:17px}
}
@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }

<script>window.DATA={"islands":[{"id":"m1","subj":1,"chap":"第四章 資訊安全管理系統","sec":"第一節 資訊安全管理概念","name":"資訊安全管理概念","nick":"CIA 城堡","emoji":"🏰","q":0,"r":-2,"kp":["CIA 三要素：機密性、完整性、可用性；延伸還有驗證性、可歸責性、不可否認性、可靠性","ISO/IEC 27001 是 ISMS 驗證標準、27002 是控制措施指引；27017／27018 為雲端、27799 為醫療","PDCA：Plan 建立 → Do 實施 → Check 監控檢視 → Act 維運改善","資產、威脅、弱點、風險：威脅利用弱點，對資產造成衝擊","稽核：第一方（內部）、第二方（客戶／主管機關）、第三方（驗證機構）"]},{"id":"m2","subj":1,"chap":"第四章 資訊安全管理系統","sec":"第二節 相關法規概論與遵循","name":"相關法規概論與遵循","nick":"法規法院","emoji":"⚖️","q":-1,"r":-1,"kp":["資通安全管理法適用公務機關與特定非公務機關，依資通安全責任等級（A–E）辦理應辦事項","機關需設置資通安全長、資安專職人員，並對專職人員辦理適任性查核","資安事件分 1–4 級，應於知悉後 1 小時內通報","危害國家資通安全產品原則禁用，例外須經核定並列冊管理","相關法規：個資法、營業秘密法、著作權法、刑法妨害電腦使用罪章"]},{"id":"m3","subj":1,"chap":"第四章 資訊安全管理系統","sec":"第三節 隱私權保護與智慧財產權","name":"隱私權保護與智慧財產權","nick":"隱私圖書館","emoji":"📚","q":0,"r":-1,"kp":["個資法當事人權利：查詢閱覽、製給複製本、補充更正、停止蒐集處理利用、刪除","特種個資：病歷、醫療、基因、性生活、健康檢查、犯罪前科","蒐集個資需告知目的與類別；大數據分析前應去識別化","資訊倫理 PAPA：隱私權、正確性、財產權、存取權","營業秘密三要件：秘密性、經濟價值、合理保密措施"]},{"id":"m4","subj":1,"chap":"第五章 資產與風險管理","sec":"第一節 資產分類分級與盤點","name":"資產分類分級與盤點","nick":"資產倉庫","emoji":"📦","q":-1,"r":0,"kp":["資產類型：資料、軟體、硬體、通訊、文件、人員、服務、環境","角色分工：擁有者決定分級、保管人執行保護、使用者依規定使用","依 CIA 價值分級，對應不同等級的保護措施","流程：定義適用範圍 → 盤點資產 → 分類分級 → 風險評鑑，並定期更新","SBOM 盤點軟體元件；處理影子 IT 要先盤點"]},{"id":"m5","subj":1,"chap":"第五章 資產與風險管理","sec":"第二節 風險評鑑與風險處理","name":"風險評鑑與風險處理","nick":"風險燈塔","emoji":"🗼","q":-2,"r":0,"kp":["風險值常以 資產價值 × 威脅可能性 × 弱點嚴重度（衝擊 × 可能性）計算","流程：風險識別 → 分析 → 評估 → 處理 → 監控審查","四種處理方式：降低、轉移（保險／外包）、避免、接受","殘餘風險需經管理階層核准接受","NIST RMF：Frame → Assess → Respond → Monitor；供應鏈也要評估"]},{"id":"m6","subj":1,"chap":"第六章 存取控制、加解密與金鑰管理","sec":"第一節 存取控制與身分認證","name":"存取控制與身分認證","nick":"鑰匙門塔","emoji":"🗝️","q":-2,"r":1,"kp":["AAA：認證（Authentication）、授權（Authorization）、可歸責（Accounting）","認證因素：知識、持有、生物特徵；多因子驗證要結合不同類型","存取模型：DAC、MAC、RBAC、ABAC；遵循最小權限、職責分離、需知原則","生物辨識：FAR 誤放、FRR 誤殺，兩者交叉點為 CER／EER","SSO、零信任、FIDO2 抗釣魚、PAM 與 JIT 即時權限"]},{"id":"m7","subj":1,"chap":"第六章 存取控制、加解密與金鑰管理","sec":"第二節 加解密與金鑰生命週期","name":"加解密與金鑰生命週期","nick":"密碼金庫","emoji":"🔐","q":-1,"r":1,"kp":["對稱式（AES）：速度快但金鑰分配困難；非對稱式（RSA、ECC）：可交換金鑰、做數位簽章","雜湊：輸出固定長度、單向不可逆；MD5、SHA-1 已有碰撞","數位簽章：私鑰簽、公鑰驗，提供完整性與不可否認性","PKI：CA、憑證、CRL／OCSP；自然人憑證","金鑰生命週期：產生 → 分發 → 儲存 → 使用 → 更換 → 撤銷 → 銷毀"]},{"id":"m8","subj":1,"chap":"第七章 事故管理與營運持續","sec":"第一節 事件與事故管理","name":"事件與事故管理","nick":"應變消防局","emoji":"🚒","q":-2,"r":2,"kp":["事件（Event）是可觀察的現象；事故（Incident）是影響營運或違反政策的事件","NIST SP 800-61：準備 → 偵測與分析 → 圍堵、根除、復原 → 事後活動","圍堵先阻止擴散並保全證據；無法確認清除時從乾淨備份重建","事件等級取 CIA 中最高的等級；知悉後 1 小時內通報","SIEM 集中分析、SOC 監控、數位鑑識要維持證據監管鏈"]},{"id":"m9","subj":1,"chap":"第七章 事故管理與營運持續","sec":"第二節 備援與營運持續","name":"備援與營運持續","nick":"備援避風港","emoji":"⚓","q":-1,"r":2,"kp":["BCM：建立策略 → 營運衝擊分析（BIA）→ 復原策略 → 計畫 → 測試演練 → 維護","RPO：可容忍的資料遺失量；RTO：復原所需時間；RTO 不可大於 MTPD","備援站點：熱備援可即時切換、溫備援、冷備援","完整、差異、增量備份；增量還原需要完整備份加上每一份增量","DRP 災難復原計畫、異地備援；BCM 需各業務部門共同投入"]},{"id":"t1","subj":2,"chap":"第四章 網路與通訊安全","sec":"第一節 網路安全","name":"網路安全","nick":"防火牆碼頭","emoji":"🧱","q":1,"r":-2,"kp":["防火牆類型：封包過濾、狀態檢測、應用層代理、NGFW、WAF","IDS 偵測、IPS 阻擋；用 DMZ 與網段切分降低風險","常見攻擊：DoS／DDoS、ARP 欺騙、DNS 欺騙、VLAN 跳躍、BGP 劫持、惡意 DHCP","防護：DHCP Snooping、DAI、Port Security、RPKI","CAPTCHA 可區分人類與機器，用來擋自動化攻擊"]},{"id":"t2","subj":2,"chap":"第四章 網路與通訊安全","sec":"第二節 通訊安全","name":"通訊安全","nick":"通訊電塔","emoji":"📡","q":2,"r":-2,"kp":["分層安全協定：HTTPS／TLS、IPsec（網路層 VPN）、SSH（應用層遠端連線）","無線演進：WEP < WPA < WPA2 < WPA3（SAE）；KRACK、Evil Twin、降級攻擊","工作模式：ECB 不安全、CBC 需搭配 MAC、GCM 同時提供加密與驗證","混合式加密：非對稱交換金鑰，再以對稱加密傳送大量資料","VPN 以通道協定（Tunneling）建立安全連線"]},{"id":"t3","subj":2,"chap":"第五章 作業系統與應用程式安全","sec":"第一節 作業系統安全","name":"作業系統安全","nick":"系統工廠","emoji":"🏭","q":1,"r":-1,"kp":["系統強化：關閉不必要服務、移除預設帳號、套用 GCB 組態基準","定期修補、最小權限執行、帳號密碼與鎖定原則","記憶體防護：ASLR／KASLR、DEP／NX、Stack Canary","主機遭駭時先隔離網路，再保全跡證","常用指令：ping、ipconfig、netstat、arp、nslookup"]},{"id":"t4","subj":2,"chap":"第五章 作業系統與應用程式安全","sec":"第二節 作業系統與應用程式","name":"作業系統與應用程式攻擊手法","nick":"攻擊者洞窟","emoji":"🕷️","q":2,"r":-1,"kp":["OWASP Top 10：存取控制失效、加密失敗、注入、不安全設計等","SQL Injection（In-band、Blind、Out-of-band）、XSS、CSRF","緩衝區溢位、權限提升、DLL 側載、登錄檔持久化","HTTP 請求走私、Session 劫持","防護：輸入驗證、輸出編碼、參數化查詢"]},{"id":"t5","subj":2,"chap":"第五章 作業系統與應用程式安全","sec":"第三節 程式與開發安全","name":"程式與開發安全","nick":"安全開發實驗室","emoji":"🧪","q":3,"r":-2,"kp":["安全開發生命週期：Microsoft SDL、ISO/IEC 27034","越晚修補成本越高，上線維運階段最高","白箱：原碼檢測（Fortify、Checkmarx）；黑箱：滲透測試、DAST","安全部署：移除除錯程式與後門、不以最高權限執行","SBOM 與供應鏈安全；避免格式字串、硬編碼憑證"]},{"id":"t6","subj":2,"chap":"第六章 資安維運技術","sec":"第一節 惡意程式防護與弱點管理","name":"惡意程式防護與弱點管理","nick":"防疫診所","emoji":"🦠","q":1,"r":0,"kp":["惡意程式：病毒、蠕蟲、木馬、勒索軟體、Rootkit、殭屍網路","防護：防毒、EDR、沙箱、應用程式白名單；留意沙箱規避","弱點管理：盤點 → 掃描 → 評分（CVSS）→ 修補 → 驗證","弱點掃描找已知 CVE；滲透測試會實際利用弱點","VANS 弱點通報；實體隔離環境要管控 USB"]},{"id":"t7","subj":2,"chap":"第六章 資安維運技術","sec":"第二節 資料安全及備份管理","name":"資料安全及備份管理","nick":"資料保險庫","emoji":"💾","q":2,"r":0,"kp":["資料生命週期保護：分類、加密、DLP、安全銷毀","3-2-1 原則：3 份資料、2 種媒介、1 份異地","RAID 是容錯，不是備份；熱、溫、冷備援","不可變備份與離線備份可對抗勒索軟體","備份間隔不可大於 RPO，並定期演練還原"]},{"id":"t8","subj":2,"chap":"第六章 資安維運技術","sec":"第三節 日誌管理","name":"日誌管理","nick":"日誌鐘樓","emoji":"🕰️","q":3,"r":-1,"kp":["日誌生命週期：產生 → 傳輸 → 儲存 → 分析 → 處置","集中到遠端 Log Server／SIEM，並以 NTP 同步時間","保護日誌的完整性與存取權限；絕不記錄明文密碼","Windows 事件檢視器的「安全性」紀錄（4624／4625）、syslog","調校告警規則，避免告警疲勞"]},{"id":"t9","subj":2,"chap":"第七章 新興科技安全","sec":"第一節 雲端安全概論","name":"雲端安全概論","nick":"雲端天空塔","emoji":"☁️","q":0,"r":1,"kp":["NIST 五大特性：隨需自助、廣泛網路存取、資源池化、快速彈性、可量測服務","服務模式 IaaS／PaaS／SaaS；部署模式：公有、私有、混合、社群","共同責任模型：越往 SaaS，使用者自管的部分越少，但資料與存取永遠是使用者的責任","CASB、SWG、ZTNA、SASE","雲端相關標準：ISO 27017、27018、CSA STAR"]},{"id":"t10","subj":2,"chap":"第七章 新興科技安全","sec":"第二節 行動裝置安全概論","name":"行動裝置安全概論","nick":"行動手機村","emoji":"📱","q":1,"r":1,"kp":["威脅：惡意 App、釣魚、遺失被竊、不安全的 Wi-Fi、越獄／Root","MDM 管裝置、MAM 管 App、UEM 整合兩者；BYOD 政策","只從官方商店安裝、檢查 App 權限、保持更新","螢幕鎖、全機加密、遠端抹除","關閉 Wi-Fi 自動連線，避免連上不受信任的網路"]},{"id":"t11","subj":2,"chap":"第七章 新興科技安全","sec":"第三節 物聯網安全概論","name":"物聯網安全概論","nick":"物聯網未來港","emoji":"🤖","q":0,"r":2,"kp":["IoT 三層架構：感知層、網路層、應用層","攻擊：中間人、黑洞、Sybil、重送、金鑰淪陷、密碼攻擊","OT／ICS 以可用性為優先；邊緣運算節點容易遭物理接觸","AI 安全：對抗性攻擊、資料下毒；AI SOC 關鍵處置要保留人工審核","後量子密碼學（PQC）；預防無用論主張持續防禦"]}],"questions":[{"id":"G1-001","i":"m1","s":"G","q":"關於機密性（Confidentiality），下列敘述何者「不」正確？","o":["資訊不得在未授權的情況下對外揭露","資訊於儲存、傳輸過程中應採取加密措施","個人資料如帳號、密碼、信用卡卡號等資訊外洩為機敏性可能面臨之風險","機敏性資料僅有在駭客攻擊時才會面臨的風險"],"a":3,"e":"機密性係確保資料傳遞與儲存的私密性，避免未經授權的使用者有意或無意的揭露資料內涵；除駭客攻擊外，公司不小心公佈不該公佈的訊息也是。"},{"id":"G1-002","i":"m1","s":"G","q":"下列何者屬於資料完整性受影響？","o":["機密資料外洩","檔案遭毀損而無法存取","系統無法正常提供服務","以明文方式傳輸"],"a":1,"e":"完整性應防止人為不慎的操作、惡意的竄改，或是自然雜訊的干擾，確保資訊或系統之正確性；檔案遭毀損而無法存取即為完整性遭影響。"},{"id":"G1-003","i":"m1","s":"G","q":"某系統的重要資料被駭客入侵，置換成含有惡意程式的檔案，此為下列何種資訊安全特性被破壞了？","o":["機密性（Confidentiality）","完整性（Integrity）","可用性（Availability）","不可否認性（Non-repudiation）"],"a":1,"e":"完整性應防止人為不慎的操作、惡意的竄改，或是自然雜訊的干擾，確保資訊或系統之正確性；被駭客入侵，置換成含有惡意程式的檔案係為遭受惡意的竄改。"},{"id":"G1-004","i":"m1","s":"G","q":"關於將檔案設定密碼保護之目的，下列敘述何者正確？","o":["是為了確保資料之機密性","是為了確保資料之可用性","是為了確保資料之完整性","是為了確保資料之可讀性"],"a":0,"e":"機密性係確保資料傳遞與儲存的私密性，避免未經授權的使用者有意或無意的揭露資料內涵；設定密碼即是為了機密性。"},{"id":"G1-005","i":"m1","s":"G","q":"下列何者為「公司網路系統必須 24 小時運作」的主要原因？","o":["機密性","可用性","完整性","不可否認性"],"a":1,"e":"可用性：確認被授權者在需要的時候，資訊與相關資產是可以存取與可以使用的。資訊與資訊處理的可用性，應避免因系統的故障、或是人為惡意的阻斷服務而受影響。企業資料必需即時並可靠的提供給企業內部各個層級的使用需求。"},{"id":"G1-006","i":"m1","s":"G","q":"下列何者為資訊安全的「可用性」之定義？","o":["確保資訊的正確和完全性","確保資訊在需要時可被存取和使用","確保資訊在傳輸過程中已確認兩方的身分和合法性","確保資訊不會被揭露或被未經授權的個人、實體和流程所取得"],"a":1,"e":"可用性：確認被授權者在需要的時候，資訊與相關資產是可以存取與可以使用的。資訊與資訊處理的可用性，應避免因系統的故障、或是人為惡意的阻斷服務而受影響。企業資料必需即時並可靠的提供給企業內部各個層級的使用需求。"},{"id":"G1-007","i":"m1","s":"G","q":"關於資訊安全管理系統（Information Security Management System, ISMS），下列敘述何者較「不」正確？","o":["導入資訊安全管理系統可以保護組織資訊資產的安全","要建立良好的資訊安全管理系統，需要制度面與技術面互相配合","最高管理階層的參與及支持是成功建立資訊安全管理系統的重點之一","在建立組織資訊安全管理系統的活動中，識別弱點會優先於識別資訊資產"],"a":3,"e":"在建立組織資訊安全管理系統的活動中，識別資訊資產會優先於識別弱點。"},{"id":"G1-008","i":"m1","s":"G","q":"資訊安全管理系統（Information Security Management System, ISMS）是在於管理面的要求，藉由審查機制、事件的回應及內部稽核來預防資訊安全事件或是降低其損失的風險，下列敘述何者不正確？","o":["需要管理階層的承諾及提供相關支援，表達對資訊安全管理系統的支持","採用計畫（Plan）、執行（Do）、檢查（Check）及行動（Act）等四個階段的改進流程進行","資訊安全目標無需具體量化，導入解決方案，強化資訊安全防護為指導方針","內部稽核的成果報告需要在管理審查會議中進行檢討"],"a":2,"e":"資訊安全目標「需」具體量化，導入解決方案，強化資訊安全防護為指導方針。"},{"id":"G1-009","i":"m1","s":"G","q":"請問在資訊安全管理系統中的風險評鑑（RiskAssessment）作業，是在 Plan（規劃）、Do（執行）、Check（檢查）、Act（改善）循環中的那一部分？","o":["Plan（規劃）","Do（執行）","Check（檢查）","Act（改善）"],"a":1,"e":"風險評鑑屬執行之一部份。"},{"id":"G1-010","i":"m1","s":"G","q":"在建置與運作資安系統時，常用戴明循環（Deming Cycle）協助管理，下列何項是戴明循環（Deming Cycle）正確的順序？","o":["Plan–Act–Do–Check","Do–Check–Plan–Act","Plan–Do–Check–Act","Act–Check–Do–Plan"],"a":2,"e":"資訊安全管理制度可分為 PDCA （Plan-Do-Check- Act）四大部份，針對品質工作按規劃、執行、查核與行動來進行活動，循環執行，以確保可靠度目標之達成，並進而促使品質持續改善。"},{"id":"G1-011","i":"m2","s":"G","q":"在資訊倫理領域中，常提到的四大議題（PAPA，學者 Mason 所提出），下列何者「不」在其中？","o":["隱私權（Privacy）","正確性（Accuracy）","所有權/財產權（Property）","可用性（Availability）"],"a":3,"e":"PAPA 理論，包含了隱私權（Privacy）、正確性（Accuracy）、財產權（Property）及使用權（Accessibility）。"},{"id":"G1-012","i":"m2","s":"G","q":"請問資訊倫理常探討的四大議題（PAPA，學者 Mason 所提出）中，個人可保護自有資訊，具有決定是否公開或保密的權利，所指的是下列何者？","o":["隱私權","正確性","存取權","廣泛性"],"a":0,"e":"個人可保護自有資訊，具有決定是否公開或保密的權利為隱私權。"},{"id":"G1-013","i":"m2","s":"G","q":"為保障持卡人的資料安全，制定統一的資料安全標準，提供資料安全的技術與作業要求之基準，此行為屬下列何者？","o":["PCI DSS","HIPAA","Sarbanes-Oxley Act","Basel II"],"a":0,"e":"支付卡產業資料安全標準 Payment Card Industry Data Security Standard （PCI DSS）。"},{"id":"G1-014","i":"m2","s":"G","q":"由獨立的驗證單位所執行之稽核，稱為下列何者？","o":["第一方（First Party）稽核","第二方（Second Party）稽核","第三方（Third Party）稽核","聯合/合併（Joint）稽核"],"a":2,"e":"驗證（Certification）或認證（Accreditation）稽核屬第三方稽核。"},{"id":"G1-015","i":"m2","s":"G","q":"請問主管機關對所屬機構（如：金管會對銀行）執行之稽核，稱為下列何者？","o":["第一方（First Party）稽核","第二方（Second Party）稽核","第三方（Third Party）稽核","聯合/合併（Joint）稽核"],"a":1,"e":"主管機關對所屬機構屬於第二方（Second Party）稽核。"},{"id":"G1-016","i":"m2","s":"G","q":"下列何種稽核可做出建議 ISO 27001 通過驗證發出證書？","o":["第一方（First Party）稽核","第二方（Second Party）稽核","第三方（Third Party）稽核","第四方（Fourth party）稽核"],"a":2,"e":"驗證（Certification）或認證（Accreditation）稽核屬第三方稽核。"},{"id":"G1-017","i":"m2","s":"G","q":"請問目前國際上可做為取得認證與資訊安全相關的國際標準為何？","o":["ISO 27001","ISO 27002","ISO 27005","ISO 27006"],"a":0,"e":"ISO 27001 可做為取得認證與資訊安全相關的國際標準。"},{"id":"G1-018","i":"m2","s":"G","q":"實施資訊安全管理系統（Information Security Management System, ISMS），第三方驗證公司是依據下列何種 ISO 標準進行驗證？","o":["ISO/IEC 27000 :2013","ISO/IEC 27001 :2013","ISO/IEC 27002 :2013","ISO/IEC 27003 :2013"],"a":1,"e":"ISO/IEC 27001 :2013 為第三方驗證公司是進行驗證之標準。"},{"id":"G1-019","i":"m2","s":"G","q":"在進行資安內部稽核時，下列何者「不」是組織應該採取的做法？","o":["由稽核小組規劃和建立內部稽核的計畫","在稽核計畫中定義稽核的範圍和準則","為確保稽核專業度，由資訊人員稽核其所負責的資訊系統","在完成稽核之後，將稽核結果報告給相關管理階層"],"a":2,"e":"為確保稽核專業度，由資訊人員「不得」稽核其所負責的資訊系統。"},{"id":"G1-020","i":"m2","s":"G","q":"下列那一項標準是針對雲端服務個人隱私資料的保護？","o":["ISO/IEC 27001","ISO/IEC 27002","ISO/IEC 27017","ISO/IEC 27018"],"a":3,"e":"ISO/IEC 27018 是針對雲端服務個人隱私資料的保護。"},{"id":"G1-021","i":"m3","s":"G","q":"資訊安全管理系統之法規遵循與適法性要求，旨在降低公司單位違反法律的風險，請問若公司要避免違反智慧財產權的相關法律，下列何者「不」包含在智慧財產權中？","o":["著作權（Literary Property）","商標權（Trademark）","電子簽章法（Electronic Signature）","營業秘密（Trade Secret）"],"a":2,"e":"智慧財產權的項目包含有：著作權、商標權、工業設計、專利、積體電路之電路布局等。"},{"id":"G1-022","i":"m3","s":"G","q":"下列何者與保護「個人資訊隱私」有關？","o":["個人資料保護法","專利法","商標法","著作權法"],"a":0,"e":"個人資料的保護也就是隱私權（Privacy）的保護與保障。"},{"id":"G1-023","i":"m3","s":"G","q":"為規範個人資料之蒐集、處理及利用，以避免人格權受侵害，並促進個人資料之合理利用。上述之法規為何？","o":["電子簽章法","妨害電腦使用罪","著作權法","個人資料保護法"],"a":3,"e":"個人資料保護法之第 1 條：「為規範個人資料之蒐集、處理及利用，以避免人格權受侵害，並促進個人資料之合理利用」。"},{"id":"G1-024","i":"m3","s":"G","q":"畢業後返校申請在校成績單，是行使個資法的哪一項權利？","o":["請求刪除","請求製給複製本","請求補充","請求停止處理"],"a":1,"e":"畢業後返校申請在校成績單為請求製給複製本權利。"},{"id":"G1-025","i":"m3","s":"G","q":"關於智慧財產權（Intellectual Property Right, IPR），下列敘述何者「不」正確？","o":["商標權是使用文字、標語和標誌的權利，註冊商標後，註冊人即享有商標專用權","專利權是對發明授予的權利，對專利權人之發明予以保護","著作權是為保護著讀者的權益，不被非授權複製與使用","營業秘密是指不爲公衆所知悉，能爲權利人帶來經濟利益，具有實用性並對權利人採取保密措施的技術資訊和經營資訊"],"a":2,"e":"著作權是指法律所賦予著作人對於其所創作的著作的所有權利保護。"},{"id":"G1-026","i":"m3","s":"G","q":"所有權（Property）是資訊倫理常探討的四大議題之一，請問關於所有權，下列敘述何者較為正確？","o":["誰擁有資訊？","誰負責資訊的真實性與正確性？","在何種狀況保護措施下，可向他人揭露那些個人資料？","在何種條件下，個人與組織有權利來獲取所需資料？"],"a":0,"e":"（B）資訊精確性、（C）隱私權、（D）資訊存取權"},{"id":"G1-027","i":"m3","s":"G","q":"公務或非公務機關在進行個人資料蒐集時，應明確告知當事人事項，請問其告知內容「不」包含下列何者？","o":["個人資料蒐集的目的","個人資料的類別","個人資料儲存方式","個人資料利用的期間與地區"],"a":2,"e":"個人資料儲存方式不為個資法第八條所規定之應告知事項。"},{"id":"G1-028","i":"m3","s":"G","q":"下列何者是我國個人資料保護法與歐盟一般資料保護規範（General Data Protection Regulation, GDPR）有較相同的規定？","o":["資料刪除權","資料可攜權","引進新科技之個資處理方式時需進行資料保護影響評估","資料保護長制度"],"a":0,"e":"相較於其他三選項，我國個資法第三條第五款規定當事人具有請求刪除之權利。"},{"id":"G1-029","i":"m3","s":"G","q":"下列何者違反 GDPR（General Data Protection Regulation）的規範要求？","o":["GDPR 為歐盟一般資料保護法規","任何使用與歐盟公民相關資訊的公司都必須遵循","雲端處理者與控制者目前不納入 GDPR 強制實施範圍","要求持有個人可識別資訊的組織，需實施適切的安全控制措施，以防止個人資料遺失"],"a":2,"e":"GDPR 係規定所有資料處理者及控制者，並未將雲端除外。"},{"id":"G1-030","i":"m3","s":"G","q":"下列何者「不」是經濟合作及發展組織（Organization for Economic Cooperation and Development, OECD）之個人資料保護原則？","o":["限制蒐集原則（Collection Limitation Principle）","分享原則（Share Principle）","公開原則（Openness Principle）","個人參與原則（Individual Participation Principle）"],"a":1,"e":"分享原則不為 OECD 之個人資料保護原則。"},{"id":"G1-031","i":"m4","s":"G","q":"以下關於資產清冊的敘述，何者較「不」正確？","o":["在進行資產管理時，應優先建立資產清冊","將可移除式媒體載於資產清冊上，可減少資料遺失的機會","資產清冊需要識別與資訊及資訊處理設施有關的資產，並應予文件化","組織所有的資產，都應明列在資訊資產清冊上，也都需要標示購置時的成本和費用"],"a":3,"e":"組織所有的資產，都應明列在資訊資產清冊上，但毋需標示資產購置時的成本和費用。"},{"id":"G1-032","i":"m4","s":"G","q":"關於資訊資產分級的目的，下列敘述何者正確？","o":["確保組織之相關安全責任","限制對資訊的存取","確保資產依組織之重要性，受到適切等級的保護","確保系統運作的完整性"],"a":2,"e":"資訊資產分級之目標在確保資訊依據對組織的重要性受到適當等級的保護。"},{"id":"G1-033","i":"m4","s":"G","q":"在資訊安全管理系統（Information Security Management System, ISMS）中定義並進行資訊資產分級，下列何者最適合納入評估面向？","o":["資訊資產的變現金額","資訊資產的折舊","資訊資產的流動性","資訊資產的機敏性"],"a":3,"e":"其他選項皆為財會等考量，非屬資訊資產的評量依據。"},{"id":"G1-034","i":"m4","s":"G","q":"對於資訊資產分級，以下敍述何者適當？","o":["資訊資產分級之主要目的是方便組織進行資產登記與報廢","資訊資產分級之主要目的是協助組織定義資訊資產對組織的重要性","資訊資產的採購金額愈高，對組織的重要性一定愈高","人員非屬資訊資產應評估之象限之一"],"a":1,"e":"資訊資產分級之目標在確保資訊依據對組織的重要性受到適當等級的保護。"},{"id":"G1-035","i":"m4","s":"G","q":"請問下列對於資訊資產擁有者（Owner）在資產管理的工作描述何者為非？","o":["確保資產已盤點與造冊","確保資產已適切分級並受保護","當資產刪除或銷毀資產時，確保已適當清除與處理","例行工作應親自執行，不可指派他人執行"],"a":3,"e":"資產擁有者可能不具資產之財產權，但對資產之生產、開發、維護、使用及安全有適當的責任。"},{"id":"G1-036","i":"m4","s":"G","q":"在資安管理中，關於資訊資產清冊，下列敘述何者「不」正確？","o":["資產的重要性應與所支援的業務有關","運用資產管理軟體掃描可省去確認程序","資訊資產應依據依其類型進行分類","資產的重要性依其支援業務的重要性而有差異"],"a":1,"e":"大多數的資訊資產無法由軟體掃描取得，且掃描的結果需要進行確認以確保正確性。"},{"id":"G1-037","i":"m4","s":"G","q":"關於資訊資產，下列敘述何者「不」正確？","o":["資產指的是任何對組織有價值的事物","資產包含有型的事物，資訊包含無形的事物","資訊也是資產的一種","資訊可以以很多不同的形式存在"],"a":1,"e":"資訊的價值超越了書面文字、數字與影像：知識、概念、思想與品牌等，都是資訊以無形的型式來呈現。"},{"id":"G1-038","i":"m4","s":"G","q":"資訊資產價值需考量資訊資產的機密性、完整性及可用性，下列資訊資產何者的機密性價值更高？","o":["人事資料","公司官網","線上學習系統","外部訓練申請單"],"a":0,"e":"人事資料屬於員工個人資料，更可能包含特種個人資料。"},{"id":"G1-039","i":"m4","s":"G","q":"關於電力供應，較符合資訊安全管理系統（Information Security Management System, ISMS）的何種資產類型？","o":["軟體資產","資訊資產","硬體資產","服務資產"],"a":3,"e":"電力供應於 ISMS 中歸類為服務資產。"},{"id":"G1-040","i":"m4","s":"G","q":"若要保護機敏資料，針對可移除式媒體（如：USB 隨身碟）的管理，下列敘述何者較「不」適當？","o":["將可移除式媒體儲存於安全的環境","將可移除式媒體上的敏感資料進行加密","不將可移除式媒體登載於資產清冊上","不需使用的可移除式媒體，應將所儲存的資料徹底移除"],"a":2,"e":"移除式媒體應登載於資產清冊上。"},{"id":"G1-041","i":"m5","s":"G","q":"在資訊安全管理系統（Information Security Management System, ISMS）中，風險識別「不」含下列何者？","o":["識別各項資產的脆弱性","分析資安事故或事件對組織帶來的衝擊程度","評估環境或新技術帶來的威脅","建議購買軟硬體設備清單"],"a":3,"e":"風險識別不包含建議購買軟硬體設備清單。"},{"id":"G1-042","i":"m5","s":"G","q":"風險分析所使用的方法，除了「定量法（Quantitative）」之外，還可以採用下列何種方法？","o":["定性法","類比法","平均法","參數法"],"a":0,"e":"系統化的使用資訊以鑑別資源與估計風險，以定性或定量之方式計算風險值。"},{"id":"G1-043","i":"m5","s":"G","q":"若公司為資訊資產購買保險，當資訊安全事件發生時，所造成的損失由保險公司理賠，此種風險處置策略屬於下列何者？","o":["風險接受","風險降低","風險移轉","風險避免"],"a":2,"e":"風險分攤（Share Risk）或風險轉移：將風險分攤到其他可以更有效管理該風險的另一方，例如：分攤的作法可藉由支援後果的保險（保險公司）。"},{"id":"G1-044","i":"m5","s":"G","q":"關於風險改善計畫，下列敘述何者較「不」正確？","o":["風險改善計畫不可變更","風險改善計畫應有期限","風險改善計畫完成後，應評估成效","風險改善計畫應針對超過可接受風險項目進行處置"],"a":0,"e":"風險改善計畫得視實際狀況討論後進行變更。"},{"id":"G1-045","i":"m5","s":"G","q":"某公司之風險評鑑發現，公司全球網站設置於內部網路，將增加外部入侵內部網路的風險，下列何者是「迴避」（Avoid）上述風險的作法？","o":["將網站改設置於公司內防火牆的非交戰區（Demilitarized zone, DMZ）","將網站改設置於外部租用空間","增設網路監控設施，加強入侵監控機制","將網站設置於內部獨立網段"],"a":1,"e":"將網站設置於外部空間，透過網站入侵內網的風險即不存在。其他選項皆為風險控制的方法。"},{"id":"G1-046","i":"m5","s":"G","q":"關於風險規避（RiskAvoidance），下列敘述何者「不」正確？","o":["決定不涉入風險處境","決定退出風險處境","通常不考量主管機關的影響，而會有躲避風險的傾向","會造成不願面對風險或淡化處理風險所需要的成本"],"a":2,"e":"停止產生風險的活動來避免風險，例如：從既有活動退出，或變更活動的運作狀況，像是在成本效益下重新設計以避免風險。"},{"id":"G1-047","i":"m5","s":"G","q":"關於風險評鑑管理程序，下列敘述何者不正確？","o":["建立全景係界定風險評鑑範圍","詳細風險評鑑包括風險識別、風險分析與風險評估","風險處理若合意，則進入風險接受階段","風險評鑑若不合意，則進入風險溝通階段"],"a":3,"e":"風險評鑑若不合意，則回到建立全景階段。"},{"id":"G1-048","i":"m5","s":"G","q":"公司機房重地購買地震保險或者火險，是下列哪一個風險處理措施？","o":["接受風險","規避風險","降低風險","轉移風險"],"a":3,"e":"風險分攤（Share Risk）或風險轉移：將風險分攤到其他可以更有效管理該風險的另一方，例如：分攤的作法可藉由支援後果的保險（保險公司）。"},{"id":"G1-049","i":"m5","s":"G","q":"關於風險評鑑與風險處理，下列敘述何者正確？","o":["經過風險評鑑，低風險或處理成本過高的風險項目，可能會被組織選擇接受","風險評鑑可以百分百找出可能的風險項目，並且進行風險處置","風險處理可以百分百消除風險項目，確保資訊安全","風險處理後，組織就不再需要進行風險評鑑作業"],"a":0,"e":"經過風險評鑑，低風險或處理成本過高的風險項目，可能會被組織選擇接受。"},{"id":"G1-050","i":"m5","s":"G","q":"某公司的派工系統，原先未在高風險資產項目中，但近一年來接連遇到幾次服務中斷事件，造成極大的損失，若要重新檢視該公司資產風險評鑑要素，下列何者「不」是適當的考量項目？","o":["資訊資產重要性","資訊資產威脅","資訊資產殘值","資訊資產脆弱點"],"a":2,"e":"資訊資產殘值不為資產風險評鑑考量項目。"},{"id":"G1-051","i":"m6","s":"G","q":"關於最小權限原則，下列敘述何者「不」正確？","o":["最小權限原則指的是使用者的權限，不包含系統程序的權限","最小權限原則的核心是，僅提供執行任務所需的最小權限","最小權限原則可以避免被濫用或是盜用時造成的破壞","最小權限原則為計算機領域專有名詞之一"],"a":0,"e":"最小權限原則指的是使用者的權限，包含系統程序的權限。"},{"id":"G1-052","i":"m6","s":"G","q":"關於驗證（Authentication）與授權（Authorization），下列敘述何者正確？","o":["輸入帳號密碼是屬於 Authorization","CEO 可調閱資料是屬於 Authorization","使用者輸入 MFA Token 是屬於 Authorization","警察將嫌犯扣留 72 小時是屬於 Authentication"],"a":1,"e":"授權 (Authorization)：經適當授權而獲得存取的能力"},{"id":"G1-053","i":"m6","s":"G","q":"下列何者「不」是 AAA？","o":["Authentication","Authorization","Availability","Accounting"],"a":2,"e":"AAA 包含「Authentication」、「Authorization」、「Accounting」"},{"id":"G1-054","i":"m6","s":"G","q":"關於存取控制需求的申請及審核，下列敘述何者「不」正確？","o":["需要申請及審核機制","應定期檢視申請內容與當前需求是否一致","申請人主管審核通過即可逕行設定","組織應制定政策規範，使管理人員有所依循"],"a":2,"e":"存取控制需求的申請及審核需依照公司申請及審核機制。"},{"id":"G1-055","i":"m6","s":"G","q":"關於存取控制，下列敘述何者較「不」適當？","o":["使用防火牆區隔內外網路，將公司對外全球網站放置於 DMZ 區（Demilitarized zone），並關閉非必要的連接埠","使用網段區隔技術，隔離敏感系統、重要機密的工作群組以及各類別的職務群組，但為了通聯及工作的便利性，內部網路各網段應直接互相通聯","機密檔案加密系統的使用者依不同的工作性質設定群組權限，非該群組成員無法開啟其加密檔案","重要系統設定其使用者超過一段時間未動作即會自動登出"],"a":1,"e":"使用網段區隔技術，隔離敏感系統、重要機密的工作群組以及各類別的職務群組，但為了通聯及工作的便利性，內部網路各網段「不」應直接互相通聯"},{"id":"G1-056","i":"m6","s":"G","q":"關於自然人憑證，下列敘述何者「不」正確？","o":["自然人憑證是基於 PKI（Public Key Infrastructure）架構下之應用","自然人憑證在網路上使用時，其代表申請人之身分識別上具有法律效力","自然人憑證申請一次永久有效，無需換發","自然人憑證於網路上的相關應用具有不可否認性"],"a":2,"e":"自然人憑證需定期換發。"},{"id":"G1-057","i":"m6","s":"G","q":"下列何者「不」是單一登入（Single Sign-On, SSO）的優點？","o":["集中權限控管","降低不同的帳號密碼記憶的困擾","減少重新輸入密碼的程序","簡訊認證"],"a":3,"e":"SSO 優點不包含簡訊認證。"},{"id":"G1-058","i":"m6","s":"G","q":"關於特權管理，下列敘述何者較正確？","o":["管理者登入主機應該使用 Administrator or Root 帳號，以利管理權限之使用","資料庫管理員可利用管理者帳號備份資料外，還可以讀取資料及調校資料庫效能","基於代理人機制，系統管理員除了網路管理帳號外，也需主機管理者權限","應該定期審查特權帳號，若有人員離職也須立即審查相關系統帳號之使用"],"a":3,"e":"應該定期審查特權帳號，若有人員離職也須立即審查相關系統帳號之使用。"},{"id":"G1-059","i":"m6","s":"G","q":"如果運用「生物特徵」來做身分認證時，儀器的最佳靈敏度必須調整在「誤殺」與「誤放」兩條曲線的交叉點，這個點的錯誤率被稱為？","o":["位元錯誤率（Bit Error Rate）","封包錯誤率（Packet Error Rate）","測試錯誤率（Test Error Rate）","交點錯誤率（Crossover Error Rate）"],"a":3,"e":"生物特徵來做身分認證時，儀器的最佳靈敏度在「誤殺」與「誤放」兩條曲線的交叉點稱為交點錯誤率。"},{"id":"G1-060","i":"m6","s":"G","q":"下列關於身分認證及權限管理的敘述，何者較「不」恰當？","o":["使用者應妥善保管 IC 卡，不可任意外借他人使用","不定期清查帳號與權限","任何使用者均需輸入帳號及密碼，以進行使用者身分鑑別","專案或工作結束時，應刪除與系統營運或維護無關之帳號"],"a":1,"e":"需定期及不定期清查帳號與權限。"},{"id":"G1-061","i":"m7","s":"G","q":"關於金鑰與憑證管理，下列敘述何者「不」正確？","o":["金鑰都應受保護不被修改和破壞，並應使用實體安全來保護用於產生、儲存和歸檔金鑰的設備，以避免金鑰遭受不當修改、不慎遺失或銷毀等情況","基於業務需要，須自行建置、委託建置或選用憑證機構（CertificateAuthority）時，應綜合考量憑證機構之技術、管理、人員及財務的安全風險等","憑證機構資訊系統（含應用系統、密碼模組等）之安全驗證，應遵照權責主管機關訂定之規範作業，以確保其安全性","憑證機構使用之電子簽章或加密金鑰長度，視系統的安全需求，由組織自行決定"],"a":3,"e":"憑證機構使用之電子簽章或加密金鑰長度，視系統的安全需求，由組織決定使用之加密技術而定。"},{"id":"G1-062","i":"m7","s":"G","q":"密碼學常被認為是提供數位身分認證的基礎，請問一套加密系統「不」包含下列何者？","o":["明文","暴力破解機制","加密演算法","密文"],"a":1,"e":"加密系統包含明文、密文、加密演算法。"},{"id":"G1-063","i":"m7","s":"G","q":"某銀行近日疑似遭遇駭客以彩虹表（Rainbow Table）攻擊法破解內部伺服器的密碼系統，為了能夠抵擋類似的攻擊手法再度發生，請問銀行的內部密碼系統該如何因應？","o":["更換加密雜湊演算法","制定更嚴謹的密碼政策","啟用密碼鎖定原則","使用加鹽的金鑰延伸函式（Key Derivation Function with a Salt）"],"a":3,"e":"使用加鹽的金鑰延伸函式可避免彩虹表（Rainbow Table）攻擊法。"},{"id":"G1-064","i":"m7","s":"G","q":"下列何種加密技術，屬於「非對稱式金鑰加密技術」？","o":["國際資料加密演算法（ International Data Encryption Algorithm, IDEA）","進階加密標準（Advanced Encryption Standard, AES）","資料加密標準（Data Encryption Standard, DES）","橢圓曲線密碼學（Elliptic Curve Cryptography, ECC）"],"a":3,"e":"橢圓曲線密碼學屬於非對稱式金鑰加密技術。"},{"id":"G1-065","i":"m7","s":"G","q":"關於數位簽章（Digital Signature）及數位信封（Digital Envelope），下列敘述何者正確？","o":["數位簽章與數位信箱皆運用雜湊函式（Hash Function）達成效果","數位簽章主要是將訊息摘要加密後運用對稱金鑰加密","數位信封將資料以對稱金鑰加密，再將金鑰透過公開金鑰加密技術傳輸供收訊方解密","數位簽章及數位信封技術在訊息傳遞時皆已加密訊息"],"a":2,"e":"數位信封將資料以對稱金鑰加密，再將金鑰透過公開金鑰加密技術傳輸供收訊方解密。"},{"id":"G1-066","i":"m7","s":"G","q":"請問下列何者「不是」對稱式加密？","o":["DES（Data Encryption Standard）","3DES （Triple DES）","ECC（Elliptic Curve Cryptography）","RC6（Rivest cipher 6）"],"a":2,"e":"橢圓曲線密碼學（ECC）屬於非對稱式金鑰加密技術"},{"id":"G1-067","i":"m7","s":"G","q":"關於「對稱式金鑰加密」與「非對稱金鑰加密」，下列敘述何者「不」正確？","o":["「非對稱金鑰加密」在加解密使用不同金鑰","「對稱金鑰加密」在金鑰洩露後，其加密效果即時失效","「非對稱金鑰加密」的特性，可以實作數位簽章（Digital Signature）","「非對稱金鑰加密」的計算，效能比「對稱金鑰加密」佳"],"a":3,"e":"對稱式效能較佳"},{"id":"G1-068","i":"m7","s":"G","q":"關於數位簽章（Digital Signature），下列敘述何者「不」正確？","o":["使用了公開金鑰基礎建設（Public Key Infrastructure, PKI）","簽章時用公鑰（Public Key）加密","公鑰（Public key）必須向接受者信任的數位憑證認證機構（Certificate Authority, CA）註冊","可以用 ElGamal 演算法來實做數位簽章"],"a":1,"e":"通常會使用公鑰加密，用私鑰解密。而在數位簽章中，會使用私鑰加密（相當於生成簽名），公鑰解密（相當於驗證簽名）。"},{"id":"G1-069","i":"m7","s":"G","q":"若明文為「WE ARE DISCOVERED FLEE AT ONCE」，使用凱撒密碼偏移量為 6，請問密文為下列何者？","o":["CKGXK JOYIU BKXKJ LRKKG ZUTIK","IQMDQ PUEOA HQDQP RXQQM FAZOQ","OWSJW VAKUG NWJWV XDWWS LGFUW","UCYPC BGQAM TCPCB DJCCY RMLAC"],"a":0,"e":"CKGXK JOYIU BKXKJ LRKKG ZUTIK"},{"id":"G1-070","i":"m7","s":"G","q":"下列敘述何者「不」正確？","o":["公私鑰加解密演算法使用「公鑰加密」與「私鑰解密」","數位簽章的時候，傳送端使用自己的公鑰製作簽章，接收端使用傳送端的私鑰驗證簽章","公鑰加密系統是多人都可以拿公鑰加密，但是只有一個人可以拿私鑰解密","數位簽章系統是只有一個人可以拿私鑰製作簽章，但是多人都可以拿公鑰驗證簽章"],"a":1,"e":"通常會使用公鑰加密，用私鑰解密。而在數位簽章中，會使用私鑰加密（相當於生成簽名），公鑰解密（相當於驗證簽名）。"},{"id":"G1-071","i":"m8","s":"G","q":"關於資安事件發生時的應變，下列敘述何者較「不」正確？","o":["疑似病毒入侵時，應優先拔除網路線，避免病毒擴散","遭受天然災害時（如：地震、火災），應在有限範圍內攜帶重要資料離開現場","事件發生的第一時間，不需浪費時間進行判斷，應立刻採取行動","應保留事件發生的所有證據，以利後續分析"],"a":2,"e":"事件發生的第一時間，需進行判斷後立刻採取行動。"},{"id":"G1-072","i":"m8","s":"G","q":"若公司電腦檔案被勒索軟體加密，下列何者「不」是正常應變處置程序？","o":["斷網降低網路擴散之風險，並且進行鑑識追蹤感染來源","清查是否有相關版本的備份，或是從受保護安全區取回檔案","交付比特幣贖金以加速檔案解密","必須依據資安通報流程進行通報"],"a":2,"e":"相關檔案無備份，私自交付比特幣贖金進行檔案解密，無法保證解密且會助長犯罪。"},{"id":"G1-073","i":"m8","s":"G","q":"關於資安事故（Security Incident），下列敘述何者「不」正確？","o":["指已經造成服務或營運中斷之資安事件（Security Event）","指極可能造成服務或營運中斷之資安事件（Security Event）","當造成中斷過久時，需啟動營運持續計畫","通常會先觀察，暫不處理"],"a":3,"e":"通常會先觀察後處理。"},{"id":"G1-074","i":"m8","s":"G","q":"某公司遭駭客針對網站伺服器傳送大量特定封包而導致網站癱瘓，造成資訊系統部分功能降低或喪失，此稱為下列何者？","o":["資訊安全事件（Event）","資訊安全事故（Incident）","資訊安全風險（Risk）","資訊安全分析（Analysis）"],"a":1,"e":"ISO 27001:2013 A.16 資訊安全事故管理"},{"id":"G1-075","i":"m8","s":"G","q":"「為了分析資安事件的根本原因，會利用有價值的網路、資料、電腦系統，故意設置了脆弱性的伺服主機，用來吸引駭客攻擊, 用來暸解其入侵技術及行為模式」，此稱為下列何者？","o":["多層次防禦（Layered Defense）","蜜罐（Honeypot）","滲透測試（Penetration Test）","黑箱測試（Black-Box Testing）"],"a":1,"e":"蜜罐（Honeypot）：通常偽裝成看似有利用價值的網路、資料、電腦系統，並故意設定了 bug，用來吸引駭客攻擊。由於蜜罐事實上並未對網路提供任何有價值的服務，所以任何對蜜罐的嘗試都是可疑的。蜜罐中還可能裝有監控軟體，用以監視駭客入侵後的舉動。"},{"id":"G1-076","i":"m8","s":"G","q":"下列何者可從多種資料來源中即時收集或從歷史資安事件分析而產生的威脅偵測及資安事故應變，同時也提供合適的報表以及歷史資安事故的分析？","o":["安全資訊與事件管理（ Security Information & Event Management, SIEM）","入侵偵測系統（Intrusion Detection Systems, IDS）","入侵預防系統（Intrusion Prevention Systems, IPS）","網頁應用防火牆（Web Application Firewall, WAF）"],"a":0,"e":"安全資訊與事件管理即時收集或從歷史資安事件分析而產生的威脅偵測及資安事故應變，同時也提供合適的報表以及歷史資安事故的分析。"},{"id":"G1-077","i":"m8","s":"G","q":"關於資安事件發生時的緊急應變措施，下列敘述何者不正確？","o":["依訂定之緊急應變計畫，實施緊急應變處置，並持續監控與追蹤管制","一定要緊急關閉電腦防止資安事件發生","視資安事件損壞程度啟動備援計畫、異地備援或備援中心等應變措施，以防止事件擴大","評估資安事件對業務運作造成之衝擊，並進行損害管制"],"a":1,"e":"緊急關閉電腦防止資安事件發生，可能造成證據遺失。"},{"id":"G1-078","i":"m8","s":"G","q":"某公司規定重要系統與資料，在發生重大災難時，也不能發生過長營運中斷或是資料的遺失，當該公司建置異地備援中心時，下列何者「最」能符合上述要求？","o":["熱備援（Hot Backup Site）","暖備援（Warm Backup Site）","冷備援（Cold Backup Site）","無需建置備援中心"],"a":0,"e":"熱備援指在異地的備援中心擁有專屬的電腦設備，除了將關鍵業務系統建立完整的備援（mirroring）外，資料也有即時的同步或備份。當日常運作環境發生災難事件時，備援系統可以立即接管、銜接，同時資料不會有遺失的現象。"},{"id":"G1-079","i":"m8","s":"G","q":"資安事件緊急應變處置最重要目的為下列何者？","o":["用防火牆或 WAF 做偵測跟阻擋","採用弱掃工具或滲透測試服務驗證是否完成修補","控制受害範圍","立即使用資料復原即可"],"a":2,"e":"緊急應變處置最重要目的為控制受害範圍，避免擴散。"},{"id":"G1-080","i":"m8","s":"G","q":"公司收到主管機關要求，必須每年進行網路資安健檢，下列何種處理較「不」符合？","o":["遠端網路弱點掃描（Network Vulnerability Assessment）","遠端滲透測試（Penetration Testing）","到場網頁應用程式弱點掃描（ Web Vulnerability Assessment）","到場網路安全備援服務"],"a":3,"e":"到場網路安全備援服務不為資安健診項目。"},{"id":"G1-081","i":"m9","s":"G","q":"關於災難復原計畫之目的，下列敘述何者「不」正確？","o":["將災難造成的影響減少至最小程度","分析災難、安全缺失和服務損失的後果","採取必要的措施來確保業務能正常執行","回復資訊的完整，並確保資訊系統正常運作"],"a":1,"e":"災難復原計畫之目的包含將災難造成的影響減少至最小程度、採取必要的措施來確保業務能正常執行及回復資訊的完整，並確保資訊系統正常運作。"},{"id":"G1-082","i":"m9","s":"G","q":"關於營運測試計畫，下列敘述何者正確？","o":["平行測試：在實際作業環境中進行測試","完全中斷測試：於備援平台上進行測試","模擬測試：建立模擬環境並於其中測試","結構化排練測試：權責單位各自討論處理方式與可行性"],"a":2,"e":"模擬測試：建立模擬環境並於其中測試。"},{"id":"G1-083","i":"m9","s":"G","q":"下列何者「不」屬於復原程序之項目？","o":["於備援設備中安裝作業系統與應用程式","於復原系統重新載入備份資料","復原系統上線後重新評估災害發生風險","測試復原系統之功能是否正常"],"a":2,"e":"復原系統上線後重新評估災害發生風險不屬於復原程序。"},{"id":"G1-084","i":"m9","s":"G","q":"關於營運持續計畫之目的，下列敘述何者「不」正確？","o":["營運持續計畫一套基於業務運行規律的管理要求和規範流程","業務持續性是指企業有應對風險、自動調整和快速反應的能力","將災難造成的影響減少至最小程度，確保業務流程能及時地繼續運行","制訂和實施應變計畫，確保在要求的時間內恢復業務流程"],"a":2,"e":"營運持續計畫為對抗營運活動可能的中斷，保護重要企業流程免受重大資訊系統失效或災害的影響，並確保流程的及時恢復，組織持續性。"},{"id":"G1-085","i":"m9","s":"G","q":"關於 RPO，下列敘述何者正確？","o":["可以忍受多久的業務中斷","資料回復的時間點與資料量無關","以可容許資料損失時間與資料量，進行備份計畫評估","RPO 投入資源越多，恢復越慢"],"a":2,"e":"當發生服務中斷時，資料可能產生遺失，RPO 代表可以接受的資料遺失狀況。"},{"id":"G1-086","i":"m9","s":"G","q":"若固定每星期日執行一次完整備份（Full Backup），之後每天會備份從上次完整備份到目前所異動的內容，此現象稱為下列何者？","o":["差異備份（Differential Backup）","增量備份（Incremental Backup）","循環備份（Circulatory Backup）","緊急備份（Emergency Backup）"],"a":0,"e":"差異備份（Differential Backup）：差異備份提供執行完整備份後變更的檔案的備份。"},{"id":"G1-087","i":"m9","s":"G","q":"在進行營運持續規劃時，若評估發現公司資料遺失之最大可接受程度為 10 分鐘內，應考慮下列何者？","o":["恢復點目標（Recovery Point Objective, RPO）","恢復時間目標（Recovery Time Objective, RTO）","工作恢復時間（Work Recovery Time, WRT）","最大可容忍中斷時間（ Maximum Tolerable Period of Disruption, MTPD）"],"a":0,"e":"當發生服務中斷時，資料可能產生遺失，RPO 代表可以接受的資料遺失狀況。"},{"id":"G1-088","i":"m9","s":"G","q":"您是資安專家，希望能估計營運可承受之最長中斷時間（Maximum Tolerable Period of Disruption），而您最有可能從下列何者取得？","o":["平衡計分卡（Balanced Score Card）","風險評鑑（Risk Assessment）","恢復點目標（Recovery Point Objective）","營運衝擊分析（Business Impact Analysis）"],"a":3,"e":"營運衝擊分析包含營運可承受之最長中斷時間（Maximum Tolerable Period of Disruption）。"},{"id":"G1-089","i":"m9","s":"G","q":"關於資料復原點的目標（Recovery Point Objective），下列敘述何者正確？","o":["系統硬碟所儲存的資料量","系統進行備份所需要的時間","在災害發生之後，預計要將資料復原到特定的某一時間","在災害發生之後，預計資料無法回復的時間"],"a":2,"e":"當發生服務中斷時，資料可能產生遺失，RPO 代表可以接受的資料遺失狀況。"},{"id":"G1-090","i":"m9","s":"G","q":"組織要如何確認營運持續計畫的有效性？","o":["以文件化方式呈現","進行營運持續演練","指派一位同仁負責計畫的撰寫","指派一組同仁負責計畫的撰寫"],"a":1,"e":"進行營運持續演練確認營運持續計畫的有效性。"},{"id":"G2-091","i":"t1","s":"G","q":"關於安全管控，下列何者較「不」安全？","o":["定期檢視網路架構","定期針對重要設備進行設定檔備份","針對網路設備之存取不限制存取來源 IP","建立防火牆連線規則管理政策"],"a":2,"e":"針對網路設備之存取「宜」限制存取來源 IP。"},{"id":"G2-092","i":"t1","s":"G","q":"關於網路型入侵偵測系統（Network-based IDS），下列敘述何者正確？","o":["安裝後對於網路流量的影響很大","只要安裝網路型入侵偵測系統即可以保護所有電腦不被入侵","資料來源是作業系統、應用程式或網路登入/登出紀錄（Log）","如果流量（Traffic）太高，可能會影響偵測攻擊準確度"],"a":3,"e":"如果流量（Traffic）太高，可能會影響偵測攻擊準確度。"},{"id":"G2-093","i":"t1","s":"G","q":"請問下列何者攻擊手法比較容易被採用來執行分散式服務阻斷（DDoS）攻擊？","o":["UDP 封包攻擊","TCP 封包攻擊","HTTP 封包攻擊","SQL 封包攻擊"],"a":0,"e":"UDP（使用者資料報協定）是一種無連接協定，當封包通過 UDP 傳送時，所有的封包在傳送和接收時不需要進行握手驗證。當大量 UDP 封包傳送給受害系統時，可能會導致頻寬飽和從而使得合法服務無法請求存取受害系統。"},{"id":"G2-094","i":"t1","s":"G","q":"在網頁登入時，常常在帳號密碼輸入的欄位之下，還要求如下圖所示輸入其他驗證資訊，其請問此機制為下列何者？","o":["詢問握手認證協議（Challenge-Handshake Authentication Protocol, CHAP）","晶片卡驗證（Smart Card Authentication）","全自動區分電腦和人類的公開圖靈測試（Completely Automated Public Turing test to tell Computers and Humans Apart, CAPTCHA）","簡訊服務驗證（SMS Authentication）"],"a":2,"e":"在 CAPTCHA 測試中，作為伺服器的電腦會自動生成一個問題由使用者來解答。這個問題可以由電腦生成並評判，但是必須只有人類才能解答。由於機器無法解答 CAPTCHA 的問題，回答出問題的使用者即可視為人類。","f":"captcha"},{"id":"G2-095","i":"t1","s":"G","q":"關於網路位址轉換（Network address translation , NAT），下列敘述何者「不」正確？","o":["可減少公有 IP（Public IP）位址使用數量","可隱藏内部 IP 位址","可防止暴力攻擊（Brute-Force Attack）","内部網路中, 使用私有 IP 位址（Private IP）"],"a":2,"e":"網路位址轉換不可防止暴力攻擊。"},{"id":"G2-096","i":"t1","s":"G","q":"下列 IP 地址何者是私有網路位址（Private IP）？","o":["1.1.1.1","8.8.8.8","9.9.9.9","10.10.10.10"],"a":3,"e":"10.10.10.10 是私有網路位址。"},{"id":"G2-097","i":"t1","s":"G","q":"關於防火牆規則管理，下列敘述何者「不」正確？","o":["安全性規則的數量會影響防火牆的效能","防火牆管理員應制定一套開放標準讓大家遵從，以避免每個人的管理模式不同，導致防火牆規則難管理","防火牆設定無需訂定管理辦法，只要管理員熟悉設備即可","防火牆開放方式最好使用白名單開放，較黑名單安全"],"a":2,"e":"防火牆設定需訂定管理辦法。"},{"id":"G2-098","i":"t1","s":"G","q":"關於狀態檢視防火牆，下列敘述何者「不」正確？","o":["狀態檢視防火牆所看的內容較封包過濾防火牆少","狀態檢視防火牆可以根據目的埠號做阻擋","狀態檢視防火牆可以根據目的位址做阻擋","狀態檢視防火牆會紀錄連線狀態"],"a":0,"e":"狀態檢視防火牆所看的內容較封包過濾防火牆多。"},{"id":"G2-099","i":"t1","s":"G","q":"關於代理防火牆，下列敘述何者「不」正確？","o":["使用者透過代理防火牆進入時，代理防火牆會開啟新連線，再將回覆回給使用者","駭客可能透過多層代理防火牆來隱匿其真實來源位址","代理防火牆設定上較複雜，需依照各種協定客製代理程式","代理防火牆運作於第四層網路層"],"a":3,"e":"應用層防火牆也稱為代理防火牆，這種防火牆在應用層運作，會檢查內部網路和流量來源之間的流量。"},{"id":"G2-100","i":"t1","s":"G","q":"請問下列何種攻擊方式的主要目的是為了讓使用者無法進行資料的存取？","o":["中間人攻擊（Man-in-the-Middle Attack）","SQL 資料隱碼攻擊（SQL Injection）","社交工程攻擊（Social Engineering）","阻斷服務攻擊（Denial-of-Service Attack）"],"a":3,"e":"阻斷服務攻擊的目的在於使目標電腦的網路或系統資源耗盡，使服務暫時中斷或停止，導致其正常使用者無法存取。"},{"id":"G2-101","i":"t2","s":"G","q":"請問 TCP/IP 通訊協定中之應用層是合併 OSI 參考模型的哪幾層？","o":["應用層、傳輸層、網路層","應用層、表達層、會議層","應用層、傳輸層、會議層","應用層、表達層、網路層"],"a":1,"e":"TCP/IP 通訊協定中之應用層是合併 OSI 應用層、表達層、會議層。"},{"id":"G2-102","i":"t2","s":"G","q":"下列何種應用服務會使用到 TCP 和 UDP 二種傳輸層協定？","o":["FTP","SMTP","Telnet","DNS"],"a":3,"e":"DNS 使用到 TCP 和 UDP 二種傳輸層協定。"},{"id":"G2-103","i":"t2","s":"G","q":"交換器在何種情況下會將一個訊框（Frame）溢送（Flood）到所有交換器的端口？","o":["當來源的 MAC 位址並未在交換器的 MAC 位址表格內","當目的的 MAC 位址並未在交換器的 MAC 位址表格內","當目的的 MAC 位址是多點傳送（Multicast）位址","當目的的 MAC 位址是 00-00-00-00-00-00"],"a":1,"e":"當目的的 MAC 位址並未在交換器的 MAC 位址表格內。"},{"id":"G2-104","i":"t2","s":"G","q":"「虛擬私有網路（VPN）」是利用什麼技術來建立安全通訊連線？","o":["通道（Tunnel）技術","資料壓縮技術","調變與解調變技術","無線通訊技術"],"a":0,"e":"VPN 用戶端使用通道通訊協定（Tunneling Protocol）的特殊 TCP/IP 通訊協定，在兩部電腦之間建立用來傳送資料的安全通道。"},{"id":"G2-105","i":"t2","s":"G","q":"下列哪一層的協定，負責在 TCP/IP 通訊協定中，提供定址與路由之任務？","o":["應用層","表達層","傳輸層","網路層"],"a":3,"e":"網路層負責在 TCP/IP 通訊協定中，提供定址與路由之任務。"},{"id":"G2-106","i":"t2","s":"G","q":"TCP/IP 通訊協定中稱為網路介面層，負責與硬體溝通的是下列何者？","o":["應用層（Application Layer）","傳輸層（Transport Layer）","連結層（Link Layer）","網路層（Network Layer）"],"a":2,"e":"連結層負責與硬體溝通。"},{"id":"G2-107","i":"t2","s":"G","q":"關於 TCP 三項交握流程，下列敘述何者「不」正確？","o":["第一步驟 Client 先發 SYN 給 Server","第二步驟 Server 回給 Client SYN+ACK","第三步驟 Client 再回 SYN 給 Server，之後連線建立","TCP 三項交握僅有 TCP 會使用，UDP 並無交握流程"],"a":2,"e":"第三步驟 Client 再回 ACK 給 Server，之後連線建立。"},{"id":"G2-108","i":"t2","s":"G","q":"關於 TCP 連接狀態，下列敘述何者「不」正確？","o":["SYN-SENT ： Client 送往 Server 的第一個要求連線封包（已送出 SYN，在等待對方回覆的期間）","SYN-RECEIVED：Server 收到 Client 的連線後，回覆給 Client SYN+ACK，並且等待 Client 回覆 ACK","ESTABLISHED：Client 回覆 ACK 後，Client 及 Server 均進入 Established 狀態，雙方可以正常傳輸，TCP 三項交握已完成","CLOSE-WAIT：被動關閉方收到 FIN 後發出 SYN+ACK 時，會進入這個狀態，此時可以傳輸資料，也可以接收資料"],"a":3,"e":"等待從本地使用者發來的連線中斷請求，被動關閉端 TCP 接到 FIN 後，就發出 ACK 以迴應 FIN 請求（它的接收也作為檔案結束符傳遞給上層應用程式），並進入 CLOSE_WAIT。"},{"id":"G2-109","i":"t2","s":"G","q":"關於 SSL 與 TLS，下列敘述何者較「不」正確？","o":["TLS 是 SSL 的後續版本","兩者都是加密協議，用於從客戶端到伺服器、電腦或應用程式數據傳輸的加密和驗證","HTTPS 結合了處理資料傳輸的 HTTP 和處理資料加密的 SSL/TLS","TLS 3.0 是目前資料進行傳輸過程中, 大多數設備和瀏覽器所支援的"],"a":3,"e":"目前最新版本為 TSL 1.3，而 TLS 1.2 是目前資料進行傳輸過程中，大多數設備和瀏覽器所支援的。"},{"id":"G2-110","i":"t2","s":"G","q":"關於 IPSec，下列敘述何者較「不」正確？","o":["IPSec 是 IP Security 的縮寫，是運用在網路層的保護機制","IPSec 提供資料加密（Data Confidentiality）、資料完整性（Data Integrity）、以及身份認證（Authentication）","IPSec 將整個封包（IP 標頭和資料本身）進行加密保護","IPSec 重新封裝後的封包可以正確的在既有網路上傳送，不會因為標頭被更改而受到影響"],"a":2,"e":"IPSec 只對資料本身（Payload）進行加密保護"},{"id":"G2-111","i":"t3","s":"G","q":"下列何者「不」屬於作業系統主要的功能？","o":["做為使用者之介面","分配與管理系統資源","提供系統服務與保護","提供影像處理服務"],"a":3,"e":"影像處理服務不屬於一般作業系統應具之主要功能。"},{"id":"G2-112","i":"t3","s":"G","q":"關於 EternalBlue 弱點，請問是基於下列何者機制所產生的？","o":["Windows SMB","Windows Kerberos","Windows RDP","Windows UAC"],"a":0,"e":"EternalBlue 弱點利用 Windows SMB 所產生。"},{"id":"G2-113","i":"t3","s":"G","q":"下列何者「不」是 UTM（Unified Threat Management）整合式威脅管理設備的常見功能？","o":["啟用 IPS（Intrusion Prevention System）入侵偵測防禦功能，防禦異常的網路攻擊封包","管理外網與內網的各子網段交換路由","以 IPSec 通訊協定建立加密傳輸路由","使用 Honeypot 誘捕系統功能來蒐集與分析入侵威脅"],"a":3,"e":"UTM（Unified Threat Management）整合式威脅管理不包含設立 Honeypot。"},{"id":"G2-114","i":"t3","s":"G","q":"下列何項新廠區的網路規劃「不」屬於資安考量？","o":["安裝 3 台接取網路交換器並設定 3 個 VLANs 且分為 3 個子網段（subnet）供不同部門使用","使用 VPN 閘道器建立總廠與新廠的安全傳輸網路","在新生產線佈署工規交換器，並且設定獨立的 VLAN 與子網段連接 SCADA （ Supervisory Control and Data Acquisition）自動化生產與控制系統設備","建置網路路由器提供網路流量交換"],"a":3,"e":"建置網路路由器提供網路流量交換不屬於資安考量。"},{"id":"G2-115","i":"t3","s":"G","q":"下列敘述何者「不」正確？","o":["木馬後門程式常偽裝成提供便利或實用的免費軟體，吸引使用者下載使用","電腦病毒具有散播、隱藏、感染、潛伏及破壞等特性","阻絕服務攻擊（DoS）通常指攻擊者攔截通訊的資料，並讓資料最後傳送到錯誤的接收者","蠕蟲（Worm）會不斷複製，並利用網路感染其他主機"],"a":2,"e":"阻斷服務攻擊是一種網路攻擊手法，其目的在於使目標電腦的網路或系統資源耗盡，使服務暫時中斷或停止，導致其正常用戶無法存取。"},{"id":"G2-116","i":"t3","s":"G","q":"請問 cat ~/.bash_history 指令，是要執行下列何種功能？","o":["列出系統使用者","列出使用者曾經下過的指令","列出系統目錄","列出系統內的檔案"],"a":1,"e":"cat ~/.bash_history 指令執行下列列出使用者曾經下過的指令。"},{"id":"G2-117","i":"t3","s":"G","q":"請問下列何者「不」屬於預防（Preventive）性機制的安全管控機制？","o":["實施強制性密碼原則管理","安裝防毒軟體並啟動即時偵測","定期檢視安全記錄檔（Log）","定期套用安全性更新（Patch）"],"a":2,"e":"定期檢視安全記錄檔不屬於預防（Preventive）性機制的安全管控機制。"},{"id":"G2-118","i":"t3","s":"G","q":"若要安全傳送資料，達到只有接收方能開啟並確認內容未遭簒改，下列敘述何者正確？","o":["資料以雜湊（Hash）演算後，以接收方的公開金鑰（Public Key）加密後傳送","資料以雜湊（Hash）演算後，以傳送者的公開金鑰（Public Key）加密後傳送","資料以雜湊（Hash）演算後，以接收方的私密金鑰（Private Key）加密後傳送","資料以雜湊（Hash）演算後，以傳送者的私密金鑰（Private Key）加密後傳送"],"a":0,"e":"資料以雜湊（Hash）演算後，以接收方的公開金鑰（Public Key）加密後傳送。"},{"id":"G2-119","i":"t3","s":"G","q":"應用程式執行特定作業結束後，並沒有通知作業系統，故無法向作業系統要求釋放記憶體空間，此狀況稱為下列何者？","o":["記憶體暫存（Memory Register）","記憶體注入（Memory Injection）","記憶體映像（Memory Mapping）","記憶體洩漏（Memory Leaks）"],"a":3,"e":"記憶體洩漏將應用程式執行特定作業結束後，並沒有通知作業系統，故無法向作業系統要求釋放記憶體空間。"},{"id":"G2-120","i":"t3","s":"G","q":"關於 UAC（UserAccount Control），下列敘述何者「不」正確？","o":["保護或提醒管理員用戶免受軟體組件執行的惡意提權行為","系統管理員通常會以最大的使用者權限執行","通過限制應用軟體對系統層級的存取，從而改進 Windows 作業系統的安全性","設計概念為消除不必要的提高許可權"],"a":1,"e":"系統管理員通常會以最小的使用者權限執行。"},{"id":"G2-121","i":"t4","s":"G","q":"黑帽駭客（Black Hats）是指惡意攻擊電腦系統及網路的人，下列何者「不」是其行為？","o":["誘騙使用者上當並植入木馬程式","利用電腦裝置的漏洞進行入侵","通知網站客戶該網站有漏洞","釣魚式攻擊"],"a":2,"e":"通知網站客戶該網站有漏洞，不屬於惡意攻擊電腦系統及網路。"},{"id":"G2-122","i":"t4","s":"G","q":"規劃縱深防禦（Defense in Depth）時，我們常會採用多種不同面向的管控措施（Controls），下列何者屬於偵測手段（Deter） ？","o":["防火牆（Firewall）","入侵偵測防禦系統（IDS/IPS）","病毒與垃圾郵件過濾閘道系統","虛擬私有網路（VPN）"],"a":1,"e":"入侵檢測系統（Intrusion Detection System, IDS）是一種積極主動式的網路安全防護裝置或應用軟體，可以監控網路傳輸或者系統，檢查是否有可疑活動或者違反企業的政策。"},{"id":"G2-123","i":"t4","s":"G","q":"根據 Open WebApplications Security Project（OWASP）研究報告所指出網頁十大安全性弱點利用與攻擊中，為了防範常見的跨網站指令碼（Cross-Site Scripting, XSS）攻擊、注入式缺陷（Injection Flaw）攻擊和跨網站請求偽造（Cross-Site Request Forgery, CSRF）等攻擊，您應採用下列何種策略？","o":["整個網站均採用 TLS 傳輸","採用嚴謹的驗證方式","網頁程式中需做好輸入檢查工作","實施端點安全性檢查"],"a":2,"e":"網頁程式中需做好輸入檢查工作可防止跨網站指令碼（Cross-Site Scripting, XSS）攻擊、注入式缺陷（Injection Flaw）攻擊和跨網站請求偽造（Cross-Site Request Forgery, CSRF）等攻擊。"},{"id":"G2-124","i":"t4","s":"G","q":"使用者瀏覽網頁時，執行攻擊者插入到網頁中 HTML 或 Script 的指令，此為遭受到什麼攻擊？","o":["資料隱碼攻擊（SQL injection）","跨網站腳本攻擊（Cross-Site Scripting, XSS）","跨站請求偽造（Cross-Site Request Forgery, CSRF）","搜尋引擎攻擊（Google Hacking）"],"a":1,"e":"跨網站指令碼（英語：Cross-site scripting，通常簡稱為：XSS）是一種網站應用程式的安全漏洞攻擊，是代碼注入的一種。它允許惡意使用者將程式碼注入到網頁上，其他使用者在觀看網頁時就會受到影響。"},{"id":"G2-125","i":"t4","s":"G","q":"對於防禦資料隱碼攻擊（SQLInjection），下列何者較「無」效果？","o":["使用參數化語句","強化對輸入值的驗證","使用單一登入（Single sign-on），避免帳戶太多難以管理","區分資料庫使用者的用戶權限"],"a":2,"e":"使用單一登入對於防禦資料隱碼攻擊（SQL Injection）較無效果。"},{"id":"G2-126","i":"t4","s":"G","q":"請問，入侵步驟中的「提權（Privilege Escalation）」是指下列何者？","o":["提升使用者權限至系統管理權限","刪除入侵軌跡","刪除使用者帳號","找出具有最高權限的帳號"],"a":0,"e":"提權（Privilege Escalation）指提升使用者權限至系統管理權限。"},{"id":"G2-127","i":"t4","s":"G","q":"請問下列何者是密碼潑灑（Password Spraying）攻擊？","o":["蒐集常用的密碼，放入字典，嘗試登入系統","用單一弱密碼，嘗試登入系統","使用已外洩的帳號與密碼的各種組合，嘗試登入系統","使用可能各種密碼組合，嘗試登入系統"],"a":1,"e":"密碼潑灑（Password Spraying）攻擊指用單一弱密碼，嘗試登入系統"},{"id":"G2-128","i":"t4","s":"G","q":"關於 IP Spoofing，下列敘述何者最為正確？","o":["利用資料庫弱點冒用他人 IP","透過變造封包等手法，以偽冒他人的 IP","因為 IP 重複，導致系統錯誤","利用 IP 清單避免使用者遭受攻擊"],"a":1,"e":"在電腦網路裡面，IP 位址欺騙或 IP 欺騙是指帶有假的源 IP 位址的 IP 協議分組（數據報），目的是冒充另一個計算系統身份。"},{"id":"G2-129","i":"t4","s":"G","q":"關於 SYN Flood，下列敘述何者最為正確？","o":["大量送出 SYN 封包至目標","收到 SYN 封包後不回應","由於目標持續等待 SYN 封包導致資源耗盡","在 SYN 封包中帶入惡意指令進行攻擊"],"a":0,"e":"SYN flood 或稱 SYN 洪水、SYN 洪泛是一種阻斷服務攻擊，起因於攻擊者傳送大量的 SYN 請求到目標系統。"},{"id":"G2-130","i":"t4","s":"G","q":"下列何者是被 SQL 資料隱碼攻擊（SQLInjection）成功的原因？","o":["作業系統漏洞未即時更新修補程式（Patch）","未對使用者的輸入資料進行過濾與檢查","資料庫存取權限設定錯誤","遭受大量網路流量攻擊"],"a":1,"e":"未對使用者的輸入資料進行過濾與檢查易造成SQL 資料隱碼攻擊（SQL Injection）。"},{"id":"G2-131","i":"t5","s":"G","q":"下列何者「不」是 Source Code Review 軟體？","o":["FortifySCA","Checkmarx","BurpSuite","SonarQube"],"a":2,"e":"Burp 或 Burp Suite 是一個用於測試網絡應用程式安全性的圖形化工具。"},{"id":"G2-132","i":"t5","s":"G","q":"在軟體安全測試方法中，關於黑箱測試，下列敘述何者正確？","o":["更容易鑑別出軟體問題的根因。","更容易發現邏輯性缺失。","更容易鑑別出軟體部署後的問題。","可測試程式碼涵蓋範圍更大。"],"a":2,"e":"黑箱測試更容易鑑別出軟體部署後的問題。"},{"id":"G2-133","i":"t5","s":"G","q":"某網站在設計時進行過安全分析，也在開發時要求程序員編寫安全的代碼，但佈署時由於管理員將備份存放在 WEB 目錄下導致了攻擊者可直接下載備份，為了發現系統中是否存在其他類似問題，下列何種測試方式是最佳的測試方法？","o":["模糊測試","源碼測試","整合測試","滲透測試"],"a":3,"e":"滲透測試，是為了證明網路防禦按照預期計劃正常執行而提供的一種機制。"},{"id":"G2-134","i":"t5","s":"G","q":"全自動區分電腦和人類的公開圖靈測試（CAPTCHA），較能防護下列何種攻擊？","o":["資料隱碼攻擊（SQL Injection）","跨網站偽造請求（Cross-Site Request Forgery, CSRF）","跨站腳本攻擊（Cross-Site Scripting, XSS）","緩衝區溢位（Buffer Overflow）"],"a":1,"e":"全自動區分電腦和人類的公開圖靈測試（CAPTCHA）可防禦跨網站偽造請求（Cross-Site Request Forgery, CSRF）。"},{"id":"G2-135","i":"t5","s":"G","q":"若程式在源碼檢測時，發現存在可能遭受到有心人士的中間人攻擊（Man-in-the-Middle, MiTM）的漏洞，下列何者是此程式最可能的主要問題？","o":["無稽核（Lack of Auditing）","無憑證檢查（Lack of Certificate Verification）","無邊界檢查（Lack of Boundary Check)","無輸入驗證（Lack of Input Validation）"],"a":1,"e":"無憑證檢查可能遭受到有心人士的中間人攻擊（Man-in-the-Middle, MiTM）的漏洞。"},{"id":"G2-136","i":"t5","s":"G","q":"請問針對跨站請求偽造（Cross-Site Request Forgery, CSRF）攻擊，下列何種防禦方式最有效？","o":["輸入參數黑名單過濾（Black List）","輸入參數白名單過濾（White List）","輸入參數長度過濾（Length Filter）","使用全自動區分電腦和人類的公開圖靈測試（CAPTCHA）"],"a":3,"e":"全自動區分電腦和人類的公開圖靈測試（CAPTCHA）可防禦跨網站偽造請求（Cross-Site Request Forgery, CSRF）。"},{"id":"G2-137","i":"t5","s":"G","q":"下列何者「不」是因為開發過程中，未留意程式安全造成的問題？","o":["魚叉式網路釣魚（Spear Phishing）","SQL 資料隱碼攻擊（SQL Injection）","跨站指令碼攻擊（Cross-Site Scripting, XSS）","跨站請求偽造（Cross-Site Request Forgery, CSRF）"],"a":0,"e":"魚叉式網路釣魚係指針對特定目標進行攻擊的網路釣魚攻擊。"},{"id":"G2-138","i":"t5","s":"G","q":"在軟體開發生命週期（SDLC）中，修正軟體中同一個安全性問題，於下列何者階段的成本最高？","o":["設計階段","需求階段","產品階段","測試階段"],"a":2,"e":"在軟體開發生命週期（SDLC）中，修正軟體中同一個安全性問題，於產品階段的成本最高。"},{"id":"G2-139","i":"t5","s":"G","q":"關於系統開發測試中白箱測試與黑箱測試，下列敘述何者較「不」正確？","o":["白箱測試主要測試內部邏輯架構的正確性","黑箱測試主要運用機器掃描原始程式碼","滲透測試屬於黑箱測試","原碼掃描屬於白箱測試"],"a":1,"e":"機器掃描原始程式碼屬於白箱測試。"},{"id":"G2-140","i":"t5","s":"G","q":"關於應用系統安全部署，下列敘述何者較為正確？","o":["建立維護用後門","以最高權限執行軟體","移除除錯用的原始程式碼","開啟所有的底層服務"],"a":2,"e":"移除除錯用的原始程式碼屬於應用系統安全部署。"},{"id":"G2-141","i":"t6","s":"G","q":"在網站弱點檢測報告中，發現系統本身有存在 XSS 及 Open Redirect 問題，可以採取下列何者方案進行修補？","o":["XSS 可以透過過濾此符號”<”，即可根治","Open Redirect 可以採用圖像式驗證即可根治","HTML.Encode 是可以解決 XSS 的一種方法","採用 Prepared Statement 可以解決 XSS"],"a":2,"e":"避免 XSS 的方法之一主要是將使用者所提供的內容進行過濾，許多語言都有提供對 HTML 的過濾。"},{"id":"G2-142","i":"t6","s":"G","q":"下列何者「不」是在軟體逆向工程動態分析時，所會使用到的技巧？","o":["設定中斷點","顯示堆疊（stack）內容","單步執行","程式碼重構"],"a":3,"e":"程式碼重構不是在軟體逆向工程動態分析所使用到的技巧。"},{"id":"G2-143","i":"t6","s":"G","q":"關於防毒軟體（Antivirus），下列敘述何者較「不」正確？","o":["無法偵測所有攻擊","非 Windows 系統無需安裝防毒軟體","常使用特徵（Signature）比對來偵測惡意程式","可監視作業系統的可疑活動與應用程式的行為"],"a":1,"e":"非 Windows 系統也需安裝防毒軟體。"},{"id":"G2-144","i":"t6","s":"G","q":"系統人員通常無法立刻針對漏洞本身進行修補（Patch）的是屬於下列何種類型的漏洞？","o":["區域漏洞（Local Vulnerabilities）","稀疏漏洞（Sparse Vulnerabilities）","沙盒漏洞（Sandbox Vulnerabilities）","零時差漏洞（Zero-Day Vulnerabilities）"],"a":3,"e":"零時差漏洞通常是指還沒有修補程式的安全漏洞，而零時差攻擊則是指利用這種漏洞進行的攻擊。"},{"id":"G2-145","i":"t6","s":"G","q":"下列何者「不」是 SYN Flood 的防禦方式？","o":["利用防火牆阻擋所有 TCP 連線","增加 Backlog Queue 的數量","重置最舊的 Half-Open TCP 連線","使用 SYN Cookie"],"a":0,"e":"利用防火牆阻擋所有 TCP 連線不為 SYN Flood 的防禦方式。"},{"id":"G2-146","i":"t6","s":"G","q":"關於評估弱點，下列敘述何者正確？","o":["不同的弱點管理方式都可使用相同的風險評級對弱點進行評分","對弱點評分可協助組織提升在業界中的口碑","弱掃報告中的弱點評分可依據組織產業類型或性質重新給予評分","弱掃工具提供的報告結果準確性高，無需再對弱點進行評估"],"a":2,"e":"弱掃報告中的弱點評分可依據組織產業類型或性質重新給予評分。"},{"id":"G2-147","i":"t6","s":"G","q":"關於 Session Hijacking 的偵測與防禦，下列敘述何者「不」正確？","o":["實踐自動登出的功能也是 Session Hijacking 的其中一種防禦方式","防毒軟體對 Session Hijacking 也有部分功效","加密的連線可預防 Session Hijacking","IPS 只能偵測 Session Hijacking；IDS 則可偵測與防禦"],"a":3,"e":"IDS 只能偵測 Session Hijacking；IPS 則可偵測與防禦。"},{"id":"G2-148","i":"t6","s":"G","q":"下列何者「不」是進行中間人攻擊所採用的技巧？","o":["Clickjacking","Sniffing","Packet Injecting","Session Hijacking"],"a":0,"e":"Clickjacking 點擊劫持是一種在網頁中將惡意代碼隱藏在看似無害的內容之下，並誘使使用者點擊的手段。"},{"id":"G2-149","i":"t6","s":"G","q":"請問 CVE（Common Vulnerabilities and Exposures）是指？","o":["常見漏洞和風險編號","弱點種類","Exploit Code","漏洞修補建議"],"a":0,"e":"CVE 是指常見漏洞和風險編號。"},{"id":"G2-150","i":"t6","s":"G","q":"下列何種病毒會使用「不」同金鑰加密來改變自身外形？","o":["Polymorphism","Scripting viruses","Macro Viruses","Visual Basic Script"],"a":0,"e":"Polymorphism 每次繁殖會以不同的病毒碼呈現。"},{"id":"G2-151","i":"t7","s":"G","q":"只有在第一次備份時做完整備份，而之後每次備份時，只從上次備份至目前有改變的檔案進行備份。請問上述為何種備份方式？","o":["完整備份（Full Backup）","差異備份（Differential Backup）","增量備份（Incremental Backup）","選擇式備份（Selective Backup）"],"a":2,"e":"增量備份（Incremental Backup）為只有在第一次備份時做完整備份，而之後每次備份時，只從上次備份至目前有改變的檔案進行備份。"},{"id":"G2-152","i":"t7","s":"G","q":"關於資料備份之原則，下列敘述何者「不」正確？","o":["完整及正確之備份資料","備份資料時須注意實體安全","資料備份時應挑選未加密之資料進行備份","資料備份維持三代以上"],"a":2,"e":"完整及正確之備份資料。"},{"id":"G2-153","i":"t7","s":"G","q":"關於資料備份，下列敘述何者正確？","o":["為避免備份資料佔用儲存空間，僅需留存最新副本即可","資料庫叢集之抄寫功能（Replication），即為資料備份機制","備份資料還原測試應定期執行，確保副本資料正常留存","資料中心（IDC）進出管制嚴密，因此備份資料與來源資料存放於同地機房即可避免損毀"],"a":2,"e":"備份資料還原測試應定期執行，確保副本資料正常留存。"},{"id":"G2-154","i":"t7","s":"G","q":"下列何種議題「不」屬保護資料機密性的範圍？","o":["網站因 SQL Injection 弱點導致遭駭客取得員工資料","購物系統被駭客入侵，客戶資料外洩","訂票系統因大量會員同時登入，系統當機，無法提供服務","學校教學系統，遭人入侵，竄改學生分數"],"a":2,"e":"訂票系統因大量會員同時登入，系統當機，無法提供服務屬於可用性之範圍。"},{"id":"G2-155","i":"t7","s":"G","q":"為確保公司備份資料之完整性，下列何種處理方式最佳？","o":["加解密","身分驗證","雜湊計算","資訊隱藏"],"a":2,"e":"雜湊計算可確保公司備份資料之完整性。"},{"id":"G2-156","i":"t7","s":"G","q":"下列關於強化異地存放的備份資料的「可用性」的作法，何者較正確？","o":["將備份資料進行加密（Encrypt）","將備份資料進行雜湊（Hash）函數計算","將備份資料將備份資料進行定期回復（Restore）測試","將備份資料進行壓縮（Compress）"],"a":2,"e":"將備份資料進行定期回復（Restore）測試可強化異地存放的備份資料的「可用性」。"},{"id":"G2-157","i":"t7","s":"G","q":"某組織規劃了資料備份策略為週日進行完全備份，週一至週六進行「X」備份。若某日該組織週四因系統問題導致資料毀損，此時資料備份管理員之處理程序為先還原週日完全備份資料後，再依序將週一至週三所備份之資料還原，請問此「X」備份係指下列何者？","o":["完整備份","增量備份","巨量備份","差異備份"],"a":1,"e":"增量備份指對上一次完整備份或增量備份後更新的資料進行備份。"},{"id":"G2-158","i":"t7","s":"G","q":"若資料持續不斷增加，則差異備份、增量備份、完整備份三種備份方式的備份速度，由慢到快依次為下列何者？","o":["完整備份、差異備份、增量備份","差異備份、增量備份、完整備份","增量備份、差異備份、完整備份","完整備份、增量備份、差異備份"],"a":0,"e":"備份方式的備份速度，由慢到快依次為完整備份、差異備份、增量備份。"},{"id":"G2-159","i":"t7","s":"G","q":"在雜湊（Hash）之前將雜湊內容的任意固定位置插入特定的字串，此方式被稱為什麼？","o":["數位簽章（Digital Signature）","加鹽（Salt）","編碼（Encoding）","替換（Substitution）"],"a":1,"e":"加鹽係在雜湊（Hash）之前將雜湊內容的任意固定位置插入特定的字串。"},{"id":"G2-160","i":"t7","s":"G","q":"某公司的網站伺服器內，將五顆硬碟作 RAID 5，並且備份機制中規劃每週日 23:30 進行完整備份（Full Backup），其餘每天 23:30 進行差異備份（Differential Backup），若於某週三 23:00 時，伺服器其中一顆硬碟發生故障，請問應採取下列何種處理方式？","o":["上週五的 Full Backup 磁帶回存，再依序將週日、一、二的增量備份磁帶回存","將上週五的 Full Backup 磁帶回存，再將週二的備份磁帶回存","將上週三的磁帶回存","只需更換有問題的硬碟，重作 Rebuild"],"a":3,"e":"當 RAID 5 的一個磁碟資料發生損壞後，可以利用剩下的資料和相應的奇偶校驗資訊去恢復被損壞的資料。"},{"id":"G2-161","i":"t8","s":"G","q":"若某公司以 UDP port 514 的方式，遠端蒐集 Syslog 進行日誌留存，請問下列敘述何者最正確？","o":["遠端蒐集之日誌，無法作為有效證據","網路流量大時，有可能遺失封包（資料）","Syslog 無需考量加密即可保護資料傳輸之安全","遠端蒐集之日誌，存放時不應加密，以免破壞資料的正確性"],"a":1,"e":"在 TCP/IP 模型中，UDP 為網路層以上和應用層以下提供了一個簡單的介面。UDP 只提供資料的不可靠傳遞，它一旦把應用程式發給網路層的資料傳送出去，就不保留資料備份。"},{"id":"G2-162","i":"t8","s":"G","q":"關於 Syslog 日誌傳輸協議，下列敘述何者正確？","o":["為確保資料傳輸效率，僅能透過 UDP 協議使用","為確保資料正確性，僅能透過 TCP 協議使用","為確保資料機密性，可透過 TLS 協議進行加密傳輸","為確保資料機密性，日誌需先自行加密後再進行傳輸"],"a":2,"e":"業界大量使用之 Syslog 日誌傳輸協議為確保資料機密性，可透過 TLS 協議進行加密傳輸。"},{"id":"G2-163","i":"t8","s":"G","q":"在進行日誌分析前，通常會先將已收集的資料中，格式不正確或完整度不足的資料進行刪除或修正，這個動作我們一般稱之為？","o":["Data Collection","Data Profiling","Data Normalization","Data Cleaning"],"a":3,"e":"Data Cleaning 係指在進行日誌分析前，通常會先將已收集的資料中，格式不正確或完整度不足的資料進行刪除或修正。"},{"id":"G2-164","i":"t8","s":"G","q":"要求相關的資訊系統、網路設備須有一致性的同步時脈（鐘訊同步），其主要的目的為何？","o":["確保作業系統的機密性","防範資料的漏失","避免被分散式阻斷服務攻擊（DDoS）","確保稽核日誌的準確性，以便紀錄事件與生成證"],"a":3,"e":"鐘訊同步確保稽核日誌的準確性，以便紀錄事件與生成證據。"},{"id":"G2-165","i":"t8","s":"G","q":"為了分析集中收容的不同設備之日誌，常會發生不同設備之日誌格式、命名方式不同之分析難題，此時需要進行下列何種處理？","o":["去識別化（De-identification）","初始化（Initialization）","正規化（Normalization）","最佳化（Optimization）"],"a":2,"e":"正規化係為分析集中收容的不同設備之日誌，常會發生不同設備之日誌格式、命名方式不同之分析。"},{"id":"G2-166","i":"t8","s":"G","q":"請問「留存系統、網路日誌」是為了保護資訊安全的何種特性？","o":["機密性（Confidentiality）","可用性（Availability）","可靠性（Reliability）","不可否認性（Non-Repudiation）"],"a":3,"e":"留存系統、網路日誌是為了保護資訊安全的不可否認性。"},{"id":"G2-167","i":"t8","s":"G","q":"關於事件紀錄檔，下列敘述何者較「不」正確？","o":["事件記錄包含伺服器登入資訊","事件記錄可以作為調查佐證","事件記錄包含工單資料","事件記錄需要至少保存足夠期間可供查詢"],"a":2,"e":"事件記錄不包含工單資料。"},{"id":"G2-168","i":"t8","s":"G","q":"關於日誌的管理，下列敘述何者較「不」正確？","o":["選擇適當的整合式 Log 管理工具，並且測試確認是否能快速查詢分析","可以考慮將有機敏資料的日誌加密儲存，以避免資料遭到竄改","為了資料完整，應將系統的所有稽核日誌全部啟動與儲存","應定義事件分類，以有效分析"],"a":2,"e":"為了資料完整，應將系統的重要稽核日誌全部啟動與儲存。"},{"id":"G2-169","i":"t8","s":"G","q":"請問若日誌與系統管理人員，想把不同系統、程式之日誌檔進行管理、分析，則該先將這些日誌檔如何處理最為合適？","o":["去識別化","文件化","無需處理","正規化"],"a":3,"e":"正規化係為分析集中收容的不同設備之日誌，常會發生不同設備之日誌格式、命名方式不同之分析。"},{"id":"G2-170","i":"t8","s":"G","q":"關於日誌與監控作業，下列敘述何者較「不」正確？","o":["日誌應記錄使用者活動、異常，並且依法定要求的時間保存","系統日誌為避免外洩，應在出資安事件時才查詢，平日不應存取","日誌應避免可被該系統管理人員修改","資訊處理系統、網路設備的鐘訊，應與議定的準確時間來源同步"],"a":1,"e":"系統日誌中記錄了使用者的活動、異常狀況、錯誤與資訊安全事件的資訊，應該產生與保留事件日誌，並定期檢討與檢視。"},{"id":"G2-171","i":"t9","s":"G","q":"下列何種雲端型態的安全性最佳？","o":["公有雲","社區雲","混合雲","私有雲"],"a":3,"e":"私有雲較其他雲端型態的安全性最佳。"},{"id":"G2-172","i":"t9","s":"G","q":"下列何者「不」是雲端運算服務形式？","o":["軟體即服務（SaaS）","平台即服務（PaaS）","知識即服務（KaaS）","基礎架構即服務（IaaS）"],"a":2,"e":"雲端運算服務形式包含 SaaS、PaaS、IaaS。"},{"id":"G2-173","i":"t9","s":"G","q":"下列何者「不」是和雲端安全有關的國際標準？","o":["ISO/IEC 27011","ISO/IEC 27017","ISO/IEC 27018","CSA STAR"],"a":0,"e":"ISO/IEC 27011-對於電信組織根據 ISO/IEC 27002 標準的資訊安全管理指導。"},{"id":"G2-174","i":"t9","s":"G","q":"下列何者「不」是由美國國家標準技術研究院（NIST）所定義的雲端運算的五項關鍵特徵之一？","o":["可量測的服務","快速且彈性的架構","廣泛的網路存取方式","資源調配皆由供應商的人員協助"],"a":3,"e":"資源調配皆由供應商的人員協助不屬於美國國家標準技術研究院（NIST）所定義的雲端運算的五項關鍵特徵之一。"},{"id":"G2-175","i":"t9","s":"G","q":"使用者租用了雲端服務提供商所提供的虛擬伺務器（VM），可自行管理並且在上面安裝軟體，雲端服務供應商只提供必要的基礎設施，像是網路、儲存空間、處理器等資源。以上描述屬於何種雲端服務型式？","o":["軟體即服務（SaaS）","平台即服務（PaaS）","知識即服務（KaaS）","基礎架構即服務（IaaS）"],"a":3,"e":"IaaS 使用者負責較多的控制以達成規範要求，因此應要瞭解雲服務提供者所提供的存取控制流程與措施。"},{"id":"G2-176","i":"t9","s":"G","q":"在雲端平台建置過程中常會使用磁碟陣列（RedundantArray of Independent Disks, RAID）當作儲存空間，請問下列何種模式容錯率最高？","o":["RAID 0","RAID 1","RAID 2","RAID 5"],"a":1,"e":"RAID 1 為兩組以上的 N 個磁碟相互作鏡像，在一些多執行緒作業系統中能有很好的讀取速度，理論上讀取速度等於硬碟數量的倍數，與 RAID 0 相同。另外寫入速度有微小的降低。只要一個磁碟正常即可維持運作，可靠性最高。"},{"id":"G2-177","i":"t9","s":"G","q":"關於雲端蜜罐（Honeypot），下列敘述何者「不」正確？","o":["通常設置在正式的產品運作環境之中","任何連線蜜罐的行為都是可疑的","偽裝成有價值的網路或電腦系統，並設置漏洞，誘使駭客攻擊","可用來取得電腦病毒樣本"],"a":1,"e":"任何連線蜜罐的行為並不一定都是可疑的。"},{"id":"G2-178","i":"t9","s":"G","q":"當連線到使用雲端架設的 Http 服務時，回傳 404 的 HTTP 狀態碼，請問這個狀態碼代表下列何者？","o":["Gateway Timeout，伺服器嘗試執行請求時，未能及時從其他伺服器取得回應","OK，請求已成功，所請求的回應標頭或資料本體將被送回","Not Found，請求失敗，請求所希望得到的資源未在伺服器上被發現","Request Timeoutt，請求逾時，客戶端沒有在伺服器預備等待的時間內完成一個請求的傳送"],"a":2,"e":"404 的 HTTP 狀態碼 Not Found，請求失敗，請求所希望得到的資源未在伺服器上被發現。"},{"id":"G2-179","i":"t9","s":"G","q":"駭客入侵雲端服務供應商，再以此為跳板入侵使用者竊取資料稱之為？","o":["封包監聽","雲端跳躍","阻斷服務攻擊","社交工程"],"a":1,"e":"此即為著名駭客 APT10 所使用之攻擊手法。"},{"id":"G2-180","i":"t9","s":"G","q":"下列何者「不」是常見的雲端運算的部署模式？","o":["公有雲（Public）","私有雲（Private）","自由雲（Free）","混合雲（Hybrid）"],"a":2,"e":"自由雲（Free）不是常見的雲端運算的部署模式。"},{"id":"G2-181","i":"t10","s":"G","q":"有些 App 都會要求授權讀取行動裝置上的個人資訊，如聯絡人資料、照片、撥打電話、簡訊等。下列敘述何者「不」正確？","o":["授權 App 直接用行動裝置撥打電話或簡訊給特定對象可能會需要額外費用","行動裝置上的聯絡人資料、照片屬於個人資料，要小心保護，以免觸犯「個人資料保護法」","絕不散佈未經求證之訊息、及違反社會善良風俗之照片或影片，以免觸法","為了 App 對個人資訊的蒐集，App 要求行動裝置上聯絡人的讀取權限，可以直接同意授權"],"a":3,"e":"應謹慎了解要求，進行評估後再進行授權。"},{"id":"G2-182","i":"t10","s":"G","q":"關於強化行動裝置安全的方法，下列何者較「不」安全？","o":["設定螢幕鎖定需輸入密碼或指紋後方能使用","當收到系統安全性更新的提醒即進行更新","啟動無線區域網路自動連線機制以避免連接不受信任的 App","避免使用不信任的第三方 App"],"a":2,"e":"應關閉無線區域網路自動連線機制以避免連接不受信任的 App。"},{"id":"G2-183","i":"t10","s":"G","q":"下列何者較「不」能避免使用者，在使用行動裝置時，遭受網路釣魚攻擊（Phishing）？","o":["用無痕跡的瀏覽器開啟網頁","留意點選的網址是否異常","不隨意開啟來路不明的信件連結","不隨意連接不信賴的 Wi-Fi 熱點"],"a":0,"e":"無痕跡的瀏覽器開啟網頁若隨意開啟來路不明資料仍可能發生釣魚事件。"},{"id":"G2-184","i":"t10","s":"G","q":"關於運用 HCE（Host Card Emulation）於行動裝置上進行行動支付，下列敘述哪些是正確的？ (1) 從雲端支付平台取得的金鑰是有時效性的 (2) 無需挑選通過服務平台安全認證的手機 (3) 手機無需具備安全元件來儲存支付資訊 (4) 需更換具備安全防護特殊的 SIM 卡才能支援","o":["(1)(2)(3)","(1)(2)(4)","(1)(3)(4)","(2)(3)(4)"],"a":0,"e":"HCE（Host Card Emulation）是僅使用軟體對智慧卡進行的虛擬而精確的呈現。在 HCE 架構之前，NFC 交易只通過安全元件（Secure Element）進行。"},{"id":"G2-185","i":"t10","s":"G","q":"下列何者較可以避免行動裝置連接 Wi-Fi 時，遭受到中間人攻擊（Man-in-the-Middle, MiTM）？","o":["設定開機密碼鎖","連線使用加密 VPN 連線服務","限制連線 Wifi 之速率","只連線具身分認證機制的 Wifi 熱點或服務"],"a":1,"e":"連線使用加密 VPN 連線服務建立通道，防止中間人攻擊。"},{"id":"G2-186","i":"t10","s":"G","q":"使用行動裝置的 NFC 功能進行行動支付或資料交換時，較「無」需防範下列何種攻擊？","o":["中間人攻擊（Man-in-the-Middle Attack）","竊聽（Sniffing）","重送攻擊（Replaying Attack）","通行碼暴力破解（Password Brute Force Attack）"],"a":3,"e":"行動裝置的近場通訊（Near Field Communication, NFC）功能進行行動支付或資料交換時與通行碼暴力破解較無關係。"},{"id":"G2-187","i":"t10","s":"G","q":"關於行動裝置上運用代碼技術（Tokenization）行動支付方式的安全，下列敘述何者正確？","o":["無法由代碼去推算使用者原本的卡號","以手機本身的 Secure Elemen 儲存 Tokenization 是不安全的","手機遺失時，儲存在手機的信用卡卡號仍會被取得","應越獄（Tethered Jailbreak）取得手機權限來管理較安全"],"a":0,"e":"行動裝置上運用代碼技術（Tokenization）無法由代碼去推算使用者原本的卡號。"},{"id":"G2-188","i":"t10","s":"G","q":"關於行動裝置通訊軟體，下列敘述何者較「不」正確？","o":["開啟「阻擋訊息」，阻擋非來自好友之訊息","只在信譽良好網站或官方 APP 市集中下載使用","對於聳動的訊息，可直接分享給相關好友","不在公用電腦登入，並定期更改密碼"],"a":2,"e":"資訊需謹慎評估，不可直接分享。"},{"id":"G2-189","i":"t10","s":"G","q":"BYOD（Bring Your Own Device）是指帶行動裝置至辦公環境中辦公事，在資安標準作業規範 ISO/IEC 27002:2013 中，關於 BYOD 的指導綱要與安排項目，「不」包含下列何者？","o":["合理性查核，已測試輸出資料是否合理","提供適當的通信設備，包括保護遠端存取的方法","提供軟硬體支援與維護","稽核與安全監視"],"a":0,"e":"自攜電子設備亦稱自攜技術、自攜電話或自攜電腦是一種允許員工使用個人行動裝置進入他們工作區域並用以處理公司資訊與應用程式的作業方式。"},{"id":"G2-190","i":"t10","s":"G","q":"關於行動裝置可能遭受的安全威脅，下列敘述何者「不」在其中？","o":["行動裝置遺失資料外洩","行動裝置感染病毒","行動裝置因欠費，無法連上網路","行動裝置因安裝不明軟體，有遭植入後門之風險"],"a":2,"e":"行動裝置因欠費不屬於行動裝置可能遭受的安全威脅。"},{"id":"G2-191","i":"t11","s":"G","q":"當兩個物聯網裝置在通訊過程中，攻擊者分別對個別裝置進行獨立連線，並擷取與轉送雙方間傳遞資料，使原通訊雙方以為處於一個安全的資料傳輸環境。請問以上描述屬於下列哪種攻擊手法？","o":["重送攻擊","分割攻擊","中間人攻擊","路由迴圈攻擊"],"a":2,"e":"題目敘述為中間人攻擊。"},{"id":"G2-192","i":"t11","s":"G","q":"在物聯網裡，連網的智慧家電多數是採用安全性不高的通訊協定，駭客可藉此進行攻擊，下列何者不是這種利用通訊協定漏洞進行的攻擊手法？","o":["中間人攻擊（Man-in-the-Middle）","劫持（TCP/IP Hijacking）","重播攻擊（Replay）","垃圾搜尋攻擊（Dumpster Diving）"],"a":3,"e":"題目敘述為垃圾搜尋攻擊。"},{"id":"G2-193","i":"t11","s":"G","q":"物聯網裝置採用低功耗藍牙通訊技術建立連線時，選用頻外配對（Out-of-Band, OOB）是為了可以避免下列何種惡意攻擊？","o":["緩衝區溢位（Buffer Overflow）","中間人攻擊（Man-in-the-Middle Attack）","重送攻擊（Replay Attack）","蟲洞攻擊（Wormhole Attack）"],"a":1,"e":"在電腦領域，頻外管理（Out-of-band management）是指使用獨立管理通道進行裝置維護。其允許系統管理員遠端監視和管理伺服器、路由器、網路交換機和其他網路裝置。獨立通道係為防範中間人攻擊。"},{"id":"G2-194","i":"t11","s":"G","q":"惡意駭客可以架設高功率的無線基地台，冒用相同的 SSID 名稱，來誘導使用者連線至偽冒的基地台，偷取使用者的登入帳號及密碼。下列何者為上述的攻擊方式？","o":["Rogue AP and Evil twin","Sniffing","MAC Address Spoofing","Man in the Middle Attack"],"a":0,"e":"題目敘述為 Rogue AP and Evil twin。"},{"id":"G2-195","i":"t11","s":"G","q":"網路犯罪分子可能經由猜測密碼，而入侵網路或連到特定網路的設備，此為下列何種攻擊手法？","o":["監聽攻擊（Sniffing Attack）","密碼攻擊（Password-Based Attack）","金鑰淪陷攻擊（Compromised-Key Attack）","阻斷服務攻擊（Denial-of-Service Attack）"],"a":1,"e":"題目敘述為密碼攻擊。"},{"id":"G2-196","i":"t11","s":"G","q":"網路犯罪分子可能竊取用來加密通訊的金鑰，並將之用於解譯加密過的資料，屬於下列何種攻擊手法？","o":["監聽攻擊（Sniffing Attack）","密碼攻擊（Password-Based Attack）","金鑰淪陷攻擊（Compromised-Key Attack）","阻斷服務攻擊（Denial-of-Service Attack）"],"a":2,"e":"題目敘述為金鑰淪陷攻擊。"},{"id":"G2-197","i":"t11","s":"G","q":"物聯網時代的來臨，有人提出「預防無用論（Perfect Prevention is Impossible）」，此一論點的主要見解為下列何者？ (1) 企業應永遠假設自身正在遭受攻擊 (2) 企業應儘可能地降低攻擊所帶來的衝擊與影響 (3) 企業絕對可以成功阻止針對性攻擊的入侵 (4) 企業應建立整體性的持續防禦流程","o":["(1), (2), (3)","(1), (2), (4)","(1), (3), (4)","(2), (3), (4)"],"a":1,"e":"沒有任何資安防禦絕對可以成功阻止針對性攻擊的入侵。"},{"id":"G2-198","i":"t11","s":"G","q":"關於物聯網安全，下列敘述何者「不」正確？","o":["政府與 IoT 開發商應協力降低 IoT 的安全風險問題","建立與利益相關人的風險意識","規劃出提升 IoT 安全的獎勵措施","不用建立損害侵權、保險補償、安全認證等措施"],"a":3,"e":"需要建立損害侵權、保險補償、安全認證等措施。"},{"id":"G2-199","i":"t11","s":"G","q":"在下圖中，只有節點 N5 具備有向外連網能力，其他節點皆必須透過節點 N5 才能與外界進行網際網路連結，請問當節點 N5 為絕對安全的情況下，哪個節點消失時對整體網路的影響最大？","o":["N1","N2","N3","N4"],"a":2,"e":"N3 節點消失後，造成 3 個節點失效。","f":"n5"},{"id":"G2-200","i":"t11","s":"G","q":"攻擊者控制了物聯網其中一個節點，並丟棄（Drop）所有傳送至此節點的封包，此為下列何種攻擊手法？","o":["黑函攻擊","分割攻擊","蟲洞攻擊","黑洞攻擊"],"a":3,"e":"題目敘述為黑洞攻擊。"},{"id":"E1-01","i":"m1","s":"E","n":1,"q":"有一來自客戶的要求，老闆請您評估 ISO 系列的認證，身為資訊安全專業人員的您，為提供給客戶最佳的雲端服務，請問您的建議是下列何項？","o":["ISMS","ISO 27017","PIMS","ISO 27018"],"a":1,"e":"ISO/IEC 27017 是雲端服務資訊安全控制措施的實作指引，最符合「提供最佳雲端服務」的需求；27018 偏重雲端個資保護。"},{"id":"E1-02","i":"m1","s":"E","n":2,"q":"近來醫院個資外洩事件頻傳，身為醫療界最大龍頭，可以評估導入下列何項認證標準，以強化健康醫療資訊的資安管控？","o":["ISO 13485","ISO 27011","ISO 27799","ISO 27036"],"a":2,"e":"ISO 27799 是將 ISO 27002 套用於健康醫療資訊的資安管理標準；13485 為醫療器材品質、27011 為電信業。"},{"id":"E1-03","i":"m1","s":"E","n":3,"q":"「人員」常是資通安全管理實務中最為脆弱及難以掌控的突破口。企業建立資通安全管理制度時，通常會在人員入職前、在職中及離職後等階段設置相關管理措施。依據上述情境，下列何者較「不」屬於人員安全管理措施？","o":["考勤管理","職務區隔","盡職調查","認知及宣導"],"a":0,"e":"人員安全涵蓋任用前（盡職調查）、任用中（職務區隔、認知宣導）與離職後；考勤管理屬人事行政，非資安控制措施。"},{"id":"E1-04","i":"m1","s":"E","n":4,"q":"某軟體服務商在其公司官網上，定期公告所販售的應用軟體安全性更新檔案供使用者下載，並在下載頁面上同時提供檔案的雜湊值（如 SHA-256 值、SHA-512 值）。此行為主要目的是實現資通安全的下列哪一項觀念？","o":["完整性","可用性","機密性","不可否認性"],"a":0,"e":"提供雜湊值讓使用者比對下載檔案是否被竄改，目的在確保「完整性」。"},{"id":"E1-05","i":"m5","s":"E","n":5,"q":"某金融科技公司正在導入 ISO/IEC 27001:2022 資訊安全管理系統（ISMS）。資訊安全主管要求團隊對公司資訊系統進行風險評鑑。團隊首先建立風險接受準則與評鑑方法，接著識別可能影響系統機密性、完整性與可用性的風險，例如資料外洩或系統中斷，並指定各風險的負責人。之後再評估風險發生的可能性與可能造成的影響，據此判定風險等級，並依據風險準則決定優先處理的風險。依據 ISO/IEC 27001:2022 第 6.1.2 條「資訊安全風險評鑑」的要求，上述作法最符合下列哪一項說明？","o":["依據各部門主管的經驗判斷可能風險，並由管理階層決定是否需要處理風險","針對過去曾發生的資安事件進行檢討，以作為未來資訊安全風險管理的主要依據","先導入資訊安全技術控制措施，例如防火牆與加密機制，再評估其對降低風險的效果","建立風險準則，識別與分析資訊安全風險，評估風險等級並決定風險處理優先順序"],"a":3,"e":"ISO 27001:2022 第 6.1.2 條要求建立風險準則→識別→分析→評估風險並排定處理優先順序，正是 (D) 的流程。"},{"id":"E1-06","i":"m1","s":"E","n":6,"q":"在進行 ISO 27001 內部稽核時，下列何者最「不」正確？","o":["稽核重點應該放在符合性檢查，確保所有政策和程序都符合 ISO 27001 標準，無須參考利害關係人議題","稽核時專注於稽核表的每個細節，逐項對照檢查是否符合 ISO 標準的要求","稽核頻率可根據風險評估結果靈活安排，並不局限於每年一次的檢查","高階主管為表達支持，要求各部門主管擔任內稽，因為主管最清楚部門內的作業流程和風險"],"a":0,"e":"內部稽核除符合性外，也須考量組織背景與利害關係人議題，故 (A)「無須參考利害關係人議題」最不正確。"},{"id":"E1-07","i":"m3","s":"E","n":7,"q":"某公司為履行契約而蒐集並持有甲君之個人資料。依《個人資料保護法》第 3 條規定，甲君得向該非公務機關行使個資主體之權利。下列何者為錯誤的權利敘述？","o":["請求停止蒐集、處理或利用","請求製給正本","查詢或請求閱覽","請求補充或更正"],"a":1,"e":"個資法第 3 條當事人權利：查詢或請求閱覽、請求製給「複製本」、補充或更正、停止蒐集處理利用、刪除；沒有「製給正本」。"},{"id":"E1-08","i":"m3","s":"E","n":8,"q":"下列何者「不」屬於特種個資？","o":["病歷","健康檢查","性生活","指紋"],"a":3,"e":"個資法第 6 條特種個資：病歷、醫療、基因、性生活、健康檢查、犯罪前科；指紋屬一般個資（生物特徵）而非特種個資。"},{"id":"E1-09","i":"m2","s":"E","n":9,"q":"特定非公務機關若因業務需求且無其他替代方案，專案欲使用危害國家資通安全產品，下列有關其申請程序之敘述，何者正確？","o":["該機關資訊長可自行核定後使用，但需列冊管理","經該機關首長同意，函報主管機關核定","經該機關資通安全長核可，函報中央目的事業主管機關核定","經該機關資訊長核可，函報主管機關核定"],"a":2,"e":"依資通安全管理法相關規定，特定非公務機關須經資通安全長核可，並函報中央目的事業主管機關核定，且列冊管理。"},{"id":"E1-10","i":"m2","s":"E","n":10,"q":"公務機關對所屬資通安全專職人員進行適任性查核，若經查核認定有「不適任」之情事時，該機關應採取下列何種處置？","o":["立即送交主管機關進行懲處","立即終止其專職人員資格，並禁止其辦理任何資通安全業務","應予解職或調離職務","不得辦理涉及國家機密、軍事機密及國防秘密之資通安全業務"],"a":3,"e":"適任性查核認定不適任者，不得辦理涉及國家機密、軍事機密及國防秘密之資通安全業務。"},{"id":"E1-11","i":"m3","s":"E","n":11,"q":"請問下列何者「不」是營業秘密法第二條所述符合營業秘密之要件？","o":["所有人已採取合理之保密措施者","因其秘密性而具有實際或潛在之經濟價值者","非一般涉及該類資訊之人所知者","受雇人於職務上研究或開發之營業秘密，須歸雇用人所獨有"],"a":3,"e":"營業秘密三要件：秘密性（非一般人所知）、經濟價值、合理保密措施；(D) 屬歸屬規定，非成立要件。"},{"id":"E1-12","i":"m3","s":"E","n":12,"q":"某線上購物平台發現內部員工可能將客戶聯絡資訊下載到個人電腦中，用於私人行銷。公司資訊安全小組必須決定應採取的行動，下列行動何者最為適切？","o":["僅提醒員工不要將資料帶出公司，並依賴其自律","將員工行為視為例外，暫時不做任何改變，觀察是否真的造成問題","將資料全數刪除，暫停會員服務，直到確認無資料外洩疑慮為止","限制資料存取權限，並建立系統紀錄與警示機制，以防止未授權存取"],"a":3,"e":"應以技術與管理措施落實最小權限、記錄與告警，才能預防未授權存取並保留稽核軌跡。"},{"id":"E1-13","i":"m3","s":"E","n":13,"q":"某線上社交平台希望利用使用者資料進行大數據分析，但資料可能包含敏感個資。公司所採取的做法下列何者最為適切？","o":["去識別化資料後進行分析，並定期評估是否仍可能重新識別個人","直接使用原始資料進行分析，提高分析精度，但不做任何匿名處理","將所有資料提供給外部廣告公司，依賴其自行處理","將資料庫的連線全面採用 TLS 加密傳輸，並啟用存取控制，即可在不影響隱私的前提下開放存取原始明文資料"],"a":0,"e":"去識別化並定期評估再識別風險，兼顧資料利用與隱私保護；TLS 只保護傳輸，不能取代隱私保護。"},{"id":"E1-14","i":"m4","s":"E","n":14,"q":"ISO/IEC 27001 針對資訊資產的管理事項，其中一個是資訊分類（級）（Classification）並對資訊完成其敏感性等級的定義。下列哪一項為最有可能負責資訊敏感性等級定義的角色？","o":["保管人（Custodian）","擁有者（Owner）","查核員（Auditor）","使用者（User）"],"a":1,"e":"資訊擁有者（Owner）對資訊負責，決定其分類分級；保管人負責依等級實施保護。"},{"id":"E1-15","i":"m4","s":"E","n":15,"q":"在資訊安全管理系統（ISMS）的執行流程中，「盤點資訊資產」通常是位於下列哪一個階段？","o":["執行風險處理計畫之後","驗證稽核之後","定義 ISMS 適用範圍之後，執行資通安全風險評鑑之前","管理審查會議後，下次外部稽核前執行"],"a":2,"e":"ISMS 流程：先定義適用範圍 → 盤點資訊資產 → 執行風險評鑑 →
