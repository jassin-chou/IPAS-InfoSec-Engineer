風險處理。"},{"id":"E1-16","i":"m4","s":"E","n":16,"q":"在落實資訊安全管理制度（ISMS）時，行銷部門主管認為「客戶名單」屬於機密資料，但 IT 管理員認為該檔案僅供內部參考。在資產分類的權責架構中，較「不」適合由下列何者決定該資料的機密等級？","o":["資訊資產擁有者（Asset Owner）","資訊安全長（CISO）","資料隱私保護官（DPO）","系統管理員（System Administrator）"],"a":3,"e":"機密等級應由資產擁有者決定（可諮詢 CISO、DPO）；系統管理員是保管角色，不適合決定等級。"},{"id":"E1-17","i":"m4","s":"E","n":17,"q":"關於資訊資產的「盤點與評鑑」責任，係由下列哪一個層級或組織負責較為合適？","o":["由高階管理人員負責","由跨部門之風險評鑑組織中的「資安執行小組」負責","由業務承辦人負責","由資訊單位或資安人員負責"],"a":1,"e":"資產盤點與評鑑宜由跨部門風險評鑑組織中的資安執行小組統籌，確保範圍完整、標準一致。"},{"id":"E1-18","i":"m4","s":"E","n":18,"q":"軟體資產盤點中的「軟體物料清單（Software Bill of Materials, SBOM）」，其主要功能是用於盤點下列何項資產屬性？","o":["使用者的存取紀錄與行為模式","軟體的授權費用與到期日","伺服器的硬體規格與效能指標","軟體組成中的第三方元件與開源函式庫版本"],"a":3,"e":"SBOM 記錄軟體所含的第三方元件、開源函式庫及其版本，便於追蹤漏洞與授權。"},{"id":"E1-19","i":"m4","s":"E","n":19,"q":"資安團隊發現員工為了提升效率，私下將公司程式碼上傳至未經核准的 AI 生成工具（如 ChatGPT）。在制定阻擋策略之前，為了有效管理此類「影子 IT（Shadow IT）」風險，首要執行的步驟下列何項最為適切？","o":["強制重灌所有員工的電腦","立即封鎖所有對外的網路連線","執行軟體與雲端服務的資產盤點（Inventory）","要求所有員工簽署離職切結書"],"a":2,"e":"管理影子 IT 要先「看得見」：先盤點實際使用的軟體與雲端服務，才能評估風險並制定政策。"},{"id":"E1-20","i":"m4","s":"E","n":20,"q":"資料（DATA）常為資訊資產類型的其中一項，完成資料盤點後應明瞭其生命週期及運作階段，並進而在各階段設計可採用的保護措施。關於「資料傳遞」及對應運用之安全協定配對，下列哪一項錯誤？","o":["檔案傳輸：FTPS","網頁傳輸：HTTPS + TLS","電子郵件傳送：SMTPS","遠端連線 Shell：SFTP"],"a":3,"e":"SFTP 是基於 SSH 的檔案傳輸協定，不是遠端 Shell；遠端連線 Shell 應使用 SSH。"},{"id":"E1-21","i":"m5","s":"E","n":21,"q":"某企業完成資訊安全風險評鑑後，發現多項風險，包括系統漏洞、弱密碼問題及資料備份不足。資訊安全團隊依據公司事先建立的風險接受準則，比較各項風險的分析結果，並決定優先處理的項目。上述作法最符合資訊安全風險管理中的下列哪一個步驟？","o":["建立資訊安全教育訓練制度","評估風險並決定風險處理順序","建立資訊安全政策文件","建立風險評鑑清冊"],"a":1,"e":"依風險接受準則比較分析結果並決定優先順序，屬「風險評估（Risk Evaluation）」步驟。"},{"id":"E1-22","i":"m5","s":"E","n":22,"q":"下列何項是評估資通系統安全等級的主要影響構面？","o":["機密性、完整性、可用性、法律遵循性","資產價值、成本效益、時效性、法規遵循性","威脅、弱點、衝擊、可能性","硬體、軟體、場域、人員"],"a":0,"e":"資通系統安全等級依機密性、完整性、可用性與法律遵循性四構面評估。"},{"id":"E1-23","i":"m5","s":"E","n":23,"q":"某電力公司發現控制中心主伺服器若遭惡意軟體攻擊，可能導致停電事故。經評估後，公司決定導入網段隔離與惡意程式偵測系統，以降低攻擊成功的可能性。此舉屬於下列何種風險處理（Risk Treatment）方式？","o":["風險避免（Risk Avoidance）","風險降低（Risk Reduction）","風險接受（Risk Acceptance）","風險轉移（Risk Transfer）"],"a":1,"e":"導入網段隔離與惡意程式偵測以降低發生可能性，屬「風險降低（Reduction / Mitigation）」。"},{"id":"E1-24","i":"m5","s":"E","n":24,"q":"在資訊及資通系統之「詳細風險評鑑作法」中，用來計算「風險值」並最終決定「風險等級」，下列何項是風險值計算的主要因素？","o":["資通安全責任等級、資安事件分級、業務活動說明","現有控制措施、衝擊準則、風險接受準則","機密性、完整性、可用性、法律遵循性","資產價值、威脅發生可能性、弱點利用難易度"],"a":3,"e":"詳細風險評鑑常以 資產價值 × 威脅發生可能性 × 弱點利用難易度 計算風險值。"},{"id":"E1-25","i":"m5","s":"E","n":25,"q":"公司選定 NIST 風險管理框架（Risk Management Framework, RMF）作為風險管理框架。身為一名資安人員，你已完成風險評估，接下來應該做下列何項步驟？","o":["Framing risk（界定風險）","Responding risk（應對風險）","Monitoring risk（監控風險）","Asset Inventory（盤點資訊資產）"],"a":1,"e":"NIST RMF 風險管理四步驟：Frame → Assess → Respond → Monitor；評估之後是回應風險。"},{"id":"E1-26","i":"m6","s":"E","n":26,"q":"某雲端服務商在使用者連續多次登入失敗後，下列何項處置最為適切？","o":["立即刪除帳號","無需任何限制","鎖定並限制登入間隔時間","僅記錄失敗次數"],"a":2,"e":"連續登入失敗應暫時鎖定並拉長重試間隔，可抵擋暴力破解又不致永久影響使用者。"},{"id":"E1-27","i":"m6","s":"E","n":27,"q":"在實施零信任架構（ZTA）時，傳統的靜態授權（如 Role-basedAccess Control, RBAC）已不足以應對動態威脅。現代存取控制策略轉向「基於屬性的存取控制（Attribute- based access control, ABAC）」。下列何者最能體現 ABAC 的決策邏輯？","o":["使用者可以自行決定將檔案分享給誰","只有在上班時間、使用公司配發電腦且來自台灣 IP 的請求，才允許存取","因為你是經理，所以你可以存取人資系統","系統依據機密標籤強制比對，禁止低權限讀取高機密"],"a":1,"e":"ABAC 依使用者、裝置、時間、地點等屬性動態判斷；(A) 是 DAC、(C) 是 RBAC、(D) 是 MAC。"},{"id":"E1-28","i":"m6","s":"E","n":28,"q":"隨著生成式 AI 能輕易製作逼真的 Deepfake 影片與高解析度照片，生物辨識系統面臨「呈現攻擊（Presentation Attack）」的風險。為了確保掃描的是真實的人體而非照片或模型，採購系統時必須要求具備下列何項功能？","o":["更高的解析度採樣（High Resolution Sampling）","活力（體）檢測（Liveness Detection / PAD）","快速比對演算法（Fast Matching Algorithm）","多模態生物特徵儲存（Multimodal Storage）"],"a":1,"e":"活體檢測（Liveness Detection / PAD）可分辨真人與照片、面具、Deepfake 等呈現攻擊。"},{"id":"E1-29","i":"m6","s":"E","n":29,"q":"軟體開發團隊正在導入自動化 CI/CD 流程，應用程式需頻繁存取後端資料庫。為了避免將憑證寫死在程式碼中（Hardcoded Credentials），下列何項驗證策略最為適切？","o":["關閉資料庫的身分驗證功能，改用 IP 白名單進行控管","使用工作負載身分同盟（Workload Identity Federation）或託管身分，透過短憑證進行驗證","將資料庫密碼加密（Password encryption）後儲存於原始碼的版本控制系統中","設定極為複雜的資料庫密碼並每半年手動更換一次"],"a":1,"e":"工作負載身分同盟或託管身分以短效憑證驗證，不需在程式碼或儲存庫中保存密碼。"},{"id":"E1-30","i":"m6","s":"E","n":30,"q":"為了落實最小權限原則並消除「常設性管理員權限（Standing Privileges）」帶來的風險，現代特權存取管理（Privileged Access Management, PAM）傾向採用「即時存取（Just-in-Time, JIT）」策略。下列何者最符合 JIT 的運作模式？","o":["管理員擁有永久帳號，但每 90 天強制換密碼","使用共用的高權限帳號並存放在保險箱中","將所有管理員權限分割給不同的人（職責分離）","權限平時為零，僅在核准的工單期間內動態賦予權限，用完即收回"],"a":3,"e":"JIT 特權存取：平時零權限，經核准才在限定期間內動態授權，用完即收回。"},{"id":"E1-31","i":"m6","s":"E","n":31,"q":"關於最小權限原則（Principle of Least Privilege）的主要目的，下列哪一項最為適切？","o":["依據使用者所屬部門給予統一的存取權限","接受系統預先定義之權限","限制使用者僅能存取完成工作所需的資源","確保系統管理者擁有系統管理所需資源存取權限"],"a":2,"e":"最小權限原則：只給予完成工作所需的最少存取權限。"},{"id":"E1-32","i":"m6","s":"E","n":32,"q":"企業導入零信任架構（Zero Trust Architecture）時，下列哪一項較為正確？","o":["建立網路邊界防護後，即可預設信任內部網路的所有使用者與設備","依據所屬的部門或職級，給予對內部所有資源的存取權限","無論存取來源為何，所有存取請求都經過持續的驗證與動態授權","首次登入系統並通過多因子驗證後，該次連線期間即不需再次進行驗證"],"a":2,"e":"零信任「永不信任、持續驗證」：每次存取都需依情境驗證並動態授權，不因位於內網而信任。"},{"id":"E1-33","i":"m6","s":"E","n":33,"q":"某企業要求員工登入 VPN 時必須輸入密碼並使用手機 OTP 驗證碼。此措施主要是基於下列哪一項因素？","o":["知識因素（Something you know）","生物特徵因素（Something you are）","持有因素（Something you have）","行為因素（Something you do）"],"a":2,"e":"密碼是知識因素，手機 OTP 證明你「持有」該裝置，屬持有因素，兩者組成多因子驗證。"},{"id":"E1-34","i":"m6","s":"E","n":34,"q":"某企業導入雲端人資系統，允許外包廠商在專案期間查詢部分員工資料。專案結束後，資訊部門忘記回收廠商帳號，半年後該帳號仍可登入系統。若從「管理面」優先改善，最有效的措施為下列哪一項？","o":["將帳號存取權限與需求連動","強制外包帳號使用多因素驗證","增加登入失敗次數限制","將密碼有效期限縮短"],"a":0,"e":"帳號權限與專案需求／契約期間連動（帳號生命週期管理），專案結束即自動回收，從源頭解決問題。"},{"id":"E1-35","i":"m6","s":"E","n":35,"q":"某電商平台為因應日益嚴重的社交工程威脅，擬導入具備「抗網路釣魚（Phishing- Resistant）」特性之身分認證機制，以防止使用者於偽造的釣魚網站輸入憑證。下列何項認證技術最「不」適切？","o":["靜態密（恢復）碼（Recovery Codes）","快速線上身分驗證（FIDO2）","簡訊動態密碼（SMS OTP）","基於時間的動態密碼（TOTP）"],"a":0,"e":"FIDO2 綁定網域可抗釣魚；SMS OTP、TOTP 仍可被釣魚站即時轉送，靜態復原碼則完全可被騙取，最不適切。"},{"id":"E1-36","i":"m7","s":"E","n":36,"q":"關於公開金鑰加密（Public-key encryption）的主要特性，下列何項描述最為適切？","o":["允許不共享秘密金鑰（Secret key）的兩方，進行安全通訊","使用相同祕密金鑰（Secret key）進行加解密，因此更簡單","加解密速度比對稱金鑰加密（Symmetric-key encryption）更快","不需要任何金鑰生成演算法，因此效能更好"],"a":0,"e":"公開金鑰加密讓雙方不必事先共享秘密金鑰即可安全通訊；但速度比對稱式慢。"},{"id":"E1-37","i":"m7","s":"E","n":37,"q":"在資通安全的三大核心防護目標（CIA）中，採用「資料加解密」這種保護措施，最主要的作用是為了確保下列哪一項資訊資產的特性？","o":["完整性（Integrity）","法律遵循性（Legal compliance）","可用性（Availability）","機密性（Confidentiality）"],"a":3,"e":"加解密主要用於防止未授權者讀取，確保「機密性」。"},{"id":"E1-38","i":"m7","s":"E","n":38,"q":"關於雜湊函式（Hash Function），下列敘述何者正確？","o":["雜湊函式主要用於資料傳輸時的機密性保護","雜湊函式演算法安全性導因於解離散對數的困難度","雜湊函式可將任何長度的資料轉換成固定長度的訊息特徵值","雜湊值可以透過解密方式還原為原始訊息，具有可逆性"],"a":2,"e":"雜湊函式將任意長度資料轉為固定長度摘要，單向不可逆，用於完整性驗證。"},{"id":"E1-39","i":"m7","s":"E","n":39,"q":"為有效防範「預運算雜湊攻擊」（如彩虹表攻擊），並確保相同密碼在系統中產生的雜湊值具有唯一性，系統通常會在執行雜湊運算前，於明文密碼中加入一段隨機產生的唯一字串，下列哪一項是此種技術於密碼學領域之專業術語？","o":["鹽值（Salt）","憑證（Certificate）","數位信封（Digital Envelope）","訊息摘要（Message Digest）"],"a":0,"e":"在雜湊前加入隨機唯一字串稱為「鹽值（Salt）」，可抵禦彩虹表攻擊。"},{"id":"E1-40","i":"m7","s":"E","n":40,"q":"某企業為確保發布於官網的軟體更新檔在傳輸過程中未遭惡意竄改，擬提供該檔案的「數位摘要（Message Digest）」供使用者比對驗證。此技術必須具備「無法反推原始檔案內容」的單向特性，下列何項技術最適切？","o":["數位簽章（Digital Signature）","對稱式加密（Symmetric Encryption）","雜湊函數（Hash Function）","非對稱式加密（Asymmetric-Key Encryption）"],"a":2,"e":"雜湊函數具單向性且產生數位摘要，最適合檔案完整性比對。"},{"id":"E1-41","i":"m5","s":"E","n":41,"q":"某企業的供應鏈廠商遭受網路攻擊，導致企業的資料外洩。下列何措施最能降低供應鏈風險？","o":["選擇報價最便宜的供應商","對供應商進行資安評估和審查","限制與供應商的資料共享","將所有供應鏈管理工作外包"],"a":1,"e":"對供應商進行資安評估與審查（含契約要求、定期稽核）是降低供應鏈風險的關鍵措施。"},{"id":"E1-42","i":"m8","s":"E","n":42,"q":"依據 NIST SP 800-61 所描述之「資安事件處理生命週期」，下列何項為第二階段偵測與分析（Detection and Analysis）的任務之一？","o":["隔離受影響主機、移除惡意程式並修補弱點","檢討並改善缺失，避免後續類似事件再度發生","封鎖並排除發生事件的根本原因後恢復正常運作","依觀測到的跡證進行影響範圍界定與嚴重度分級"],"a":3,"e":"NIST SP 800-61 第二階段「偵測與分析」：依跡證界定影響範圍並分級；(A)(C) 屬圍堵根除復原，(B) 屬事後活動。"},{"id":"E1-43","i":"m8","s":"E","n":43,"q":"在資安事件處理程序中，下列哪一項是「封鎖」階段的首要目標？","o":["立即恢復所有業務運作","限制事件擴散範圍，阻止損害進一步蔓延","徹底移除所有惡意程式","對攻擊者提起法律訴訟"],"a":1,"e":"封鎖（圍堵）階段首要目標是限制擴散、阻止損害擴大。"},{"id":"E1-44","i":"m8","s":"E","n":44,"q":"公務機關判定資通安全事件等級時，應衡酌機密性、完整性及可用性（CIA）之受損影響程度。若某事件經評估後，其影響等級分別為「機密性受損：2 級」、「完整性受損：3 級」、「可用性受損：1 級」，則該事件最終應判定為幾級資通安全事件？","o":["第 3 級","第 1 級","第 2 級","由資訊主管自行決定"],"a":0,"e":"事件等級取 CIA 各構面中的最高等級，故判定為第 3 級。"},{"id":"E1-45","i":"m8","s":"E","n":45,"q":"在資通安全事件處理的「根除階段」，若評估受感染系統存在高隱匿性惡意程式（如 Rootkit），且無法確保能完全清除潛伏之殘留威脅時，下列何者為較安全的處置方式？","o":["僅更換防毒軟體品牌後繼續使用","採回存方式，從乾淨備份還原或全新安裝系統","增加防火牆規則阻擋該主機 IP","暫時不處理，改採持續監控"],"a":1,"e":"高隱匿性惡意程式難以確認清除乾淨，應從乾淨備份還原或重新安裝系統。"},{"id":"E1-46","i":"m9","s":"E","n":46,"q":"以下何者是異地備援的主要目的？","o":["避免單一地域的災難影響","簡化系統的備份流程","降低資料傳輸的延遲","提高系統的即時效能"],"a":0,"e":"異地備援將資料／系統放在不同地理位置，避免單一地區災害同時毀損主備系統。"},{"id":"E1-47","i":"m9","s":"E","n":47,"q":"關於營運持續管理（Business Continuity Management, BCM）的責任歸屬，下列何項敘述最為正確？","o":["營運持續管理僅需由安全部門負責規劃與執行","營運持續管理主要是資訊部門的責任","營運持續管理必須由核心業務所有相關部門共同投入","營運持續管理是高階管理人員的專屬職責，其他部門只需配合"],"a":2,"e":"BCM 必須由核心業務相關各部門共同投入，高階管理層支持與督導。"},{"id":"E1-48","i":"m9","s":"E","n":48,"q":"某機關的備份策略為：週一執行「完整備份」，週二至週四執行「增量備份」。若該機關於週五上班前發生系統潰散，需進行資料還原，下列關於還原程序之敘述，何者正確？","o":["僅需還原週一的完整備份","還原週一完整備份 + 週四的備份","僅需還原週四的備份","還原週一完整備份 + 週二、週三、週四的備份"],"a":3,"e":"增量備份只備份上次備份後的變動，還原時需完整備份＋之後所有增量備份（二、三、四）。"},{"id":"E1-49","i":"m9","s":"E","n":49,"q":"在業務持續運作管理程序中，組織在進行「營運衝擊分析（BIA）」以識別核心業務及其復原時效需求前，通常應先完成下列哪一項階段性工作？","o":["發展復原策略","維護營運持續計畫","建立業務持續運作策略","測試與演練"],"a":2,"e":"BCM 程序：先建立業務持續運作策略（含範圍、政策），再進行 BIA，接著發展復原策略、測試演練。"},{"id":"E1-50","i":"m9","s":"E","n":50,"q":"在制定營運持續計畫（BCP）的時間目標時，為確保各項復原目標的合理性，下列哪一項為絕對「不」可違背的邏輯限制？","o":["RTO（Recovery Time Objective）不可大於 MTPD（Maximum Tolerable Period of Disruption）","WRT（Work Recovery Time）必須小於 RPO（Recovery Point Objective）","MTPD（Maximum Tolerable Period of Disruption）必須小於 RTO（Recovery Time Objective）","RPO（Recovery Point Objective）不可大於 WRT（Work Recovery Time）"],"a":0,"e":"RTO 必須小於等於 MTPD（最大可容忍中斷時間），否則復原時已超出組織可承受範圍。"},{"id":"E2-01","i":"t1","s":"E","n":1,"q":"下列何者正確描述了封包過濾式防火牆的特性？","o":["封包過濾式防火牆可過濾並偵測隱藏在加密內容中的惡意指令","封包過濾式防火牆需要經驗豐富的管理人員建立複雜的過濾規則","封包過濾式防火牆能夠檢測並阻擋來自已知惡意網站的所有流量，即使這些流量使用不同的 IP 地址","封包過濾式防火牆主要檢查每個來往 IP 封包中的資料（Data）內容"],"a":1,"e":"封包過濾防火牆依 IP、Port、協定等表頭規則過濾，不檢查內容；規則複雜需經驗豐富人員設定。"},{"id":"E2-02","i":"t1","s":"E","n":2,"q":"關於阻斷式服務攻擊（DoS/DDoS）的敘述，下列何者最為適切？","o":["攻擊者通常使用單一來源發起攻擊","僅會造成網路流量變慢，但不會癱瘓主機","主要目的是耗盡目標系統的資源","只能經由惡意程式散播來實現"],"a":2,"e":"DoS/DDoS 主要目的是耗盡目標的頻寬、運算或連線資源，使服務中斷。"},{"id":"E2-03","i":"t1","s":"E","n":3,"q":"針對虛擬區域網路（Virtual Local Area Network, VLAN）環境中的雙重標籤攻擊（Double Tagging Attack），下列何項防護措施最為適切？","o":["將原生虛擬區域網路（Native VLAN）設定為未使用的 VLAN，避免與存取連接埠重疊","關閉所有主幹連接埠（Trunk Port）上的加密功能","允許所有存取連接埠（Access Port）自動協商為主幹（Trunking）模式","將原生虛擬區域網路（Native VLAN）設定為 VLAN 1，以方便管理"],"a":0,"e":"雙重標籤攻擊利用 Native VLAN；將 Native VLAN 設為未使用的 VLAN 並關閉 DTP 自動協商可防範。"},{"id":"E2-04","i":"t1","s":"E","n":4,"q":"關於動態主機設定協定伺服器（DHCP Server）惡意攻擊，下列何項說明最能解釋其可能造成的後續威脅？","o":["攻擊者可透過惡意 DHCP 提供錯誤的網域名稱系統（DNS）設定，進而引導受害者至惡意網站","攻擊者可利用惡意 DHCP 直接取得目標網路所有設備的管理員權限","攻擊者可利用惡意的 DHCP 直接加密受害主機的所有檔案","攻擊者可透過惡意 DHCP 對目標主機發動分散式阻斷服務攻擊（DDoS）"],"a":0,"e":"惡意 DHCP 伺服器可發送錯誤的閘道或 DNS 設定，把受害者導向惡意網站或進行中間人攻擊。"},{"id":"E2-05","i":"t1","s":"E","n":5,"q":"下列何種防禦機制最能有效地驗證邊界閘道器協定（BGP）路由的合法性，以降低 BGP 劫持（BGP Hijacking）的風險？","o":["入侵偵測系統（Intrusion Detection System, IDS）","資源公鑰基礎建設（Resource Public Key Infrastructure, RPKI）","虛擬區域網路分段（VLAN）","動態主機設定協定監聽（DHCP Snooping）"],"a":1,"e":"RPKI 以數位憑證驗證 IP 前綴與 AS 的對應（ROA），可驗證 BGP 路由來源合法性。"},{"id":"E2-06","i":"t2","s":"E","n":6,"q":"企業為防範不同 OSI 網路階層的安全威脅，會部署相對應的安全通訊協定。關於協定與其網路安全防護功能的對應，下列敘述何者錯誤？","o":["應用層（Application Layer） ：HTTPS 透過 TLS 提供端對端加密，防止網頁傳輸內容遭中間人竊聽攻擊","傳輸層（Transport Layer） ：TLS/SSL 介於應用層與傳輸層之間，主要負責為應用程式提供資料加密與來源驗證","網路層（Network Layer） ：IPsec 協定可用於建立虛擬私人網路（VPN）通道，保護跨網域 IP 封包的機密性與完整性","資料連結層（Data Link Layer） ：SSH 主要運作於此層，負責對區域網路的 MAC 位址進行加密，以防範 ARP 欺騙攻擊"],"a":3,"e":"SSH 屬應用層協定，不在資料連結層加密 MAC 位址；防 ARP 欺騙應用 DAI 等機制。"},{"id":"E2-07","i":"t2","s":"E","n":7,"q":"關於無線網路 WPA3 加密標準，下列何者是其優於 WPA2 的主要特性？","o":["移除了所有的密碼認證機制","強化了對抗離線暴力破解攻擊的保護（SAE 交握）","取代了 AES（Advanced Encryption Standard）加密演算法","僅支援隱藏 SSID 的功能"],"a":1,"e":"WPA3 以 SAE（Dragonfly 交握）取代 PSK，強化對離線字典／暴力破解的防護。"},{"id":"E2-08","i":"t3","s":"E","n":8,"q":"在設計一個安全的帳號鎖定機制時，下列何種策略能有效防止暴力破解攻擊，同時避免合法使用者被誤鎖？","o":["在多次登入失敗後，增加帳號鎖定的時間，並設定最大鎖定時間","僅記錄登入失敗次數，不進行帳號鎖定","在三次登入失敗後，永久鎖定帳號","每次登入失敗後，即要求使用者重新變更密碼"],"a":0,"e":"漸進式延長鎖定時間並設上限，可抵擋暴力破解又避免合法使用者被永久誤鎖。"},{"id":"E2-09","i":"t10","s":"E","n":9,"q":"企業推行 BYOD（Bring Your Own Device）政策，員工抗拒安裝會「接管整台手機」的 MDM 代理程式（Mobile Device ManagementAgent）。為了在「不管理設備」的情況下僅保護「企業應用程式（如 Teams、Outlook）」及資料安全，下列何項技術較符合隱私保護趨勢？","o":["資料外洩防護（Data Loss Prevention, DLP）","統一端點管理（Unified Endpoint Management, UEM）","行動應用管理（Mobile Application Management, MAM）","遠端瀏覽器隔離（Remote Browser Isolation, RBI）"],"a":2,"e":"MAM 只管理企業 App 與其資料（容器化、App 層原則），不接管整台裝置，兼顧 BYOD 隱私。"},{"id":"E2-10","i":"t9","s":"E","n":10,"q":"隨著 SaaS（Software as a Service）應用普及，傳統 VPN 的「流量回傳（Backhaul）」架構導致頻寬瓶頸與延遲。企業決定導入安全存取服務邊緣（Secure Access Service Edge, SASE）架構。下列何項 SASE 組件能讓員工不需 VPN 即可安全、直接地存取雲端應用，並同時執行資料外洩防護（Data Loss Prevention, DLP）檢查？","o":["防火牆即服務（FWaaS）","雲端存取安全代理（Cloud Access Security Broker, CASB）","安全網頁閘道（Secure Web Gateway, SWG）","軟體定義廣域網路（SD-WAN）"],"a":1,"e":"CASB 位於使用者與 SaaS 之間，提供可視性、存取控管與 DLP 檢查。"},{"id":"E2-11","i":"t3","s":"E","n":11,"q":"若一台 Windows 設備已確定被駭客入侵，為測試該設備與特定外部 IP 或主機的網路連線狀態是否暢通，下列何項指令最為適切？","o":["ipconfig","ping","arp","nslookup"],"a":1,"e":"ping 以 ICMP 測試與指定主機的連通性；ipconfig 看本機設定、arp 看 MAC 對應、nslookup 查 DNS。"},{"id":"E2-12","i":"t2","s":"E","n":12,"q":"下列何項對稱區塊加密演算法（Symmetric Block Cipher Algorithm）的工作模式，在傳輸資料時同時具備加密保護與完整性驗證功能？","o":["密碼區塊連結模式（Cipher Block Chaining, CBC）","伽羅瓦/計數器模式（Galois/Counter Mode, GCM）","電子密碼本模式（Electronic Codebook, ECB）","資料加密標準（Data Encryption Standard, DES）"],"a":1,"e":"GCM 是 AEAD 模式，同時提供加密與完整性驗證（認證標籤）；DES 是演算法不是工作模式。"},{"id":"E2-13","i":"t2","s":"E","n":13,"q":"組織正在升級無線網路至 WPA3 標準，但考量部分舊型 IoT 設備不支援 SAE （Simultaneous Authentication of Equals）。為了過渡，網路管理員啟用了「WPA3 過渡模式（Transition Mode）」。在此混合環境下，攻擊者最可能利用下列何種手法迫使客戶端降級至較不安全的 WPA2，進而發動字典攻擊？","o":["降級攻擊（Downgrade Attack / Rollback）","密鑰重裝攻擊（Key Reinstallation Attack, KRACK）","重新連線攻擊（Reassociation Attack）","邪惡雙子攻擊（Evil Twin）"],"a":0,"e":"過渡模式同時支援 WPA2／WPA3，攻擊者可架設只支援 WPA2 的 AP 迫使客戶端降級，再擷取交握進行字典攻擊。"},{"id":"E2-14","i":"t2","s":"E","n":14,"q":"在金鑰管理（Key Management）的實務中，對稱式加密（Symmetric Encryption）與非對稱式加密（Asymmetric Encryption）各有其特性。若某系統需要在大量資料傳輸時兼顧效能，同時又需安全地與眾多服務目標交換金鑰，下列何種架構最為適切？","o":["以「非對稱式加密」交換對稱金鑰，再以「對稱式加密」加密大量資料","全程使用「非對稱式加密」以確保金鑰交換與資料加密的安全性","以「對稱式加密」交換金鑰，再以「非對稱式加密」加密大量資料","全程使用「對稱式加密」並透過安全通道預先共享金鑰"],"a":0,"e":"混合式加密：以非對稱加密交換對稱金鑰，再以對稱加密處理大量資料，兼顧安全與效能（如 TLS）。"},{"id":"E2-15","i":"t3","s":"E","n":15,"q":"某研究人員發現一個 OS kernel 的漏洞：惡意程式可經由某個 syscall 觸發 kernel 中的緩衝區溢位，但要成功利用此漏洞必須先取得或推測核心記憶體位址。下列何種安全機制最能有效降低該攻擊的成功率？","o":["最小特權原則（Principle of Least Privilege, PoLP）","禁止未簽章驅動程式載入","ASLR（Address space layout randomization） / KASLR（Kernel Address space layout randomization）","SELinux（Security-Enhanced Linux）強制存取控制"],"a":2,"e":"攻擊需先知道核心記憶體位址，KASLR 隨機化核心位址配置，使攻擊者難以預測。"},{"id":"E2-16","i":"t3","s":"E","n":16,"q":"當主機遭受駭客攻擊後，資安人員所應採取的第一項處置行動，下列何項最為適切？","o":["立即向主管機關申報資安事件，並等待指示後再採取任何進一步行動","立即將受駭主機格式化並重新安裝作業系統，以確保系統恢復正常運作","立即將受駭主機與網路隔離（Network Isolation），以防止攻擊行為進一步擴散","立即通知所有使用者更改密碼，以防止帳號遭到未授權存取"],"a":2,"e":"發現受駭應先隔離主機，阻止橫向擴散，並保留跡證以利後續鑑識。"},{"id":"E2-17","i":"t3","s":"E","n":17,"q":"關於系統強化（Hardening），下列何項描述最為適切？","o":["系統強化（Hardening）是指透過關閉不必要的服務、移除預設帳號及設定安全基準（Baseline）等措施，縮小系統的攻擊面","系統強化（Hardening）是指為系統同時安裝多樣化的安全防護軟體，以達到多層次的防禦效果","系統強化（Hardening）是指對系統進行完整的資料加密，確保所有儲存資料均無法被未授權讀取","系統強化（Hardening）是指在網路環境中安裝 IPS/IDS 等設備"],"a":0,"e":"系統強化是關閉不必要服務、移除預設帳號、套用安全基準組態（如 GCB），縮小攻擊面。"},{"id":"E2-18","i":"t9","s":"E","n":18,"q":"關於在雲端環境中，平台即服務（Platform as a Service, PaaS）與軟體即服務（Software as a Service, SaaS）在權限分責（Shared Responsibility）上主要差異的描述下列何項較為適切？","o":["PaaS 與 SaaS 的責任範圍完全相同，安全責任皆由雲端服務供應商全權負責","PaaS 使用者需負責底層實體硬體的安全，SaaS 使用者則負責虛擬機器的安全設定","PaaS 使用者需負責應用程式與資料的安全，SaaS 使用者則主要負責存取管理與資料安全","SaaS 使用者需負責作業系統修補與中介軟體（Middleware）設定，PaaS 使用者則無需管理任何安全事項"],"a":2,"e":"PaaS 使用者需負責自己的應用程式與資料；SaaS 使用者主要負責帳號存取管理與資料。"},{"id":"E2-19","i":"t8","s":"E","n":19,"q":"在 Windows 作業系統中，若要確認系統帳戶是否有異常的登入嘗試，應查看下列哪一個工具？","o":["事件檢視器中的「安全性」紀錄（Event Viewer - Security）","本機安全性原則（Local Security Policy）","效能監視器（Performance Monitor）","工作管理員（Task Manager）"],"a":0,"e":"Windows 登入成功／失敗事件（如 4624/4625）記錄在事件檢視器的「安全性」紀錄中。"},{"id":"E2-20","i":"t4","s":"E","n":20,"q":"請問下列何種 SQLi 攻擊類型可利用資料庫伺服器所發出的 DNS（Domain Name System）請求功能將資料傳遞給攻擊者？","o":["Inferential SQL Injection","Out-of-band SQL Injection","Blind SQL Injection","In-band SQL Injection"],"a":1,"e":"Out-of-band SQLi 透過資料庫發出的 DNS 或 HTTP 請求，把資料送到攻擊者控制的伺服器。"},{"id":"E2-21","i":"t4","s":"E","n":21,"q":"駭客成功入侵一台 Windows 系統後，將惡意程式加入「登錄檔的啟動機制（Run/RunOnce）」中，讓惡意程式在每次系統啟動時自動執行。上述的內容主要屬於下列何種入侵手法？","o":["密碼暴力破解","系統後門與持久化（Persistence）","中間人攻擊（Man-in-the-Middle Attack）","社交工程攻擊"],"a":1,"e":"寫入 Run/RunOnce 登錄機碼讓惡意程式開機自動執行，屬「持久化（Persistence）」手法。"},{"id":"E2-22","i":"t4","s":"E","n":22,"q":"關於動態連結程式庫側載（DLLSideloading）攻擊的概念，下列何項說明最為適切？","o":["攻擊者利用動態修改記憶體的方法來改變 DLL 的程式碼，以躲避防毒軟體的偵測","攻擊者藉由在目標系統中使用加殼（Packing）技術將惡意程式附加在正常的 DLL 上，以逃避防毒軟體的偵測","攻擊者透過在網路上散布被篡改的 DLL 檔案，誘使開發者或使用者誤用，進而執行惡意行為","攻擊者透過應用程式在載入 DLL 時的搜尋順序漏洞，將惡意版本置於優先路徑並取代合法版本以便執行"],"a":3,"e":"DLL 側載利用應用程式載入 DLL 的搜尋順序，把惡意 DLL 放在優先路徑，冒充合法版本被載入。"},{"id":"E2-23","i":"t4","s":"E","n":23,"q":"關於跨網站請求偽造（Cross-Site Request Forgery, CSRF）攻擊的概念，下列何項說明最為適切？","o":["攻擊者誘使已通過驗證的使用者，在不知情的情況下向目標網站發送非預期的惡意請求","攻擊者在目標網站的輸入欄位中插入惡意指令碼（Script），以影響其他使用者的瀏覽行為","攻擊者竊取使用者的工作階段令牌（Session Token），直接以使用者身分登入目標網站","攻擊者對目標網站的登入頁面進行暴力破解（Brute Force），以取得使用者帳號與密碼"],"a":0,"e":"CSRF 誘使已登入的使用者在不知情下對目標網站送出請求；(B) 是 XSS、(C) 是 Session 劫持。"},{"id":"E2-24","i":"t4","s":"E","n":24,"q":"關於「HTTP 請求走私攻擊（HTTP Request Smuggling）」的成因，下列何項說明最為適切？","o":["攻擊者透過重複發送相同的 HTTP 請求，使伺服器因資源競逐問題回傳錯誤的回應","攻擊者利用伺服器未正確驗證使用者身份，直接存取需授權的 API 端點（Endpoint）","攻擊者透過在 HTTP 回應中注入惡意腳本，使前端快取伺服器儲存並回傳給其他使用者","攻擊者利用前端代理伺服器（Proxy Server）與後端伺服器對 HTTP 請求邊界解析不一致，導致請求邊界混淆"],"a":3,"e":"HTTP 請求走私源於前端代理與後端伺服器對 Content-Length／Transfer-Encoding 解析不一致。"},{"id":"E2-25","i":"t5","s":"E","n":25,"q":"下列何項工具「不」是常見的靜態原始碼檢測工具？","o":["Fortify","Chef","PMD","Checkmarx"],"a":1,"e":"Fortify、PMD、Checkmarx 都是靜態原始碼檢測工具；Chef 是組態管理自動化工具。"},{"id":"E2-26","i":"t5","s":"E","n":26,"q":"在開發 Web 應用程式時，為防止 SQL 注入攻擊（SQLInjection），下列措施中何項較為有效？","o":["使用預備語句（Prepared Statements）或參數化查詢","在資料庫中啟用日誌記錄","限制使用者輸入的長度","對使用者輸入的資料進行編碼"],"a":0,"e":"預備語句／參數化查詢讓輸入不會被當成 SQL 指令執行，是防 SQL Injection 最有效的方法。"},{"id":"E2-27","i":"t5","s":"E","n":27,"q":"如下列 C/C++程式碼，請判斷該程式碼有下列哪一種類的緩衝區溢位（Buffer Overflow）弱點？","o":["堆疊型緩衝區溢位（Stack-based Buffer Overflow）","整數溢位（Integer Overflow）","堆積型緩衝區溢位（Heap-based Buffer Overflow）","格式字串攻擊（Format String Overflow）"],"a":3,"e":"printf(buffer) 直接把使用者輸入當格式字串，輸入 %x、%n 可讀寫記憶體，屬格式字串弱點；應改為 printf(\"%s\", buffer)。","f":"code"},{"id":"E2-28","i":"t5","s":"E","n":28,"q":"在軟體開發生命週期（SDLC）中，何時開始考慮安全性（Security）的處理成本最高？","o":["系統測試階段","程式碼撰寫階段","需求分析與設計階段","系統維運階段"],"a":3,"e":"越晚處理安全問題成本越高，到系統維運（上線）階段才修正成本最高。"},{"id":"E2-29","i":"t5","s":"E","n":29,"q":"SBOM（Software Bill of Material）為近年程式開發與供應鏈安全特別需要注意的項目，關於 SBOM 關注與記錄的重點，下列何項最「不」適切？","o":["軟體元件的名稱與版本資訊","軟體元件的已知漏洞資訊（CVE）","軟體元件執行時的動態行為日誌（Dynamic Behavior Logs）","軟體元件的授權類型（license type）"],"a":2,"e":"SBOM 記錄元件名稱、版本、供應者、授權、相依關係（可對應 CVE）；執行時的動態行為日誌不屬於 SBOM。"},{"id":"E2-30","i":"t6","s":"E","n":30,"q":"零日漏洞在安全更新發布前就可能被攻擊者利用，導致企業無法立即修補，因此這類攻擊難以預防。下列何項是最「不」妥當的應對措施？","o":["採用端點偵測及回應技術（Endpoint Detection and Response, EDR）來監控可疑行為","透過資安事件響應計畫（Incident Response Plan, IRP）快速封鎖受影響的系統","定期獲取漏洞情報，及時安裝安全更新檔","使用應用程式黑名單，防止未經授權的程式執行"],"a":3,"e":"零日攻擊無已知特徵，黑名單只能擋已知程式，效果最差；應採白名單、EDR 與應變計畫。"},{"id":"E2-31","i":"t6","s":"E","n":31,"q":"在弱點管理流程中，執行「弱點掃描（Vulnerability Scanning）」最主要的目的為下列何項？","o":["自動化地探測系統、網路、應用程式、作業系統，識別出已知的安全性弱點（CVEs）","清除已感染電腦的病毒、木馬或勒索軟體等惡意程式","模擬駭客攻擊手法，並主動利用弱點來嘗試取得系統控制權","即時監控並阻擋進出網路的惡意連線與可疑流量"],"a":0,"e":"弱點掃描自動化探測並識別已知弱點（CVE）；(C) 主動利用弱點屬滲透測試。"},{"id":"E2-32","i":"t6","s":"E","n":32,"q":"某惡意程式在執行初期會延遲數十分鐘，並要求使用者進行互動（滑鼠移動、鍵盤輸入）。若未符合條件即結束執行。此設計最主要削弱下列哪一類防護機制的有效性？","o":["靜態程式碼分析","行為式端點即時阻斷","郵件閘道防毒","自動化沙箱動態分析"],"a":3,"e":"延遲執行與要求使用者互動是典型「沙箱規避」技巧，使自動化沙箱觀察不到惡意行為。"},{"id":"E2-33","i":"t6","s":"E","n":33,"q":"弱點管理與惡意程式防護息息相關，企業應定期比對資產是否存在已公開之弱點，下列哪一項為此通報機制的簡稱？","o":["SOC（Security Operations Center）","VPN（Virtual Private Network）","VANS（Vulnerability Analysis and Notice System）","GCB（Government Configuration Baseline）"],"a":2,"e":"VANS（資通安全弱點通報機制）比對機關資產與已公開弱點，協助即時修補。"},{"id":"E2-34","i":"t6","s":"E","n":34,"q":"針對採取「實體隔離（Air-Gapped）」配置的系統環境，下列何種行為最可能成為惡意程式入侵的管道？","o":["遭到來自 GSN 的遠端連線滲透","人員利用可攜式媒體（USB/隨身碟）私自進行資料交換","外部防火牆規則配置錯誤","雲端服務提供者的系統中斷"],"a":1,"e":"實體隔離環境最常見的入侵途徑是可攜式媒體（USB）交換資料，如 Stuxnet 事件。"},{"id":"E2-35","i":"t7","s":"E","n":35,"q":"關於備份儲存策略，下列選項最「不」妥當？","o":["獨立磁碟冗餘陣列（RAID）主要是提升磁碟存取效能與容錯能力，不可作為唯一的備份方案","備份檔案不可存放在同一台伺服器主機內","即使備份存放於雲端，仍需保留本地檔案","用 3-2-1 備份策略，至少存放於 3 種不同媒介、2 份異地存放、1 份備份"],"a":3,"e":"3-2-1 原則是「3 份資料、2 種不同媒介、1 份異地存放」，(D) 敘述錯誤。"},{"id":"E2-36","i":"t7","s":"E","n":36,"q":"某公司希望在系統故障時，能將服務立即切換到另一台伺服器，資料幾乎零遺失。這需要使用下列何種備份/容錯技術？","o":["離線備份（Offline Backup）","熱備援（Hot Backup）","溫備援（Warm Backup）","冷備援（Cold Backup）"],"a":1,"e":"熱備援（Hot Standby）同步運作、可即時切換，資料幾乎零遺失。"},{"id":"E2-37","i":"t7","s":"E","n":37,"q":"機構採用多雲（Multi-Cloud）備份架構，以確保病歷資料的持續可用性。但在一次勒索攻擊事件中，駭客利用被竊取的 API 金鑰，跨雲刪除了多個備份版本，導致僅剩下數月前的資料。若要避免此風險，下列何種最佳實務最能補強現有架構？","o":["僅依賴多雲備份即可，不需其他措施","改用差異備份，避免版本過多","將所有備份統一壓縮，以降低攻擊面","實作不可變備份（Immutable Backup）＋零信任存取控管（Zero Trust Access）"],"a":3,"e":"不可變備份（WORM）讓備份在保存期內無法被刪改，加上零信任存取控管，即使金鑰外洩也能保住備份。"},{"id":"E2-38","i":"t7","s":"E","n":38,"q":"在評估資通系統所使用的演算法安全性時，下列哪一項演算法已被證實存在「碰撞攻擊（CollisionAttack）」缺陷，因此不再建議用於驗證資料完整性或實作數位簽章？","o":["RSA-2048","AES-256","MD5","SHA-256"],"a":2,"e":"MD5 已被證實可產生碰撞，不應再用於完整性驗證或數位簽章；SHA-256 目前仍安全。"},{"id":"E2-39","i":"t7","s":"E","n":39,"q":"在制定營運持續計畫（BCP）時，有關資料「備份頻率」的設定應遵循下列哪一項原則？","o":["資料備份頻率應等於 RTO（Recovery Time Objective）","資料備份頻率不可大於 RPO（Recovery Point Objective）","資料備份頻率應大於 MTPD（Maximum Tolerable Period of Disruption）","資料備份頻率隨機決定，有時間再備份"],"a":1,"e":"RPO 是可容忍的資料遺失時間點，備份間隔不可大於 RPO。"},{"id":"E2-40","i":"t8","s":"E","n":40,"q":"在日誌管理流程中，「日誌分析」（LogAnalysis）階段最主要的核心任務為下列何項？","o":["設定日誌的儲存時間與刪除策略","確保日誌資料在傳輸與儲存過程中的完整性與機密性","將來自不同系統的日誌檔彙整到單一儲存庫","從大量的日誌資料中，識別出異常模式、安全威脅或營運問題的跡象"],"a":3,"e":"日誌分析的核心是從大量日誌中找出異常模式、威脅或營運問題；(A)(B)(C) 屬保存、保護、集中。"},{"id":"E2-41","i":"t8","s":"E","n":41,"q":"金融機構需要向稽核人員證明，他們已嚴格遵守「支付卡產業資料安全標準（PCI DSS)」中對於持卡人資料存取控制的要求。在這種情境下，日誌管理系統應產出下列何種報告，才能最直接且有效地滿足此項稽核需求？","o":["一份包含所有網路設備（如防火牆、路由器）流量的總體統計報告","一份關於系統所有軟體更新與漏洞修補安裝狀態的報告","一份關於系統管理員帳號所有活動的日誌報告","一份詳細列出所有成功與失敗的、針對儲存持卡人資料之伺服器與資料庫的存取紀錄報告"],"a":3,"e":"PCI DSS 要求追蹤所有對持卡人資料的存取，最直接的證據是針對持卡人資料伺服器與資料庫的成功／失敗存取紀錄。"},{"id":"E2-42","i":"t8","s":"E","n":42,"q":"某企業在導入 SIEM 後，告警數量暴增，導致 SOC 人員疲勞，反而錯失真正攻擊行為。上述問題最可能源自下列哪一項日誌管理決策？","o":["日誌存取權限設計過嚴","日誌來源涵蓋範圍不足","日誌事件告警規則設計失當","日誌保存時間設定過長"],"a":2,"e":"告警暴增造成告警疲勞，通常是關聯／告警規則設計失當，需調校門檻與降噪。"},{"id":"E2-43","i":"t8","s":"E","n":43,"q":"建立日誌管理系統時，為了防止攻擊者在入侵後刪除日誌軌跡，下列何者是最佳做法？","o":["僅在伺服器本機對日誌資料夾進行嚴格的存取權限控管","縮短日誌保留期限至 1 天","將日誌即時傳送到遠端獨立的日誌伺服器（Log Server）","將本機日誌檔案設定為隱藏與唯讀屬性（Read-Only）"],"a":2,"e":"即時把日誌轉送到遠端獨立日誌伺服器，入侵者即使取得本機權限也難以刪除完整軌跡。"},{"id":"E2-44","i":"t8","s":"E","n":44,"q":"下列哪一項資訊較「不」建議直接記錄在明文的系統日誌（Log）中，以免造成資訊洩露？","o":["來源 IP 位址","系統執行錯誤代碼","使用者的登入時間","使用者的明文密碼（Plaintext Password）"],"a":3,"e":"明文密碼絕不可寫入日誌，以免日誌外洩造成帳號被盜。"},{"id":"E2-45","i":"t11","s":"E","n":45,"q":"在 5G 行動通訊網路架構中，為了提供超低延遲服務，運算資源會從雲端移至靠近使用者的「邊緣運算（Edge Computing）」。從資安角度來看，邊緣運算面臨的主要挑戰為下列哪一項？","o":["後端伺服器的運算壓力過大，容易造成 DDoS 攻擊","資料傳輸路徑變長，導致攔截風險增加","物理節點分布廣泛且環境不安全，增加設備被物理接觸或破壞的風險","邊緣設備不需要加密，因此容易造成資料外洩"],"a":2,"e":"邊緣節點分散在各地、環境不受控，更容易遭物理接觸、竄改或破壞。"},{"id":"E2-46","i":"t11","s":"E","n":46,"q":"針對人工智慧（AI）模型，攻擊者透過輸入經過微小干擾的樣本（如在交通標誌貼上特定貼紙），誤導模型做出錯誤判斷。這種針對模型邏輯漏洞的攻擊稱為下列何項？","o":["阻斷服務攻擊（DoS）","後門攻擊（Backdoor Attack）","對抗性攻擊（Adversarial Attack）","社交工程攻擊（Social Engineering）"],"a":2,"e":"對抗性攻擊以人眼難察覺的微小擾動樣本，誤導 AI 模型的判斷結果。"},{"id":"E2-47","i":"t11","s":"E","n":47,"q":"在虛實整合系統（CPS）或工業控制環境（OT）中，資安防護邏輯與傳統辦公室環境（IT）有所不同。關於 OT 環境的特性，下列敘述何者正確？","o":["OT 設備生命週期較短，建議每 2-3 年即汰換","系統必須確保極高的可用性（Availability）","只要實施實體隔離（Air-gap）即可，就不需考慮病毒偵測或其他端點防禦機制","與 IT 環境相同，資料的機密性（Confidentiality）是最高指導原則"],"a":1,"e":"OT 環境以可用性（與人身安全）為最高優先，設備生命週期長，且即使隔離也仍需端點防護。"},{"id":"E2-48","i":"t11","s":"E","n":48,"q":"針對未來量子電腦可能破解現有的公鑰加密演算法（如 RSA、ECC），目前國際間資安標準正積極推動下列哪一種防禦技術？","o":["後量子密碼學（Post-Quantum Cryptography, PQC）","全面改用對稱式加解密（如 AES-128）取代所有非對稱加解密演算法","區塊鏈雜湊鏈結技術","增加 RSA 密鑰長度至 8192 bits 以上"],"a":0,"e":"後量子密碼學（PQC）設計可抵抗量子電腦攻擊的演算法，NIST 已發布 ML-KEM、ML-DSA 等標準。"},{"id":"E2-49","i":"t11","s":"E","n":49,"q":"AI SOC Agent 使用「端點紀錄（EDR/Sysmon）」分析比「網路流量（Network Traffic）」精準的主要原因，下列何項敘述較為適切？","o":["因為網路流量數據被加密，無法被 AI 讀取或分析","因為端點紀錄的儲存空間較小，AI 分析速度更快","因為端點紀錄可以呈現處理程序樹（Process Tree），辨識合法工具是否被異常調用","因為端點紀錄不需要考慮員工隱私問題"],"a":2,"e":"端點紀錄能呈現處理程序樹與命令列，可辨識 PowerShell 等合法工具被異常調用（Living off the Land）。"},{"id":"E2-50","i":"t11","s":"E","n":50,"q":"導入 AI SOC Agent 時，下列哪一項設計最有助於避免 AI 成為單點失效（Single Point of Failure）？","o":["持續提高 AI 模型處理未知資安事件的自動化回應比例","授權 AI 模型獨立進行端點設備的隔離決策","整合安全資訊與事件管理（SIEM）系統進行零人工的全自動化阻斷","應避免系統全自動化，採用關鍵處置環節設置斷點引入人工審核的分層決策機制"],"a":3,"e":"在關鍵處置設置人工審核斷點的分層決策，可避免 AI 誤判造成全面衝擊，降低單點失效風險。"}]};</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* =========================================================
   Data
   ========================================================= */
const { islands, questions } = window.DATA;
const QMAP = new Map(questions.map(q => [q.id, q]));
const HUB = { id:'hub', subj:0, name:'中央港口廣場', nick:'中央廣場', emoji:'⛲', q:0, r:0, chap:'群島總覽', sec:'', kp:[] };
const ALL = [HUB, ...islands];
const IMAP = new Map(ALL.map(i => [i.id, i]));
const QBY = {}; islands.forEach(i => QBY[i.id] = []); questions.forEach(q => QBY[q.i].push(q));
const SUBJ = { 1:'科目一 資訊安全管理概論', 2:'科目二 資訊安全技術概論' };
const SUBJ_SHORT = { 0:'群島總覽', 1:'科目一 管理', 2:'科目二 技術' };
const CHAP_COLOR = {
  '1|第四章 資訊安全管理系統':'#f5c376', '1|第五章 資產與風險管理':'#f3a28a', '1|第六章 存取控制、加解密與金鑰管理':'#eaa6c4', '1|第七章 事故管理與營運持續':'#c7b2e8',
  '2|第四章 網路與通訊安全':'#8fd3c1', '2|第五章 作業系統與應用程式安全':'#93c4ee', '2|第六章 資安維運技術':'#acd98b', '2|第七章 新興科技安全':'#9fb0f2'
};
const islandColor = i => i.id === 'hub' ? '#f1e2c6' : CHAP_COLOR[i.subj + '|' + i.chap];
const LETTERS = 'ABCD';
const srcLabel = q => q.s === 'G' ? '學習指引' : `115-1 試題 第${q.n}題`;
const srcLong = q => {
  const isl = IMAP.get(q.i);
  return q.s === 'G'
    ? `出處：學習指引（${SUBJ[isl.subj]}）${isl.chap}・${isl.sec}，解析為指引原文。`
    : `出處：115 年第一次資訊安全工程師初級能力鑑定公告試題（${SUBJ[isl.subj]}）第 ${q.n} 題。官方僅公布答案，解析為本站補充。`;
};

/* =========================================================
   Session store (memory + sessionStorage, no database)
   ========================================================= */
const KEY = 'aegis-isles-v1';
const store = { attempts: [], marks: new Set(), sound: true, music: true, fish: {}, introSeen: false };
try {
  const raw = sessionStorage.getItem(KEY);
  if (raw) { const s = JSON.parse(raw); store.attempts = s.attempts || []; store.marks = new Set(s.marks || []); store.sound = s.sound !== false; store.music = s.music !== false; store.fish = s.fish || {}; store.introSeen = !!s.introSeen; }
} catch (e) {}
function save() {
  try { sessionStorage.setItem(KEY, JSON.stringify({ attempts: store.attempts, marks: [...store.marks], sound: store.sound, music: store.music, fish: store.fish, introSeen: store.introSeen })); } catch (e) {}
}
function lastMap() { const m = new Map(); for (const a of store.attempts) m.set(a.q, a); return m; }
function islandStats(iid) {
  const lm = lastMap(); const pool = iid === 'hub' ? questions : QBY[iid];
  let answered = 0, correct = 0;
  for (const q of pool) { const a = lm.get(q.id); if (a) { answered++; if (a.ok) correct++; } }
  return { total: pool.length, answered, correct, acc: answered ? correct / answered : null };
}
function streak() { let s = 0; for (let k = store.attempts.length - 1; k >= 0 && store.attempts[k].ok; k--) s++; return s; }
function masteryColor(st) {
  if (!st.answered) return '#ffffff';
  if (st.acc >= .8) return '#3fb56f';
  if (st.acc >= .6) return '#f2b134';
  return '#e0574c';
}
function record(q, pick, ctx) {
  const ok = pick === q.a;
  store.attempts.push({ q: q.id, p: pick, ok, t: Date.now(), c: ctx });
  save(); refreshStats(); updateFlags();
  return ok;
}

/* =========================================================
   Utilities
   ========================================================= */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));

function buildPath(nodeIds, r, endRad = 1.35) {
  const out = [];

    const dir = B.pos.clone().sub(A.pos).normalize();
    if (j > 0) out.push({ p: jitter(A.pos, .5, r), node: A.id });
    const ex = A.pos.clone().addScaledVector(dir, AP - .5); ex.y = TOP; out.push({ p: ex, node: A.id });
    const en = B.pos.clone().addScaledVector(dir, -(AP - .5)); en.y = TOP;
    for (let s = 1; s < 6; s++) { const t = s / 6; const p = ex.clone().lerp(en, t); p.y = TOP + Math.sin(Math.PI * t) * .35; out.push({ p, node: B.id, bridge: true }); }
    out.push({ p: en, node: B.id });
  }
  const last = IMAP.get(nodeIds[nodeIds.length - 1]);
  out.push({ p: jitter(last.pos, endRad, r), node: last.id, end: true });
  return out;
}

}

function updateNPC(n, dt, t) {
  const g = n.g; let moving = false;

    const wp = n.wps[n.wi].p; const dx = wp.x - g.position.x, dz = wp.z - g.position.z; const dist = Math.hypot(dx, dz);

      if (n.wi >= n.wps.length) { n.wps = []; n.wi = 0; n.wait = n.isMain ? 1e9 : 1.5 + n.rnd() * 5; if (n.onArrive) { const f = n.onArrive; n.onArrive = null; f(); } }

      const r = n.rnd(); let tgt;
      if (r < .3) tgt = ADJ.get(n.node)[Math.floor(n.rnd() * ADJ.get(n.node).length)];

  n.legL.rotation.x = sw; n.legR.rotation.x = -sw; n.armL.rotation.x = -sw * .8; n.armR.rotation.x = sw * .8;

/* =========================================================
   Camera framing (view offset for the side panel / sheet)
   ========================================================= */
let offX = 0, offY = 0, wantOffX = 0, wantOffY = 0;
function computeOffsets() {
  const p = $('#panel'); const mobile = innerWidth <= 760;
  if (mobile) { wantOffX = 0; wantOffY = p.hidden ? 0 : p.getBoundingClientRect().height * .9; return; }
  const L = $('#guide').getBoundingClientRect().right + 4;
  const R = p.hidden ? 0 : (innerWidth - p.getBoundingClientRect().left) + 8;
  wantOffX = R - L; wantOffY = 0;
}
function applyView() {
  const w = innerWidth, h = innerHeight;
  camera.aspect = w / h;
  if (Math.abs(offX) > 1 || offY > 1) camera.setViewOffset(w + Math.abs(offX), h + offY, Math.max(0, offX), offY, w, h); else camera.clearViewOffset();
  camera.updateProjectionMatrix();
}
function onResize() { renderer.setSize(innerWidth, innerHeight, false); computeOffsets(); offX = wantOffX; offY = wantOffY; applyView(); }
addEventListener('resize', onResize);

let fly = null; let follow = false;
function flyTo(target, dist, dur = 1.3) {
  const dir = camera.position.clone().sub(controls.target).normalize();
  if (dir.y < .45) { dir.y = .62; dir.normalize(); }
  const toT = target.clone(); const toP = toT.clone().addScaledVector(dir, dist);
  if (reduced) { controls.target.copy(toT); camera.position.copy(toP); return; }
  fly = { t: 0, dur, fromT: controls.target.clone(), toT, fromP: camera.position.clone(), toP };
}
controls.addEventListener('start', () => { fly = null; follow = false; });
const HOME_T = new THREE.Vector3(0, 0, 2), HOME_DIR = new THREE.Vector3(0, 70, 80).normalize();
function homeDist() {
  const mobile = innerWidth <= 760; const t = Math.tan(THREE.MathUtils.degToRad(16));
  const freeW = mobile ? innerWidth : innerWidth - Math.abs(wantOffX) - ($('#panel').hidden ? 0 : 0);
  const freeH = innerHeight - (mobile ? wantOffY : 0);
  const d = Math.max(22 / t * (innerHeight / Math.max(300, freeH)), 31 / (t * (freeW / innerHeight)));
  return Math.min(d, mobile ? 175 : 150);
}
function goHome(dur = 1.2) { follow = false; computeOffsets(); const d = homeDist(); const toP = HOME_T.clone().addScaledVector(HOME_DIR, d); if (reduced || !dur) { controls.target.copy(HOME_T); camera.position.copy(toP); return; } fly = { t: 0, dur, fromT: controls.target.clone(), toT: HOME_T.clone(), fromP: camera.position.clone(), toP }; }

const ray = new THREE.Raycaster(); const ptr = new THREE.Vector2(); let hoverId = null, hoverNpc = null; let downAt = null; let lastMove = null;
const npcMeshes = []; npcs.forEach(n => n.g.traverse(o => { if (o.isMesh) npcMeshes.push(o); }));
function pick(cx, cy) {
  const rect = canvas.getBoundingClientRect();
  ptr.x = ((cx - rect.left) / rect.width) * 2 - 1; ptr.y = -((cy - rect.top) / rect.height) * 2 + 1;
  ray.setFromCamera(ptr, camera);
  const hn = ray.intersectObjects(npcMeshes, false)[0];
  const hi = ray.intersectObjects(pickables, false)[0];
  if (hn && (!hi || hn.distance < hi.distance + .5)) return { npc: hn.object.userData.npc };
  if (hi) return { island: hi.object.userData.id };
  return {};
}
canvas.addEventListener('pointerdown', e => { downAt = { x: e.clientX, y: e.clientY }; });
canvas.addEventListener('pointermove', e => { lastMove = { x: e.clientX, y: e.clientY }; });
canvas.addEventListener('pointerleave', () => { lastMove = null; hoverId = null; hoverNpc = null; });
canvas.addEventListener('pointerup', e => {
  if (!downAt || Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y) > 6) return; downAt = null;
  const r = pick(e.clientX, e.clientY);
  if (r.npc) talk(r.npc); else if (r.island) selectIsland(r.island);
});
function hoverTick() {
  if (!lastMove) { canvas.style.cursor = ''; return; }
  const r = pick(lastMove.x, lastMove.y);
  hoverNpc = r.npc || null; if (!iLabelHover()) hoverId = r.island || null;
  canvas.style.cursor = (r.npc || r.island) ? 'pointer' : 'grab';
}

function selectIsland(id, o = {}) {

  if (fishingMode) stopFishing();
  if (exam && exam.done) exam = null;
  current = isl;
  if (o.quiz) { startQuiz(id, o.quiz.list, o.quiz.label); tab = 'quiz'; }
  else if (!quiz || quiz.iid !== id) { quiz = null; tab = 'info'; }
  openPanel(); renderPanel();
  // the hero walks there in sync
  sendTo(hero, id, .9);
  hero.onArrive = () => { hero.vy = 6; if (!exam) say(hero, `抵達 ${isl.emoji} ${esc(isl.nick)}！`, 'big', 1800); hero.g.rotation.y = Math.atan2(camera.position.x - hero.g.position.x, camera.position.z - hero.g.position.z); };

function subjStats(s) { const lm = lastMap(); let a = 0, c = 0; for (const q of questions) { if (IMAP.get(q.i).subj !== s) continue; const x = lm.get(q.id); if (x) { a++; if (x.ok) c++; } } return { answered: a, correct: c, acc: a ? c / a : null }; }

function buildList(iid) {
  let pool = iid === 'hub' ? questions.slice() : QBY[iid].slice();
  if (opts.source !== 'all') pool = pool.filter(q => q.s === opts.source);
  const lm = lastMap();
  if (opts.order === 'new') pool = pool.filter(q => !lm.has(q.id));
  if (opts.order === 'wrong') pool = pool.filter(q => lm.has(q.id) && !lm.get(q.id).ok);
  if (opts.order === 'mark') pool = pool.filter(q => store.marks.has(q.id));
  if (opts.order !== 'seq') pool = shuffle(pool);
  if (iid === 'hub' && opts.order !== 'seq') pool = pool.slice(0, 20);
  return pool.map(q => q.id);
}

function questionHTML(q, pick, n, total, ctxLabel, instant = true) {

panel.addEventListener('click', e => {

function startExam(subj, n, instant) {

const elapsed = () => { const s = Math.floor((Date.now() - exam.start) / 1000); return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`; };

function examPick(k) {

  exam.picks.set(q.id, k); const ok = record(q, k, 'exam');

function examNext() { if (exam.done) return; if (exam.idx + 1 >= exam.list.length) { finishExam(); return; } exam.idx++; renderExam(); $('#pbody').scrollTop = 0; walkToExamQ(); }
function finishExam() {

  renderExam(); sendTo(hero, 'hub', .9); hero.onArrive = () => { hero.vy = 7; };
  const sc = examScore(); say(hero, sc >= 70 ? `${sc} 分，過關！` : `${sc} 分，繼續加油`, 'big ' + (sc >= 70 ? 'ok' : 'no'), 2600); beep(sc >= 70);

function examScore() { let ok = 0; for (const id of exam.list) if (exam.picks.get(id) === QMAP.get(id).a) ok++; return Math.round(ok / exam.list.length * 100); }

  if (k != null) { e.preventDefault(); doPick(k); }
  else if (e.key === 'Enter' || e.key === 'ArrowRight') {
    const ae = document.activeElement; if (e.key === 'Enter' && ae && ae.tagName === 'BUTTON' && !ae.disabled && !ae.classList.contains('opt')) return;
    const nb = panel.querySelector('[data-act="next"]'); if (nb) { e.preventDefault(); nb.click(); } }
  else if (e.key === 'ArrowLeft') { const pb = panel.querySelector('[data-act="prev"]'); if (pb && !pb.disabled) pb.click(); }
});

/* =========================================================
   Intro
   ========================================================= */
function showIntro() {
  const m = $('#modal');
  m.innerHTML = `<div class="intro card" role="dialog" aria-modal="true" aria-labelledby="in-h"><h2 id="in-h">歡迎來到守盾群島</h2>
  <p>這座玩具城由 21 座六角小島組成，把 iPAS 資訊安全工程師（初級）兩個考科的 20 個主題變成可以走逛的島嶼，共 ${questions.length} 題，每題作答後立即公布答案與解析。</p>
  <ul><li><span>🖱️</span><div>拖曳旋轉、滾輪縮放、右鍵平移。點一座島就能看重點、開始答題。</div></li>
  <li><span>🧢</span><div>戴黃帽、披紅披風的是你的分身<b>小盾</b>。你選哪座島，他就走過橋去那裡。</div></li>
  <li><span>💬</span><div>點路上的居民，會聽到他們分享的考點。</div></li>
  <li><span>🎣</span><div>到<b>釣魚碼頭</b>拋竿，釣到的魚會帶來一個觀念和一道題，答對就收進魚圖鑑。</div></li>
  <li><span>🚩</span><div>島上旗子顯示熟練度：白色未作答、紅色低於 60%、黃色低於 80%、綠色 80% 以上。</div></li></ul>
  <div class="legend"><span><i class="flagdot" style="background:var(--m)"></i>西側暖色島：科目一 管理</span><span><i class="flagdot" style="background:var(--t)"></i>東側冷色島：科目二 技術</span></div>
  <label style="display:flex;align-items:center;gap:8px;margin:-4px 0 12px;font-size:13.5px"><input type="checkbox" id="intro-music" ${store.music ? 'checked' : ''}> 播放凱爾特風配樂（之後可用下方「配樂」按鈕開關）</label>
  <button class="btn pri wide" data-m="go">開始探索</button></div>`;
  m.hidden = false;
  m.onclick = e => { if (e.target === m || e.target.closest('[data-m="go"]')) { const cb = $('#intro-music'); store.music = !!(cb && cb.checked); if (store.music) musicStart(); m.hidden = true; store.introSeen = true; save(); } };
  setTimeout(() => $('[data-m="go"]', m)?.focus(), 50);
}

/* =========================================================
   Loop
   ========================================================= */

const clock = new THREE.Clock(); let hoverT = 0;
function loop() {
  const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime;
  waterU.uTime.value = t;
  for (const n of npcs) updateNPC(n, dt, t);
  fishTick(dt, t);
  for (const n of npcs) {
    const cur = n.wps[n.wi]; const prevWp = n.wps[n.wi - 1];
    let y = TOP; if (cur && cur.bridge) { const a = prevWp ? prevWp.p : cur.p; const d0 = Math.hypot(cur.p.x - a.x, cur.p.z - a.z) || 1; const d1 = Math.hypot(cur.p.x - n.g.position.x, cur.p.z - n.g.position.z); y = cur.p.y + (a.y - cur.p.y) * Math.min(1, d1 / d0); }
    else if (cur && prevWp && prevWp.bridge) { const d0 = Math.hypot(cur.p.x - prevWp.p.x, cur.p.z - prevWp.p.z) || 1; const d1 = Math.hypot(cur.p.x - n.g.position.x, cur.p.z - n.g.position.z); y = cur.p.y + (prevWp.p.y - cur.p.y) * Math.min(1, d1 / d0); }
    n.g.position.y = y + (n.g.userData.yOff || 0);
  }
  for (const c of clouds) { c.position.x += c.userData.v * dt; if (c.position.x > 120) c.position.x = -120; }
  for (const b of boats) { const u = b.userData; u.a += u.v * dt; b.position.set(Math.cos(u.a) * u.r, -.25 + Math.sin(t * 1.6 + u.r) * .08, Math.sin(u.a) * u.r * .8); b.rotation.y = -u.a; b.rotation.z = Math.sin(t * 1.3 + u.r) * .05; }
  for (const [id, o] of islandObj) {
    const lm = o.lm.userData;
    if (lm.spin) lm.spin.rotation.y += dt * 1.2;
    if (lm.spin2) lm.spin2.rotation.y = Math.sin(t * .8) * .6;
    if (lm.hand) lm.hand.rotation.z = -t * .8;
    if (lm.float) lm.float.position.y = 3 + Math.sin(t * 1.2) * .15;
    if (lm.bubble) lm.bubble.position.y = .85 + (t * .6 % 1) * .4;
    if (lm.jet) lm.jet.scale.setScalar(1 + Math.sin(t * 6) * .15);
    if (lm.waves) lm.waves.forEach(w => { const s = 1 + ((t * .7 + w.userData.wave * .33) % 1) * .8; w.scale.set(s, s, s); });
    const want = (hoverId === id ? .22 : 0) + (current && current.id === id ? .14 : 0);
    o.topM.emissive.copy(o.baseColor); o.topM.emissiveIntensity += (want - o.topM.emissiveIntensity) * Math.min(1, dt * 8);
    o.flag.rotation.y = Math.sin(t * 3 + o.grp.position.x) * .25;
  }
  // camera
  if (fly) {
    fly.t += dt / fly.dur; const k = fly.t >= 1 ? 1 : 1 - Math.pow(1 - fly.t, 3);
    controls.target.lerpVectors(fly.fromT, fly.toT, k); camera.position.lerpVectors(fly.fromP, fly.toP, k);
    if (fly.t >= 1) fly = null;
  } else if (follow) {
    const goal = hero.g.position.clone(); goal.y = TOP;
    const d = goal.sub(controls.target).multiplyScalar(1 - Math.exp(-dt * 3.5));
    controls.target.add(d); camera.position.add(d);
    if (!hero.wps.length && d.length() < .002) follow = false;
  }
  // view offset easing
  offX += (wantOffX - offX) * Math.min(1, dt * 7); offY += (wantOffY - offY) * Math.min(1, dt * 7); applyView();
  controls.update();
  if ((hoverT += dt) > .06) { hoverT = 0; hoverTick(); }
  renderer.render(scene, camera);
  updateLabels();
  requestAnimationFrame(loop);
}

/* boot */
setupPierLabel(); onResize(); applyTheme(); refreshStats(); setSoundBtn(); updateFlags(); goHome(0);
requestAnimationFrame(loop);
const fromHash = () => { const h = location.hash.slice(1); if (h === 'fishing') { if (!fishingMode) goFishing(); } else if (IMAP.has(h)) selectIsland(h); };
addEventListener('hashchange', fromHash);
if (location.hash && (IMAP.has(location.hash.slice(1)) || location.hash === '#fishing')) setTimeout(fromHash, 300);
else if (!store.introSeen) showIntro();
setTimeout(() => { say(npcs[0], `<b>${npcs[0].name}</b>：歡迎！點我們聊天也能學考點喔。`, '', 4000); }, 1800);
addEventListener('pointerdown', function first() { removeEventListener('pointerdown', first, true); if (store.music && store.introSeen && !music.on) musicStart(); }, true);
window.__aegis = { fish, goFishing, selectIsland, store, doPick, questions, openHistory, startExam };
